@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function campoTxt(id,rot,val,ph,dica,tipo){return '<div class="campo"><label for="'+id+'">'+rot+'</label><input type="'+(tipo||'text')+'" id="'+id+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"'+(tipo==='tel'?' inputmode="numeric"':'')+'>'+(dica?'<small>'+dica+'</small>':'')+'</div>'}
function radios(nome,rot,ops,val){return '<div class="campo" role="radiogroup" aria-label="'+esc(rot)+'"><span class="rot">'+rot+'</span><div class="ops">'+ops.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<label class="op"><input type="radio" name="'+nome+'" value="'+esc(v)+'"'+(val===v?' checked':'')+'><span>'+esc(t)+'</span></label>'}).join('')+'</div></div>'}
function checks(nome,rot,ops,vals){vals=vals||[];return '<div class="campo"><span class="rot">'+rot+'</span><div class="ops">'+ops.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<label class="op"><input type="checkbox" name="'+nome+'" value="'+esc(v)+'"'+(vals.indexOf(v)>=0?' checked':'')+'><span>'+esc(t)+'</span></label>'}).join('')+'</div></div>'}

function telaPasso(){
  var r=C.ramo,h='';
  if(passo===0){h='<h2>Que tipo de empresa é a sua?</h2><p class="sub">Assim eu já faço as perguntas certas para o seu ramo.</p><div class="ramos" role="radiogroup" aria-label="Tipo de empresa">'+RAMOS.map(function(x){return '<label class="op"><input type="radio" name="ramo" value="'+x[0]+'"'+(r===x[0]?' checked':'')+'><span><b aria-hidden="true">'+x[1]+'</b>'+x[2]+'</span></label>'}).join('')+'</div>'}
  else if(passo===1){var e=C.empresa;h='<h2>Sua empresa</h2><p class="sub">Esses dados vão no contrato e o agente usa o endereço e o Instagram nas respostas.</p>'+campoTxt('e-nome','Nome da empresa (como os clientes conhecem)',e.nome,'Ex.: Sorriso Perfeito')+campoTxt('e-razao','Razão social',e.razao,'Deixe vazio se for o mesmo nome')+campoTxt('e-doc','CNPJ ou CPF',e.doc,'00.000.000/0000-00','','tel')+campoTxt('e-end','Endereço',e.endereco,'Rua, número, bairro')+campoTxt('e-cid','Cidade',e.cidade,'Ex.: Recife/PE')+campoTxt('e-insta','Instagram (opcional)',e.instagram,'@suaempresa')+'<div class="campo"><label for="e-desc">Em uma frase, o que a empresa oferece de melhor? (opcional)</label><textarea id="e-desc" placeholder="Ex.: clínica com atendimento humanizado e avaliação gratuita">'+esc(e.descricao||'')+'</textarea></div>'}
  else if(passo===2){var d=C.dono;h='<h2>Responsável</h2><p class="sub">Quem assina o contrato.</p>'+campoTxt('d-nome','Nome completo',d.nome,'Como no documento')+campoTxt('d-cpf','CPF',d.cpf,'000.000.000-00','','tel')+campoTxt('d-email','E-mail',d.email,'voce@email.com','','email')+campoTxt('d-zap','WhatsApp',d.whatsapp,'(81) 99999-9999','','tel')+radios('cargo','Você é',['Dono(a)','Sócio(a)','Gerente','Outro'],d.cargo)}
  else if(passo===3){h='<h2>Horário de funcionamento</h2><p class="sub">Toque nos dias em que vocês abrem.</p><div class="atalhos"><button class="mini" type="button" data-pre="semana">Seg a sex, 8h às 18h</button><button class="mini" type="button" data-pre="sabado">Seg a sex 8h–18h e sáb 8h–12h</button><button class="mini" type="button" data-pre="comercio">Seg a sáb, 9h às 19h</button></div><div class="dias">'+DIAS.map(function(x){var v=C.horarios[x[0]]||{};return '<div class="dia"><label class="op"><input type="checkbox" data-dia="'+x[0]+'"'+(v.aberto?' checked':'')+'><span>'+x[1]+'</span></label><div class="hs'+(v.aberto?'':' off')+'" id="hs-'+x[0]+'"><input type="time" aria-label="'+x[1]+' abre" data-abre="'+x[0]+'" value="'+esc(v.abre||'08:00')+'"><span>às</span><input type="time" aria-label="'+x[1]+' fecha" data-fecha="'+x[0]+'" value="'+esc(v.fecha||'18:00')+'"></div></div>'}).join('')+'</div>'+radios('fora','Quando alguém escrever com a empresa fechada, o agente',[['responde','Responde normalmente e já agenda/anota'],['avisa','Responde e avisa que a equipe confirma ao abrir']],C.atendimento.fora_horario)}
  else if(passo===4){var sg=(SUG[r]||[]).filter(function(n){return !C.servicos.some(function(s){return s.nome===n})});h='<h2>Serviços e preços</h2><p class="sub">O que o cliente mais pergunta. Se o preço varia, escreva "a partir de" ou deixe vazio.</p>'+(sg.length?'<div class="atalhos">'+sg.map(function(n){return '<button class="mini" type="button" data-sug="'+esc(n)+'">+ '+esc(n)+'</button>'}).join('')+'</div>':'')+'<div id="servs">'+C.servicos.map(function(s,i){return '<div class="serv"><input type="text" aria-label="Serviço" data-s="nome" data-i="'+i+'" value="'+esc(s.nome)+'" placeholder="Serviço"><input type="text" aria-label="Preço" data-s="preco" data-i="'+i+'" value="'+esc(s.preco)+'" placeholder="Preço"><button type="button" data-rm="'+i+'" aria-label="Tirar '+esc(s.nome||'serviço')+'">×</button></div>'}).join('')+'</div><button class="mini" type="button" id="add-serv">+ Outro serviço</button><div style="height:18px"></div>'+checks('pag','Formas de pagamento',[['pix','Pix'],['credito','Cartão de crédito'],['debito','Cartão de débito'],['dinheiro','Dinheiro'],['boleto','Boleto'],['transferencia','Transferência'],['convenio','Convênio']],C.pagamentos)+campoTxt('parc','Parcelamento (opcional)',C.parcela,'Ex.: até 10x sem juros no cartão')}
  else if(passo===5){var qs=Q[r]||Q.outro;h='<h2>Sobre o seu ramo</h2><p class="sub">Perguntas que os clientes de '+esc((RAMOS.find(function(x){return x[0]===r})||RAMOS[7])[2].toLowerCase())+' costumam fazer.</p>'+qs.map(function(q){if(q.se&&C.especificas[q.se[0]]!==q.se[1])return '';var v=C.especificas[q.k];if(q.r)return radios('q-'+q.k,q.t,q.r,v);if(q.c)return checks('q-'+q.k,q.t,q.c,v);return campoTxt('q-'+q.k,q.t,v,q.x)}).join('')}
  else if(passo===6){var a=C.atendimento;h='<h2>Como o agente atende</h2><p class="sub">O jeito de falar e o que ele faz sozinho.</p>'+campoTxt('a-nome','Nome do atendente (opcional)',a.assistente,'Ex.: Bia','Se deixar vazio, ele se apresenta como a equipe da empresa.')+radios('tom','Jeito de falar',[['formal','Formal (senhor/senhora)'],['proximo','Próximo e simpático'],['descontraido','Bem descontraído']],a.tom)+radios('emo','Pode usar emojis?',[['sim','Pode, com moderação'],['nao','Prefiro sem emojis']],a.emojis)+radios('agenda','Agendamento',[['agente','O agente marca o horário'],['pre','Ele anota e a equipe confirma'],['nao','Não trabalhamos com agenda']],C.agenda.usa)+(C.agenda.usa==='agente'?radios('dur','Quanto tempo dura cada atendimento?',['20 minutos','30 minutos','40 minutos','1 hora','Varia'],C.agenda.duracao):'')+checks('chamar','Quando ele deve chamar alguém da equipe?',[['fechar','Quando o cliente quiser pagar ou fechar'],['negociacao','Pedido de desconto'],['reclamacao','Reclamação'],['urgencia','Urgência'],['pessoa','Quando pedir para falar com uma pessoa'],['fora','Pergunta que ele não sabe responder']],C.chamar)}
  else{var a2=C.atendimento,d2=C.dono,e2=C.empresa,hs=DIAS.filter(function(x){return (C.horarios[x[0]]||{}).aberto}).map(function(x){var v=C.horarios[x[0]];return x[1].slice(0,3)+' '+v.abre+'–'+v.fecha}).join(', ');
    h='<h2>Revisar e enviar</h2><p class="sub">Confira e, se quiser, deixe alguma orientação a mais para o agente.</p><div class="resumo"><div><b>Empresa</b><span>'+esc(e2.nome||'—')+(e2.cidade?' · '+esc(e2.cidade):'')+'</span></div><div><b>Responsável</b><span>'+esc(d2.nome||'—')+(d2.whatsapp?' · '+esc(d2.whatsapp):'')+'</span></div><div><b>Horários</b><span>'+esc(hs||'—')+'</span></div><div><b>Serviços</b><span>'+esc(C.servicos.map(function(s){return s.nome+(s.preco?' ('+s.preco+')':'')}).join(', ')||'—')+'</span></div><div><b>Atendente</b><span>'+esc((a2.assistente||'Equipe da empresa')+' · '+({formal:'formal',proximo:'próximo',descontraido:'descontraído'}[a2.tom]||''))+'</span></div></div><div style="height:18px"></div>'+
      '<div class="campo"><label for="faq">Perguntas que os clientes sempre fazem, com a resposta (opcional)</label><textarea id="faq" placeholder="Ex.: Tem estacionamento? Sim, na rua ao lado.">'+esc(C.faq||'')+'</textarea></div>'+
      '<div class="campo"><label for="naofalar">Algo que o agente nunca deve falar ou prometer? (opcional)</label><textarea id="naofalar" placeholder="Ex.: não dar desconto; não falar de preço de implante sem avaliação">'+esc(C.nao_falar||'')+'</textarea></div>'+
      '<div class="campo"><label for="extras">Mais alguma orientação? (opcional)</label><textarea id="extras">'+esc(C.extras||'')+'</textarea></div>'}
  return '<div class="card"><div class="prog" aria-hidden="true"><i style="width:'+((passo+1)*100/PASSOS.length)+'%"></i></div><p class="passo-n">Etapa '+(passo+1)+' de '+PASSOS.length+' · '+PASSOS[passo]+'</p><div id="err"></div>'+h+'</div>';
}
function lerPasso(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():undefined};
  var rv=function(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:undefined};
  var cv=function(n){return Array.prototype.map.call(document.querySelectorAll('input[name="'+n+'"]:checked'),function(e){return e.value})};
  if(passo===0){var r=rv('ramo');if(r)C.ramo=r}
  if(passo===1){C.empresa={nome:v('e-nome'),razao:v('e-razao'),doc:v('e-doc'),endereco:v('e-end'),cidade:v('e-cid'),instagram:v('e-insta'),descricao:v('e-desc')}}
  if(passo===2){C.dono={nome:v('d-nome'),cpf:v('d-cpf'),email:v('d-email'),whatsapp:v('d-zap'),cargo:rv('cargo')}}
  if(passo===3){DIAS.forEach(function(x){var k=x[0];C.horarios[k]={aberto:!!document.querySelector('[data-dia="'+k+'"]:checked'),abre:document.querySelector('[data-abre="'+k+'"]').value,fecha:document.querySelector('[data-fecha="'+k+'"]').value}});C.atendimento.fora_horario=rv('fora')||C.atendimento.fora_horario}
  if(passo===4){document.querySelectorAll('[data-s]').forEach(function(e){var i=+e.dataset.i;if(C.servicos[i])C.servicos[i][e.dataset.s]=e.value.trim()});C.pagamentos=cv('pag');C.parcela=v('parc')}
  if(passo===5){(Q[C.ramo]||Q.outro).forEach(function(q){if(q.r){var x=rv('q-'+q.k);if(x!==undefined)C.especificas[q.k]=x}else if(q.c)C.especificas[q.k]=cv('q-'+q.k);else{var t=v('q-'+q.k);if(t!==undefined)C.especificas[q.k]=t}})}
  if(passo===6){C.atendimento.assistente=v('a-nome');C.atendimento.tom=rv('tom')||C.atendimento.tom;C.atendimento.emojis=rv('emo')||C.atendimento.emojis;C.agenda.usa=rv('agenda')||C.agenda.usa;C.agenda.duracao=rv('dur')||C.agenda.duracao;C.chamar=cv('chamar')}
  if(passo===7){C.faq=v('faq');C.nao_falar=v('naofalar');C.extras=v('extras')}
}
function validar(){
  var dg=function(t){return String(t||'').replace(/\D/g,'')};
  if(passo===0&&!C.ramo)return 'Escolha o tipo de empresa.';
  if(passo===1&&!C.empresa.nome)return 'Escreva o nome da empresa.';
  if(passo===2){if(String(C.dono.nome||'').split(/\s+/).length<2)return 'Escreva o nome completo do responsável.';if(!cpfOk(C.dono.cpf))return 'Confira o CPF: ele precisa ter 11 números válidos.';if(dg(C.dono.whatsapp).length<10)return 'Escreva o WhatsApp com DDD.'}
  if(passo===3&&!DIAS.some(function(x){return (C.horarios[x[0]]||{}).aberto}))return 'Marque pelo menos um dia de funcionamento.';
  return '';
}
function cpfOk(c){c=String(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;var s=0,i;for(i=0;i<9;i++)s+=+c[i]*(10-i);var d=(s*10)%11%10;if(d!==+c[9])return false;s=0;for(i=0;i<10;i++)s+=+c[i]*(11-i);return (s*10)%11%10===+c[10]}
function mascara(e){var d=e.value.replace(/\D/g,'');if(e.id==='d-cpf'){d=d.slice(0,11);e.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4')}else if(e.id==='d-zap'){d=d.slice(0,11);e.value=d.length>10?d.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3'):d.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3').replace(/[-\s()]+$/,'')}else if(e.id==='e-doc'){d=d.slice(0,14);e.value=d.length>11?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/,'$1.$2.$3/$4-$5'):d.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,'$1.$2.$3-$4')}}
function guardar(){try{localStorage.setItem('impl-'+TOKEN,JSON.stringify({C:C,passo:passo}))}catch(e){}clearTimeout(tSalvar);$('#salvo').textContent='Salvando…';tSalvar=setTimeout(function(){api('salvar',{cadastro:C}).then(function(j){$('#salvo').textContent=j.error?'Não salvou agora':'Salvo ✓'})},1200)}
function cadastro(){
  topo('Cadastro da implantação','Plano '+D.plano+' · leva uns 5 minutos. Dá para parar e continuar depois.');
  var loc=null;try{loc=JSON.parse(localStorage.getItem('impl-'+TOKEN)||'null')}catch(e){}
  var base=D.cadastro||{};C=Object.assign(C,base);['empresa','dono','atendimento','horarios','agenda','especificas'].forEach(function(k){C[k]=Object.assign({},C[k]||{},base[k]||{})});
  if(!C.ramo){var sg=(D.segmento||'').toLowerCase();C.ramo=/odonto|dent/.test(sg)?'odonto':/advoc|jur/.test(sg)?'advocacia':/restaur|pizz|lanch|deliv|hamb/.test(sg)?'restaurante':/barb|sal[aã]o|est[eé]t|beleza/.test(sg)?'beleza':/academ|crossfit|pilates/.test(sg)?'academia':/pet|veterin/.test(sg)?'pet':/cl[ií]nic|m[eé]dic|fisio|psic/.test(sg)?'clinica':undefined}
  if(loc&&loc.C){C=loc.C;passo=Math.min(loc.passo||0,PASSOS.length-1)}
  if(!(C.servicos||[]).length)C.servicos=[];
  $('#nav').hidden=false;desenhar();
}
function desenhar(){app.innerHTML=telaPasso();$('#voltar').style.visibility=passo?'visible':'hidden';$('#seguir').textContent=passo===PASSOS.length-1?'Enviar cadastro':'Continuar';var f=app.querySelector('input,textarea');if(f&&passo&&window.innerWidth>700)f.focus({preventScroll:true});window.scrollTo(0,0)}
app.addEventListener('input',function(e){if(/^(d-cpf|d-zap|e-doc)$/.test(e.target.id))mascara(e.target);if(PAG==='cadastro'){lerPasso();guardar()}});
app.addEventListener('change',function(e){if(PAG!=='cadastro')return;var t=e.target;if(t.dataset.dia){document.getElementById('hs-'+t.dataset.dia).classList.toggle('off',!t.checked)}lerPasso();guardar();if((passo===5&&t.type==='radio')||(passo===6&&t.name==='agenda')||(passo===0&&t.name==='ramo')){var y=window.scrollY;desenhar();window.scrollTo(0,y);}});
app.addEventListener('click',function(e){if(PAG!=='cadastro')return;if(passo===0&&e.target.closest('.ramos .op')&&e.detail!==0){clearTimeout(window._av);window._av=setTimeout(function(){lerPasso();if(C.ramo)$('#seguir').click()},220);return}var t=e.target.closest('button');if(!t)return;
  if(t.dataset.pre){var p=t.dataset.pre;DIAS.forEach(function(x,i){var k=x[0];C.horarios[k]=p==='semana'?{aberto:i<5,abre:'08:00',fecha:'18:00'}:p==='sabado'?{aberto:i<6,abre:'08:00',fecha:i===5?'12:00':'18:00'}:{aberto:i<6,abre:'09:00',fecha:'19:00'}});guardar();desenhar()}
  if(t.dataset.sug){lerPasso();C.servicos.push({nome:t.dataset.sug,preco:''});guardar();desenhar();var ins=document.querySelectorAll('[data-s="preco"]');if(ins.length)ins[ins.length-1].focus()}
  if(t.id==='add-serv'){lerPasso();C.servicos.push({nome:'',preco:''});desenhar();var ns=document.querySelectorAll('[data-s="nome"]');ns[ns.length-1].focus()}
  if(t.dataset.rm){lerPasso();C.servicos.splice(+t.dataset.rm,1);guardar();desenhar()}
});
$('#voltar').addEventListener('click',function(){lerPasso();passo=Math.max(0,passo-1);guardar();desenhar()});
$('#seguir').addEventListener('click',function(){
  lerPasso();var er=validar();if(er){$('#err').innerHTML='<div class="erro" role="alert">'+esc(er)+'</div>';return}
  if(passo===4)C.servicos=C.servicos.filter(function(x){return x.nome});
  if(passo<PASSOS.length-1){passo++;guardar();desenhar();return}
  var b=$('#seguir');b.disabled=true;b.textContent='Enviando…';
  api('enviar',{cadastro:C}).then(function(j){b.disabled=false;b.textContent='Enviar cadastro';
    if(j.error){$('#err').innerHTML='<div class="erro" role="alert">'+esc(j.error)+'</div>';window.scrollTo(0,0);return}
    try{localStorage.removeItem('impl-'+TOKEN)}catch(e){}
    $('#nav').hidden=true;topo('Cadastro enviado','Obrigado! Agora é só assinar o contrato.');
    app.innerHTML='<div class="card feito"><div class="ico" aria-hidden="true">✓</div><h2>Recebemos tudo!</h2><p>O contrato já foi liberado. Também mandei o link no seu WhatsApp.</p><div style="height:20px"></div><a class="btn btn-luz" href="/contrato/'+TOKEN+'">Ler e assinar o contrato</a></div>';
  });
});

/* ================= CONTRATO ================= */
function contrato(){
  if(D.status==='cadastro'){topo('Contrato');app.innerHTML='<div class="card vazio">O contrato é liberado assim que o cadastro for enviado.<br><br><a class="btn btn-luz" href="/cadastro/'+TOKEN+'">Preencher o cadastro</a></div>';return}
  var assinado=D.status!=='contrato';
  topo(assinado?'Contrato assinado':'Seu contrato','Plano '+D.plano+' · '+esc(D.empresa));
  var dt=D.assinado_em?new Date(D.assinado_em).toLocaleString('pt-BR'):'';
  app.innerHTML='<div class="card"><div class="kpis"><div class="kpi"><b>'+brl(D.valor_implantacao)+'</b><span>Implantação · 50% no início e 50% na entrega</span></div><div class="kpi"><b>'+brl(D.valor_mensal)+'</b><span>Por mês · a primeira vence 30 dias depois de começar</span></div><div class="kpi"><b>Até 7 dias</b><span>Para o agente ficar pronto</span></div></div>'+
    '<div class="contrato" tabindex="0" aria-label="Texto do contrato">'+esc(D.contrato||'')+'</div>'+
    (assinado?'<div class="assina"><div class="erro" style="background:#E3F7EF;color:#0B6B4D">✓ Assinado por '+esc(D.assinatura&&D.assinatura.nome)+' em '+esc(dt)+'</div><a class="btn btn-luz" href="/teste/'+TOKEN+'">Testar o agente</a></div>':
    '<form class="assina" id="fa"><div id="err"></div>'+campoTxt('s-nome','Seu nome completo','', 'Como no documento')+campoTxt('s-cpf','Seu CPF','','000.000.000-00','O mesmo CPF informado no cadastro.','tel')+'<label class="op"><input type="checkbox" id="s-ok"><span>Li e concordo com este contrato</span></label><button class="btn btn-luz" type="submit">Assinar contrato</button><small style="color:var(--nevoa)">A assinatura fica registrada com nome, CPF, data, hora e endereço IP.</small></form>')+'</div>';
  var f=$('#fa');if(!f)return;
  $('#s-cpf').addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,11);this.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4')});
  f.addEventListener('submit',function(ev){ev.preventDefault();var b=f.querySelector('button');b.disabled=true;b.textContent='Assinando…';
    api('assinar',{nome:$('#s-nome').value,cpf:$('#s-cpf').value,aceite:$('#s-ok').checked}).then(function(j){b.disabled=false;b.textContent='Assinar contrato';
      if(j.error){$('#err').innerHTML='<div class="erro" role="alert">'+esc(j.error)+'</div>';return}
      topo('Contrato assinado','Agora é a parte boa: testar o agente.');
      app.innerHTML='<div class="card feito"><div class="ico" aria-hidden="true">✓</div><h2>Contrato assinado!</h2><p>Antes de ligar no WhatsApp de vocês, testem o agente com as informações do cadastro e peçam os ajustes que quiserem.</p><div style="height:20px"></div><a class="btn btn-luz" href="/teste/'+TOKEN+'">Testar o agente agora</a></div>';
    })});
}

/* ================= TESTE + AJUSTES ================= */
var conv=[],env=false;
function teste(alvo){
  var dentro=!!alvo;alvo=alvo||app;
  if(['cadastro','contrato'].indexOf(D.status)>=0){topo('Teste do agente');app.innerHTML='<div class="card vazio">O teste é liberado depois que o contrato for assinado.<br><br><a class="btn btn-luz" href="/'+(D.status==='cadastro'?'cadastro':'contrato')+'/'+TOKEN+'">'+(D.status==='cadastro'?'Preencher o cadastro':'Assinar o contrato')+'</a></div>';return}
  if(!dentro){topo('Teste do agente da '+D.empresa,'Converse como se fosse um cliente. O que quiser mudar, peça ao lado.');
  app.classList.add('largo');document.querySelector('.topo .w').style.maxWidth='1120px'}
  var nome=D.assistente||D.empresa,ini=(nome.replace(/[^A-Za-zÀ-ÿ0-9]/g,'').charAt(0)||'A').toUpperCase();
  alvo.innerHTML=(dentro||D.status!=='teste'?'':'<a class="aviso-pg" href="/cliente/'+TOKEN+'">Pagamentos e próximos passos da implantação ›</a>')+'<div class="abas" role="tablist"><button role="tab" id="t1" aria-selected="true" aria-controls="p1">Conversar</button><button role="tab" id="t2" aria-selected="false" aria-controls="p2">Pedir ajustes</button></div>'+
   '<div class="teste"><section class="painel zap" id="p1" role="tabpanel" aria-labelledby="t1"><header><span class="av">'+esc(ini)+'</span><div><b>'+esc(nome)+'</b><small id="st">online · teste</small></div></header><div class="fio" id="fz" aria-live="polite"></div><div class="dicas" id="dz"><button type="button">Oi, quanto custa?</button><button type="button">Vocês abrem sábado?</button><button type="button">Quero marcar um horário</button></div><form class="escrever" id="ez"><textarea id="tz" rows="1" placeholder="Escreva como um cliente" aria-label="Mensagem para o agente"></textarea><button type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1l1.7 6.3 9.1 1.1-9.1 1.1-1.7 6.3c-.2.7.5 1.3 1.2 1z"/></svg></button></form></section>'+
   '<section class="painel aj" id="p2" role="tabpanel" aria-labelledby="t2" hidden><header><span class="av" style="background:linear-gradient(140deg,#FFB547,#FF8A3D);color:#2A1600">✎</span><div><b>Ajustes do agente</b><small>Escreva o que quer mudar e eu atualizo na hora</small></div></header><div class="fio" id="fa2" aria-live="polite"></div><div class="dicas"><button type="button">Acrescentar um serviço</button><button type="button">Mudar um horário</button><button type="button">Falar mais curto</button></div><form class="escrever" id="ea"><textarea id="ta" rows="1" placeholder="Ex.: a limpeza agora custa R$ 200" aria-label="Pedido de ajuste"></textarea><button type="submit" aria-label="Enviar ajuste"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1l1.7 6.3 9.1 1.1-9.1 1.1-1.7 6.3c-.2.7.5 1.3 1.2 1z"/></svg></button></form></section></div>';
  var fz=$('#fz'),fa=$('#fa2');
  function bolha(f,cls,t,mud){var d=document.createElement('div');d.className='b '+cls;d.textContent=t;if(mud&&mud.length){var w=document.createElement('div');w.className='mud';mud.forEach(function(x){var s=document.createElement('span');s.textContent='✓ '+x;w.appendChild(s)});d.appendChild(w)}f.appendChild(d);f.scrollTop=f.scrollHeight;return d}
  function digit(f){var d=document.createElement('div');d.className='dig';d.innerHTML='<i></i><i></i><i></i>';f.appendChild(d);f.scrollTop=f.scrollHeight;return d}
  (D.ajustes||[]).forEach(function(a){bolha(fa,a.de==='empresa'?'eu':'ele',(a.de==='eder'?'Éder: ':'')+a.texto,a.mudancas&&a.mudancas.itens)});
  bolha(fz,'ele',D.status==='ativa'?'Este é um teste do agente de vocês, com as mesmas informações que ele usa no WhatsApp. Nada daqui vai para os clientes. 😊':'Este é o agente de vocês, já com as informações do cadastro. Pode testar! 😊');
  function aba(n){$('#t1').setAttribute('aria-selected',n===1);$('#t2').setAttribute('aria-selected',n===2);$('#p1').hidden=n!==1;$('#p2').hidden=n!==2}
  $('#t1').onclick=function(){aba(1)};$('#t2').onclick=function(){aba(2)};
  function enviarZap(t){t=t.trim();if(!t||env)return;env=true;conv.push({eu:true,texto:t});bolha(fz,'eu',t);$('#tz').value='';var dg=digit(fz);$('#st').textContent='digitando…';
    api('chat',{mensagens:conv}).then(function(j){dg.remove();$('#st').textContent='online · teste';env=false;
      if(j.error){bolha(fz,'ele','⚠️ '+j.error);return}
      var ps=j.partes||[],i=0;(function prox(){if(i>=ps.length)return;var p=ps[i++];conv.push({eu:false,texto:p});bolha(fz,'ele',p);if(i<ps.length){var d2=digit(fz);setTimeout(function(){d2.remove();prox()},Math.min(2200,500+p.length*15))}})();
    })}
  function enviarAj(t){t=t.trim();if(!t)return;bolha(fa,'eu',t);$('#ta').value='';var dg=digit(fa);var b=$('#ea button');b.disabled=true;
    api('ajuste',{texto:t}).then(function(j){dg.remove();b.disabled=false;if(j.error){bolha(fa,'ele','⚠️ '+j.error);return}bolha(fa,'ele',j.resposta,j.mudancas);if(j.mudancas&&j.mudancas.length){var n=document.createElement('div');n.className='b ele';n.style.cssText='align-self:center;background:#182229;color:#FFD279;font-size:13px';n.textContent='⚙️ Agente atualizado: '+j.mudancas.join('; ');fz.appendChild(n);fz.scrollTop=fz.scrollHeight}})}
  $('#ez').onsubmit=function(e){e.preventDefault();enviarZap($('#tz').value)};
  $('#ea').onsubmit=function(e){e.preventDefault();enviarAj($('#ta').value)};
  [['#tz','#ez'],['#ta','#ea']].forEach(function(p){$(p[0]).addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$(p[1]).requestSubmit()}})});
  $('#dz').onclick=function(e){var b=e.target.closest('button');if(b)enviarZap(b.textContent)};
  document.querySelector('#p2 .dicas').onclick=function(e){var b=e.target.closest('button');if(!b)return;var t=$('#ta');t.value=({'Acrescentar um serviço':'Acrescenta o serviço ','Mudar um horário':'Mudou o horário: ','Falar mais curto':'Quero que ele responda com mensagens mais curtas'})[b.textContent]||'';t.focus()};
}

/* ================= ÁREA DO CLIENTE ================= */
var P=null,abaC='inicio',tP=0,qrLib=null;
function dataBR(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''}
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function carregaQr(){if(qrLib)return qrLib;qrLib=new Promise(function(ok){var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=function(){ok(window.qrcode||null)};sc.onerror=function(){ok(null)};document.head.appendChild(sc)});return qrLib}
function pixQr(el,code){carregaQr().then(function(q){if(!q||!el)return;try{var x=q(0,'M');x.addData(code);x.make();el.innerHTML=x.createSvgTag({cellSize:4,margin:2,scalable:true});var sv=el.querySelector('svg');if(sv){sv.setAttribute('role','img');sv.setAttribute('aria-label','QR Code do Pix')}}catch(e){}})}
function nums(x){if(!x)return '';return '<div class="nums"><div><b>'+x.pessoas+'</b><span>'+(x.pessoas===1?'pessoa atendida':'pessoas atendidas')+'</span></div><div><b>'+x.respostas+'</b><span>respostas enviadas</span></div><div><b>'+x.fora_horario+'</b><span>atendidas fora do horário</span></div><div><b>'+x.chamou_equipe+'</b><span>vezes chamou a equipe</span></div></div>'}
function cartaoWa(){var w=P.wa||{};
  if(P.status==='encerrada')return '<div class="card"><h2>Atendimento encerrado</h2><p class="sub" style="margin:0">O agente foi desligado. Se quiser voltar, é só chamar a gente no WhatsApp.</p></div>';
  if(P.status==='teste')return '<div class="card"><div class="st"><span class="dot am"></span><div><h2>Agente em teste</h2><p class="sub" style="margin:0">Testem e peçam ajustes na aba <b>Testar e ajustar</b>. Quando estiver tudo certo, o '+'Éder libera e vocês conectam o WhatsApp por aqui mesmo, lendo um QR Code.</p></div></div></div>';
  if(w.online)return '<div class="card"><div class="st"><span class="dot ok"></span><div><h2>'+(w.agente_ativo?'Atendendo no WhatsApp':'Agente pausado')+'</h2><p class="sub" style="margin:0">'+(w.agente_ativo?'O agente está respondendo os clientes'+(w.numero?' no número terminado em '+esc(String(w.numero).slice(-4)):'')+', 24 horas por dia.':'O WhatsApp está conectado, mas o agente está pausado. Fale com a gente para religar.')+'</p></div></div></div>';
  if(w.qr)return '<div class="card"><h2>Conecte o WhatsApp da empresa</h2><p class="sub">Faça isto pelo computador (ou outro aparelho) e leia o código com o celular da empresa.</p><div class="qr"><img alt="QR Code para conectar o WhatsApp" src="'+esc(w.qr)+'"><ol><li>No celular da empresa, abra o <b>WhatsApp</b>.</li><li>Toque em <b>⋮</b> ou <b>Configurações</b> › <b>Aparelhos conectados</b>.</li><li>Toque em <b>Conectar um aparelho</b> e aponte a câmera para este código.</li></ol></div><p class="sub" style="margin:12px 0 0">O código muda sozinho a cada minuto. Assim que conectar, esta tela muda para “Atendendo”.</p></div>';
  return '<div class="card"><div class="st"><span class="dot am pulsa"></span><div><h2>'+(P.conectado_em?'WhatsApp desconectado':'Preparando a conexão')+'</h2><p class="sub" style="margin:0">'+(P.conectado_em?'O agente parou de responder. Em instantes aparece aqui um QR Code para conectar de novo.':'Em até 1 minuto aparece aqui o QR Code para conectar o WhatsApp da empresa. Deixe esta página aberta.')+'</p></div></div></div>'}
function pagLinha(x){var st=x.pago?'<span class="chip ok">Pago em '+dataBR(x.pago_em)+'</span>':x.atraso>0?'<span class="chip er">'+x.atraso+(x.atraso===1?' dia':' dias')+' de atraso</span>':'<span class="chip">Vence '+dataBR(x.venc)+'</span>';
  return '<div class="pg"><div class="pg-l"><b>'+esc(x.descricao.charAt(0).toUpperCase()+x.descricao.slice(1))+'</b><span>'+brl(x.valor)+' · vencimento '+dataBR(x.venc)+'</span></div>'+st+(x.pix?'<div class="pg-pix"><div class="pg-qr" data-pix="'+esc(x.pix)+'"></div><div><button class="btn btn-luz" type="button" data-copiar="'+esc(x.pix)+'">Copiar Pix copia e cola</button><small>Abra o app do banco › Pix › Pix copia e cola, ou leia o QR. Já vai com o valor. Depois mande o comprovante no WhatsApp.</small></div></div>':'')+'</div>'}
function telaC(){
  var abertos=(P.pagamentos||[]).filter(function(x){return !x.pago}),prox=abertos[0];
  var h='<nav class="cabas" role="tablist">'+[['inicio','Início'],['teste','Testar'+(innerWidth>520?' e ajustar':'')],['pag','Pagamentos'+(abertos.some(function(x){return x.atraso>0})?' •':'')],['rel','Relatórios']].map(function(a){return '<button role="tab" data-c="'+a[0]+'" aria-selected="'+(abaC===a[0])+'">'+a[1]+'</button>'}).join('')+'</nav>';
  h+='<div id="c-inicio"'+(abaC==='inicio'?'':' hidden')+'>'+cartaoWa()+
    (P.mes_atual&&P.mes_atual.mensagens?'<div class="card" style="margin-top:14px"><h2>Este mês até agora</h2>'+nums(P.mes_atual)+'</div>':'')+
    (prox?'<div class="card" style="margin-top:14px"><h2>Próximo pagamento</h2>'+pagLinha(prox)+'</div>':'')+
    '<div class="card" style="margin-top:14px"><h2>Precisa mudar algo no agente?</h2><p class="sub">Preço novo, horário de feriado, um serviço a mais: peça na aba <b>Testar e ajustar</b> e o agente é atualizado na hora'+(P.status==='ativa'?', inclusive no WhatsApp':'')+'.</p><button class="btn btn-vidro" type="button" data-c="teste">Pedir um ajuste</button></div></div>';
  h+='<div id="c-teste"'+(abaC==='teste'?'':' hidden')+'></div>';
  h+='<div id="c-pag"'+(abaC==='pag'?'':' hidden')+'><div class="card"><h2>Pagamentos</h2><p class="sub">Implantação em duas partes (50% no início e 50% quando o agente começa a atender) e mensalidade a partir de 30 dias depois. Pix para '+esc(P.pix_nome||'')+(P.pix_chave?' ('+esc(P.pix_chave)+')':'')+'.</p>'+((P.pagamentos||[]).length?(P.pagamentos||[]).map(pagLinha).join(''):'<p class="sub">Nenhum pagamento por enquanto.</p>')+'</div></div>';
  var rels=P.relatorios||[];
  h+='<div id="c-rel"'+(abaC==='rel'?'':' hidden')+'>'+(P.mes_atual?'<div class="card"><h2>'+MES[new Date().getMonth()]+' (até hoje)</h2>'+nums(P.mes_atual)+'</div>':'<div class="card"><h2>Relatórios</h2><p class="sub" style="margin:0">Os números aparecem aqui assim que o agente começar a atender no WhatsApp. Todo dia 1º vocês também recebem o resumo do mês no WhatsApp.</p></div>')+
    rels.map(function(r){return '<div class="card" style="margin-top:14px"><h2>'+MES[+r.mes.slice(5,7)-1]+' de '+r.mes.slice(0,4)+'</h2>'+nums(r)+'</div>'}).join('')+'</div>';
  return h}
function pintaC(){var y=window.scrollY,tem=document.getElementById('c-teste'),guardado=tem&&tem.firstChild?tem:null;
  if(guardado)guardado.remove();
  app.innerHTML=telaC();
  if(guardado)document.getElementById('c-teste').replaceWith(guardado);
  else if(abaC==='teste')teste(document.getElementById('c-teste'));
  document.querySelectorAll('[data-pix]').forEach(function(el){pixQr(el,el.dataset.pix)});
  window.scrollTo(0,y)}
function cliente(){
  topo(D.empresa,'Área do cliente · Plano '+D.plano);
  apiPos().then(function(j){if(j.error){erroTela(j.error);return}P=j;pintaC();agendaC()});
}
function agendaC(){clearTimeout(tP);var w=(P&&P.wa)||{};var rapido=P&&P.status==='ativa'&&!w.online&&abaC==='inicio';tP=setTimeout(function(){if(document.hidden){agendaC();return}apiPos().then(function(j){if(!j.error){var mud=JSON.stringify(j)!==JSON.stringify(P);P=j;if(mud&&abaC!=='teste')pintaC()}agendaC()})},rapido?5000:60000)}
app.addEventListener('click',function(e){if(PAG!=='cliente')return;var t=e.target.closest('[data-c],[data-copiar]');if(!t)return;
  if(t.dataset.copiar){var c=t.dataset.copiar,ok=function(){t.textContent='Copiado ✓';setTimeout(function(){t.textContent='Copiar Pix copia e cola'},2500)};if(navigator.clipboard)navigator.clipboard.writeText(c).then(ok,function(){window.prompt('Copie o código:',c)});else window.prompt('Copie o código:',c);return}
  abaC=t.dataset.c;
  ['inicio','teste','pag','rel'].forEach(function(k){var el=document.getElementById('c-'+k);if(el)el.hidden=k!==abaC});
  document.querySelectorAll('.cabas button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.c===abaC)});
  if(abaC==='teste'){var ct=document.getElementById('c-teste');if(!ct.firstChild)teste(ct);app.classList.add('largo');document.querySelector('.topo .w').style.maxWidth='1120px'}else{app.classList.remove('largo');document.querySelector('.topo .w').style.maxWidth=''}
  window.scrollTo(0,0);agendaC()});

if(!/^[0-9a-f]{24}$/.test(TOKEN)){erroTela('Este link não está completo.');return}
api('ler').then(function(j){if(j.error){erroTela(j.error);return}D=j;
  if(PAG==='cadastro'&&D.status!=='cadastro'){location.replace('/'+(D.status==='contrato'?'contrato':['ativa','encerrada'].indexOf(D.status)>=0?'cliente':'teste')+'/'+TOKEN);return}
  if(PAG==='teste'&&['ativa','encerrada'].indexOf(D.status)>=0){location.replace('/cliente/'+TOKEN);return}
  if(PAG==='cliente'&&['cadastro','contrato'].indexOf(D.status)>=0){location.replace('/'+D.status+'/'+TOKEN);return}
  (PAG==='contrato'?contrato:PAG==='teste'?function(){teste()}:PAG==='cliente'?cliente:cadastro)()});
})();
</script>
</body>
</html>
