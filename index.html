function wcLista(){
  const q=WC.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const cs=wcConvs().filter(c=>!q||c.nome.toLowerCase().includes(q)||(qd.length>=3&&c.tel.includes(qd)));
  if(!cs.length)return '<p class="sub" style="padding:12px">'+(WC.q?'Nenhuma conversa encontrada.':'Nenhuma conversa ainda. Quando alguém mandar mensagem para o WhatsApp da ótica, ela aparece aqui.')+'</p>';
  return cs.map(c=>{const u=c.ult;const prev=u?(u.de_mim?'Você: ':'')+u.texto:WC.pend.some(p=>wcK(p.telefone)===c.k&&p.status!=='novo')?'Enviando...':'Nova conversa';
    return '<button class="wc-it'+(WC.sel===c.k?' on':'')+'" data-act="wcabrir" data-k="'+c.k+'"><span class="wc-av" aria-hidden="true">'+esc((c.nome.match(/[A-Za-zÀ-ú0-9]/)||['?'])[0].toUpperCase())+'</span><span class="wc-tx"><span class="wc-l1"><b>'+esc(c.nome)+'</b><small>'+(c.quando?wcHora(c.quando):'')+'</small></span><span class="wc-l2"><span>'+esc(prev.replace(/\s+/g,' ').slice(0,90))+'</span>'+(c.nao?'<i class="badge">'+c.nao+'</i>':'')+'</span></span></button>'}).join('');
}
function wcMsgs(){
  const c=wcConvs().find(x=>x.k===WC.sel);if(!c)return '';
  const ORI={sistema:'pelo sistema',automatico:'aviso automático',celular:'pelo celular'};
  let dia='',h='';
  c.msgs.forEach(m=>{const d=new Date(new Date(m.criado_em).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
    if(d!==dia){dia=d;h+='<div class="wc-dia"><span>'+(d===todayStr()?'Hoje':d===addDays(todayStr(),-1)?'Ontem':fmtDate(d))+'</span></div>'}
    h+='<div class="wc-b'+(m.de_mim?' eu':'')+'"><div class="wc-txt">'+esc(m.texto)+'</div><small>'+wcHora(m.criado_em).replace(/^.* /,'')+(m.de_mim&&ORI[m.origem]?' · '+ORI[m.origem]:'')+'</small></div>'});
  WC.pend.filter(p=>wcK(p.telefone)===c.k&&p.status!=='novo').forEach(p=>{h+='<div class="wc-b eu pend"><div class="wc-txt">'+esc(p.texto)+'</div><small>'+(p.status==='falhou'?'<span style="color:var(--bad)">Não foi enviada'+(p.erro==='sem_whatsapp'?': número sem WhatsApp':'')+'</span>':'Enviando... (o computador da loja precisa estar ligado)')+'</small></div>'});
  return h||'<p class="sub" style="text-align:center">Sem mensagens ainda.</p>';
}
function viewWaChat(){
  wcGarante();
  if(WC.msgs===null)return pageHead('Conversas do WhatsApp','')+'<p class="sub">Carregando...</p>';
  const st=WC.st||{},cs=wcConvs(),c=cs.find(x=>x.k===WC.sel);
  const aviso=st.estado==='sem_conector'?'<p class="sub" style="margin:0 0 10px;color:var(--warn)">Para usar as conversas, instale o conector no computador da loja (menu WhatsApp Automático).</p>':st.estado&&st.estado!=='conectado'?'<p class="sub" style="margin:0 0 10px;color:var(--warn)">O conector do computador da loja está desligado. As mensagens só chegam e saem com ele ligado.</p>':'';
  const N=WC.novo;
  const novo=N?'<div class="card" style="gap:10px;margin-bottom:12px"><b>Nova conversa</b>'+
    '<div class="field"><span>Cliente já cadastrado (opcional)</span><input type="search" id="wc-ncli" list="wc-clis" value="'+esc(N.busca)+'" placeholder="Digite o nome ou o WhatsApp do cliente" autocomplete="off"><datalist id="wc-clis">'+wcClientesOpc().map(o=>'<option value="'+esc(o.l)+'"></option>').join('')+'</datalist>'+(N.cliente_id?'<span class="sub" style="margin-top:4px">Cliente selecionado. Nome e WhatsApp preenchidos abaixo.</span>':'')+'</div>'+
    '<div class="grid2"><div class="field"><span>Nome</span><input type="text" id="wc-nnome" value="'+esc(N.nome)+'" placeholder="Nome da pessoa" autocomplete="off"></div><div class="field"><span>WhatsApp com DDD</span><input type="tel" inputmode="tel" data-mask="tel" id="wc-novo" value="'+esc(N.tel)+'" placeholder="(81) 99999-9999"></div></div>'+
    '<div class="foot-row"><button class="btn primary" data-act="wcnovook">Abrir conversa</button><button class="btn" data-act="wcnovox">Cancelar</button></div></div>':'';
  const lista='<div class="wc-side'+(c?' tem':'')+'"><div class="wc-busca"><input type="search" id="wc-q" placeholder="Buscar conversa" value="'+esc(WC.q)+'" aria-label="Buscar conversa"></div><div id="wc-list" class="wc-list">'+wcLista()+'</div></div>';
  const tel=c?c.tel:'';
  const conversa=c?'<div class="wc-main"><div class="wc-top"><button class="btn sm ghost wc-volta" data-act="wcvoltar" aria-label="Voltar para a lista">&#8249;</button><div style="min-width:0"><b>'+esc(c.nome)+'</b><div class="sub" style="margin:0">'+esc(maskTel(tel.replace(/^55/,'')))+'</div></div><a class="btn sm ghost"'+WAT+' href="'+esc(waLink(tel,''))+'" style="margin-left:auto">Abrir no WhatsApp</a></div>'+
    '<div id="wc-thread" class="wc-thread">'+wcMsgs()+'</div>'+
    '<div class="wc-env"><textarea id="wc-txt" rows="2" placeholder="Escreva a mensagem" aria-label="Mensagem">'+esc(WC.txt[c.k]||'')+'</textarea><button class="btn primary" data-act="wcenviar">Enviar</button></div></div>'
   :'<div class="wc-main wc-vazio"><p class="sub">Escolha uma conversa ao lado.</p></div>';
  return pageHead('Conversas do WhatsApp','As mensagens do WhatsApp da ótica, para ver e responder sem sair do sistema. Só texto.','<button class="btn primary" data-act="wcnovo">Nova conversa</button>')+aviso+novo+
    '<div class="wc">'+lista+conversa+'</div><p class="sub" style="margin-top:8px">Aparecem as conversas dos últimos 45 dias, a partir de quando o conector foi atualizado. Fotos e áudios aparecem só como aviso; abra no celular para ver.</p>';
}
function wcRolar(){const th=document.getElementById('wc-thread');if(th)th.scrollTop=th.scrollHeight}
Object.assign(A,{
  wcabrir(d){WC.sel=d.k;wcMarcarLidas(d.k);render();setTimeout(wcRolar,0)},
  wcvoltar(){WC.sel='';render()},
  wcconversar(d){const c=S.clientes[d.c];if(!c||!c.whatsapp)return;const t=String(c.whatsapp).replace(/\D/g,'');const tel=t.length<=11?'55'+t:t;WC.sel=wcK(tel);WC.novo=null;
    if(WC.msgs&&!wcConvs().some(x=>x.k===WC.sel))WC.pend.push({id:'novo',telefone:tel,texto:'',status:'novo',criado_em:new Date().toISOString()});
    else if(!WC.msgs)WC.abrirTel=tel;
    ui.tab='wachat';render();setTimeout(wcRolar,0)},
  wcnovo(){WC.novo={busca:'',cliente_id:'',nome:'',tel:''};render();setTimeout(()=>{const i=document.getElementById('wc-ncli');if(i)i.focus()},0)},
  wcnovox(){WC.novo=null;render()},
  wcnovook(){const N=WC.novo||{};const t=String(N.tel||'').replace(/\D/g,'');if(t.replace(/^55/,'').length<10)return toast('Informe o WhatsApp com DDD');const tel=t.length<=11?'55'+t:t;const nome=String(N.nome||'').trim().replace(/\s+/g,' ').slice(0,80);
    WC.novo=null;WC.sel=wcK(tel);
    if(nome&&!N.cliente_id){const ns=wcNomes();if(ns[WC.sel]!==nome){ns[WC.sel]=nome;persist('config','wachat')}}
    if(!wcConvs().some(c=>c.k===WC.sel))WC.pend.push({id:'novo',telefone:tel,texto:'',status:'novo',criado_em:new Date().toISOString()});render()},
  async wcenviar(){
    const c=wcConvs().find(x=>x.k===WC.sel);const ta=document.getElementById('wc-txt');const txt=String(ta?ta.value:'').trim();if(!c||!txt)return;
    if(txt.length>4000)return toast('Mensagem muito longa');
    WC.pend=WC.pend.filter(p=>p.id!=='novo');
    const tmp={id:'tmp'+Date.now(),telefone:c.tel,texto:txt,status:'aguardando',criado_em:new Date().toISOString()};WC.pend.push(tmp);WC.txt[c.k]='';if(ta)ta.value='';
    if(ta)ta.blur();render();setTimeout(wcRolar,0);
    const r=await sb.rpc('wa_enviar_manual',{p_otica:OTICA.id,p_tel:c.tel,p_texto:txt});
    if(r.error){WC.pend=WC.pend.filter(p=>p!==tmp);WC.txt[c.k]=txt;render();return toast(/liberad/.test(r.error.message)?'Função não liberada para a sua ótica':'Não foi possível enviar. Tente de novo.')}
    tmp.id=r.data&&r.data.id||tmp.id;setTimeout(()=>{if(ui.tab==='wachat')wcLoad()},8000);
  },
});
document.addEventListener('input',e=>{const t=e.target;if(!t)return;
  if(t.id==='wc-txt'&&WC.sel){WC.txt[WC.sel]=t.value;return}
  if(t.id==='wc-q'){WC.q=t.value;const l=document.getElementById('wc-list');if(l)l.innerHTML=wcLista();return}
  if(t.id==='wc-novo'&&WC.novo){WC.novo.tel=t.value;WC.novo.cliente_id='';return}
  if(t.id==='wc-nnome'&&WC.novo){WC.novo.nome=t.value;WC.novo.cliente_id='';return}
  if(t.id==='wc-ncli'&&WC.novo){const N=WC.novo;N.busca=t.value;const o=wcClientesOpc().find(x=>x.l===t.value);
    if(o){N.cliente_id=o.c.id;N.nome=o.c.nome;N.tel=o.c.whatsapp?maskTel(o.c.whatsapp):'';const a=document.getElementById('wc-nnome'),b=document.getElementById('wc-novo');if(a)a.value=N.nome;if(b)b.value=N.tel;if(!N.tel)toast('Esse cliente não tem WhatsApp no cadastro. Preencha abaixo.')}
    else N.cliente_id='';return}
});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='wc-txt'&&e.key==='Enter'&&!e.shiftKey&&!isMobile){e.preventDefault();A.wcenviar()}});
setInterval(()=>{if(auth==='ok'&&OTICA&&modOn('wachat')&&!document.hidden&&(ui.tab==='wachat'||!WC.chan)&&Date.now()-WC.t>25000)wcLoad()},30000);

/* ----- Tráfego Orgânico (função Premium "trafego") ----- */
/* A ótica acha empresas num raio da loja (Google Maps, sem outras óticas) ou por CNPJ, guarda num CRM próprio
   e oferece os óculos pelo WhatsApp Automático (com aprovação). Respostas e envios atualizam o CRM sozinhos. */
const TF={sub:'buscar',leads:null,busy:false,res:[],next:null,sel:{},q:'empresas',qLivre:'',err:'',fil:'novo',buscando:false,t:0};
const TF_ST={novo:['','Nova'],enviado:['acc','Abordada'],respondeu:['warn','Respondeu'],interessada:['acc','Interessada'],cliente:['ok','Virou cliente'],sem_interesse:['bad','Sem interesse']};
const TF_CATS=[['empresas','Todas as empresas'],['lojas comércio','Comércio e lojas'],['escritório','Escritórios'],['clínica consultório','Saúde'],['restaurante lanchonete','Alimentação'],['salão de beleza barbearia','Beleza'],['escola colégio','Escolas'],['oficina mecânica','Oficinas'],['supermercado mercadinho','Mercados'],['academia','Academias'],['igreja','Igrejas'],['condomínio','Condomínios']];
const TF_MSG='Atenção, empresários do {bairro} e região! 👋\n\nSomos da {otica} e temos uma super oferta para a sua empresa:\n\n👓 Na compra do seu óculos completo, você paga só as lentes. A armação e o exame de vista são por nossa conta!\n\n👥 Acima de 3 pessoas da mesma empresa, desconto especial para toda a equipe.\n\nQuer saber mais? É só responder esta mensagem.';
const TF_FU='Oi, pessoal da {empresa}! Passando para lembrar da nossa oferta para empresas do {bairro}: óculos completo pagando só as lentes, com armação e exame de vista grátis. Posso reservar um horário para a sua equipe?';
const tfDoc=()=>{if(!S.config.trafego)S.config.trafego={id:'trafego',msg:'',fu:'',raio:3000};return S.config.trafego};
const tfK8=t=>String(t||'').replace(/\D/g,'').slice(-8);
const tfCel=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('55')&&d.length>11)d=d.slice(2);return d.length===11&&d[2]==='9'};
const tfBairro=()=>{const D=tfDoc();return (D.bairro||'').trim()||'bairro'};
// Público da mensagem conforme o tipo da empresa: escola, farmácia, padaria... (padrão: empresas)
const TF_PUB=[[/escola|col[eé]gio|creche|faculdade|universidade|curso|ensino/,'escolas','escola','a'],[/farm[aá]cia|drogaria/,'farmácias','farmácia','a'],[/padaria|panifica/,'padarias','padaria','a'],
  [/restaurante|lanchonete|pizzaria|hamburgu|bar\b|churrascaria|cafeteria|a[cç]a[ií]/,'restaurantes e lanchonetes','restaurante','o'],[/supermercado|mercad|atacad|hortifruti|a[cç]ougue/,'mercados','mercado','o'],
  [/academia|crossfit|pilates/,'academias','academia','a'],[/barbearia/,'barbearias','barbearia','a'],[/sal[aã]o|beleza|est[eé]tica|manicure|cabeleireir/,'salões de beleza','salão','o'],
  [/cl[ií]nica|consult[oó]rio|odonto|dentista|laborat[oó]rio|fisioterap|hospital|sa[uú]de/,'clínicas e consultórios','clínica','a'],[/igreja|templo|par[oó]quia/,'igrejas','igreja','a'],
  [/oficina|mec[aâ]nica|auto ?pe[cç]as|borracharia|lava.?jato/,'oficinas','oficina','a'],[/condom[ií]nio/,'condomínios','condomínio','o'],[/contabil|advocacia|advogad|escrit[oó]rio|imobili/,'escritórios','escritório','o'],
  [/posto|combust[ií]vel/,'postos','posto','o'],[/transport|log[ií]stica|transportadora/,'transportadoras','transportadora','a'],[/loja|com[eé]rcio|magazine|boutique|confec/,'lojistas','loja','a']];
function tfPublico(l){const t=String(((l&&l.categoria)||'')+' '+((l&&l.nome)||'')).toLowerCase();const m=TF_PUB.find(x=>x[0].test(t));return m?{pl:m[1],s:m[2],g:m[3]}:null}
function tfTexto(l,fu){const D=tfDoc(),p=tfPublico(l);let t=(fu?(D.fu||'').trim()||TF_FU:(D.msg||'').trim()||TF_MSG);
  if(p)t=t.replace(/empres[aá]rios/gi,m=>m[0]==='E'?p.pl[0].toUpperCase()+p.pl.slice(1):p.pl).replace(/a sua empresa/gi,(p.g==='a'?'a sua ':'o seu ')+p.s).replace(/sua empresa/gi,(p.g==='a'?'sua ':'seu ')+p.s).replace(/da mesma empresa/gi,(p.g==='a'?'da mesma ':'do mesmo ')+p.s).replace(/para empresas/gi,'para '+p.pl);
  return t.replace(/\{otica\}/g,cfg().nome||'nossa ótica').replace(/\{bairro\}/g,(l&&l.bairro)||tfBairro()).replace(/\{empresa\}/g,(l&&l.nome)||'').replace(/\n{3,}/g,'\n\n')}
async function tfLoad(){
  if(TF.busy||!OTICA||!modOn('trafego'))return;TF.busy=true;
  try{const r=await sb.from('trafego_leads').select('*').eq('otica_id',OTICA.id).neq('status','removida').order('criado_em',{ascending:false}).limit(3000);TF.leads=r.error?(TF.leads||[]):(r.data||[])}catch(e){TF.leads=TF.leads||[]}
  TF.busy=false;TF.t=Date.now();if(ui.tab==='trafego'&&!fieldsOn()&&!ui.sheet)render();
}
function tfGarante(){if(TF.leads===null&&!TF.busy)setTimeout(tfLoad,0)}
setInterval(()=>{if(auth==='ok'&&OTICA&&modOn('trafego')&&ui.tab==='trafego'&&!document.hidden&&Date.now()-TF.t>25000)tfLoad()},30000);
async function tfApi(body){
  const {data,error}=await sb.functions.invoke('trafego-busca',{body:Object.assign({otica:OTICA.id},body)});
  if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);return data;
}
/* clientes que vieram do tráfego: mesmo telefone de uma empresa abordada; vendas feitas depois da abordagem */
function tfResultado(){
  const L=TF.leads||[],ab=L.filter(l=>l.enviado_em),resp=L.filter(l=>['respondeu','interessada','cliente'].includes(l.status));
  const porTel={};ab.forEach(l=>{const k=tfK8(l.telefone);if(k)porTel[k]=l});
  const cli=Object.values(S.clientes).filter(c=>c&&porTel[tfK8(c.whatsapp)]);
  const ids=new Set(cli.map(c=>c.id));L.filter(l=>l.status==='cliente').forEach(l=>{});
  const vend=vendasOk().filter(v=>{if(!ids.has(v.clienteId))return false;const c=S.clientes[v.clienteId],l=porTel[tfK8(c.whatsapp)];return !l.enviado_em||v.data>=String(l.enviado_em).slice(0,10)});
  return {total:L.length,ab:ab.length,resp:resp.length,cli:Math.max(cli.length,L.filter(l=>l.status==='cliente').length),vendas:vend.reduce((s,v)=>s+v.total,0),nVendas:vend.length};
}
function viewTrafego(){
  if(!modOn('trafego'))return viewUpsell('trafego');
  tfGarante();const R=TF.leads?tfResultado():null;
  const nav='<div class="seg ex-nav" role="tablist" aria-label="Tráfego Orgânico">'+[['buscar','Buscar empresas'],['crm','Empresas no CRM'+(TF.leads?' ('+TF.leads.length+')':'')],['msg','Mensagem da oferta']].map(s=>'<button class="btn sm'+(TF.sub===s[0]?' primary':'')+'" role="tab" aria-selected="'+(TF.sub===s[0])+'" data-act="tfsub" data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'</div>';
  const kpis=R?'<div class="kpis" style="margin-bottom:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+tile('Empresas no CRM',R.total)+tile('Abordadas',R.ab)+tile('Responderam',R.resp+(R.ab?' <small style="font-size:13px;color:var(--muted)">('+Math.round(R.resp*100/R.ab)+'%)</small>':''))+tile('Viraram clientes',R.cli)+tile('Vendas geradas',brl(R.vendas))+'</div>':'';
  const aviso=!waOn()?'<p class="sub" style="margin:0 0 12px">Para as abordagens saírem sozinhas, ligue o WhatsApp Automático. Sem ele, cada abordagem abre o WhatsApp com a mensagem pronta.</p>':'';
  const corpo=TF.sub==='crm'?tfCrm():TF.sub==='msg'?tfMsgView():tfBuscar();
  return pageHead('Tráfego Orgânico','Encontre empresas perto da ótica e leve a sua oferta até elas, sem depender de indicação')+kpis+nav+aviso+corpo;
}
function tfBuscar(){
  const D=tfDoc(),loc=D.lat?'<b>'+esc(D.label||'Localização da ótica')+'</b>':'<b>Defina de onde partir a busca</b>';
  const raios=[1000,2000,3000,5000].map(r=>'<option value="'+r+'"'+(+(D.raio||3000)===r?' selected':'')+'>'+(r/1000)+' km</option>').join('');
  let h='<div class="card" style="gap:10px"><b>Ponto de partida</b><div class="sub" style="margin:0">'+loc+(D.lat?' · bairro usado na mensagem: '+esc(tfBairro()):'')+'</div>'+
    '<div class="foot-row"><button class="btn sm" data-act="tfgeo">Usar o endereço da ótica</button><button class="btn sm" data-act="tfgps">Usar minha localização agora</button><label class="sub" style="display:flex;align-items:center;gap:6px;margin:0">Raio <select data-tfraio style="width:auto">'+raios+'</select></label></div>'+
    '<div class="field"><span>Bairro que aparece na mensagem</span><input type="text" data-tfbairro value="'+esc(D.bairro||'')+'" placeholder="Ex.: Arruda"></div></div>';
  h+='<div class="card" style="gap:10px;margin-top:12px"><b>Que tipo de empresa?</b><div class="chips">'+TF_CATS.map(c=>'<button class="fchip" aria-pressed="'+(TF.q===c[0]&&!TF.qLivre)+'" data-act="tfcat" data-q="'+esc(c[0])+'">'+c[1]+'</button>').join('')+'</div>'+
    '<div class="foot-row"><input type="search" data-tfqlivre value="'+esc(TF.qLivre)+'" placeholder="Ou digite o tipo ou o nome: padarias, construtora, Mercadinho São José..." style="flex:1;min-width:200px"><button class="btn primary" data-act="tfbuscar"'+(TF.buscando||!D.lat?' disabled':'')+'>'+(TF.buscando?'Buscando...':'Buscar empresas')+'</button></div>'+
    (TF.err?'<p class="sub" style="margin:0;color:var(--bad)">'+esc(TF.err)+'</p>':'')+'</div>';
  if(TF.res.length){
    const ja=tfJa(),vt=new Set(),novas=TF.res.filter(p=>{if(ja(p))return false;const k=tfK8(p.telefone);if(k){if(vt.has(k))return false;vt.add(k)}return true}),n=novas.filter(p=>TF.sel[p.place_id]).length;
    h+='<div class="sh" style="margin-top:16px"><h2>'+plural(novas.length,'empresa nova','empresas novas')+'</h2><button class="btn primary sm" data-act="tfadd"'+(n?'':' disabled')+'>Adicionar '+n+' ao CRM</button></div>'+
      '<p class="sub" style="margin:0 0 8px">Óticas ficam de fora da busca. Empresas que já estão no seu CRM, ou com o mesmo telefone de uma que já está, não aparecem de novo. Marquei as que têm celular.</p><div class="stack">';
    novas.forEach(p=>{h+='<label class="row" style="cursor:pointer;align-items:center"><input type="checkbox" data-tfsel="'+esc(p.place_id)+'"'+(TF.sel[p.place_id]?' checked':'')+' style="width:20px;height:20px;flex:none"><div class="row-main"><b>'+esc(p.nome)+'</b><div class="meta">'+esc(p.categoria||'Empresa')+' · '+(p.distancia_m<1000?p.distancia_m+' m':(p.distancia_m/1000).toFixed(1).replace('.',',')+' km')+(p.bairro?' · '+esc(p.bairro):'')+'</div><div class="chips">'+(p.telefone?(tfCel(p.telefone)?'<span class="chip ok">Celular</span>':'<span class="chip warn">Telefone fixo</span>'):'<span class="chip bad">Sem telefone</span>')+'<span class="chip">'+esc(p.telefone||'')+'</span></div></div></label>'});
    h+='</div>'+(TF.next?'<div class="foot-row" style="margin-top:10px"><button class="btn" data-act="tfmais"'+(TF.buscando?' disabled':'')+'>Carregar mais empresas</button></div>':'');
  }

    '<div class="wc-env"><label class="btn" title="Mandar foto (ex.: receita)" aria-label="Mandar foto">📷<input type="file" accept="image/*" data-agfoto hidden'+(AG.enviando?' disabled':'')+'></label>'+

    '<textarea id="ag-txt" rows="1" placeholder="Mensagem do cliente...">'+esc(AG.txt)+'</textarea><button class="btn primary" data-act="agenviar"'+(AG.enviando?' disabled':'')+'>Enviar</button></div></div></div>';

function agScroll(){const t=document.getElementById('ag-thread');if(t)t.scrollTop=t.scrollHeight}
async function agMandar(corpo,bolha){
  if(AG.enviando)return;AG.enviando=true;
  const hist=AG.chat.filter(m=>m.papel==='cliente'||m.papel==='agente').map(m=>({papel:m.papel,texto:m.texto}));
  AG.chat.push(bolha);render();agScroll();
  try{
    const sim=AG.sim==='novo'?{}:{[AG.sim]:true,nome:'Maria Souza'};
    const {data,error}=await sb.functions.invoke('agente-ia',{body:Object.assign({otica:OTICA.id,cfg:AG.cfg,mensagens:hist,simular:sim},corpo)});
    let d=data;if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
    if(d&&d.error)throw new Error(d.error);
    if(d.entrada)bolha.texto=d.entrada.replace(/^\[[^\]]*\]:\s*/,(bolha.foto?'📷 ':'🎤 '));
    (d.acoes||[]).forEach(a=>AG.chat.push({papel:'acao',texto:a.txt}));
    if(d.resposta)AG.chat.push({papel:'agente',texto:d.resposta});
    (d.imagens||[]).forEach(im=>AG.chat.push({papel:'agente',texto:'',img:im.url}));
    if(AG.row&&!AG.row.testado_em)AG.row.testado_em=new Date().toISOString();
  }catch(e){AG.chat.push({papel:'acao',texto:'Erro: '+(e.message||e)})}
  AG.enviando=false;render();agScroll();
}
function agArquivoB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)})}
function agReduzir(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('imagem inválida')),'image/jpeg',.85)};img.onerror=()=>rej(new Error('imagem inválida'));img.src=u})}
async function agSalvar(){
  if(!AG.cfg||AG.salvando)return;AG.salvando=true;render();
  const c=JSON.parse(JSON.stringify(AG.cfg));
  ['produtos','promocoes','faq'].forEach(k=>c[k]=(c[k]||[]).filter(x=>Object.values(x).some(v=>String(v||'').trim())));
  c.pausa_h=Math.max(0,Math.min(72,+c.pausa_h||0));c.limite_dia=Math.max(5,Math.min(80,+c.limite_dia||25));
  const r=await sb.from('agente_config').upsert({otica_id:OTICA.id,cfg:c,ativo:!!(AG.row&&AG.row.ativo),atualizado_em:new Date().toISOString()}).select().maybeSingle();
  AG.salvando=false;
  if(r.error){toast('Não foi possível salvar: '+r.error.message);render();return}
  AG.row=r.data;AG.cfg=agPadrao(r.data.cfg);AG.dirty=false;toast('Configuração do agente salva');render();
}
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset||!AG.cfg)return;
  if(t.id==='ag-txt'){AG.txt=t.value;return}
  let mud=false;
  if(t.dataset.agf!==undefined){const k=t.dataset.agf;AG.cfg[k]=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;mud=true}
  else if(t.dataset.agl!==undefined){const L=AG.cfg[t.dataset.agl]||[],it=L[+t.dataset.i];if(it){it[t.dataset.k]=t.value;mud=true}}
  else if(t.dataset.agdia!==undefined){const d=+t.dataset.agdia,s=new Set(AG.cfg.dias||[]);if(t.checked)s.add(d);else s.delete(d);AG.cfg.dias=[...s].sort();mud=true}
  if(mud){AG.dirty=true;const h=document.getElementById('ag-st');if(h)h.textContent='Alterações não salvas'}
});
document.addEventListener('change',async e=>{const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.agsim!==undefined){AG.sim=t.value;AG.chat=[];render();return}
  if(t.dataset.agf!==undefined&&(t.tagName==='SELECT'||t.type==='checkbox')){AG.cfg[t.dataset.agf]=t.type==='checkbox'?t.checked:t.value;AG.dirty=true;const h=document.getElementById('ag-st');if(h)h.textContent='Alterações não salvas';return}
  if(t.dataset.agimg!==undefined&&t.files&&t.files[0]){
    const f=t.files[0];t.value='';AG.subindo=true;render();
    try{const b=await agReduzir(f,1600),id=agId(),path=OTICA.id+'/'+id+'.jpg';
      const up=await sb.storage.from('agente').upload(path,b,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
      const url=sb.storage.from('agente').getPublicUrl(path).data.publicUrl;
      (AG.cfg.imagens=AG.cfg.imagens||[]).push({id,url,titulo:f.name.replace(/\.[^.]+$/,'').slice(0,60),quando:'',legenda:''});AG.dirty=true;toast('Imagem adicionada. Dê um nome e salve.');
    }catch(er){toast('Não foi possível enviar a imagem: '+(er.message||er))}
    AG.subindo=false;render();return}
  if(t.dataset.agfoto!==undefined&&t.files&&t.files[0]){
    const f=t.files[0];t.value='';
    try{const b=await agReduzir(f,1600),b64=await agArquivoB64(b),leg=AG.txt.trim();AG.txt='';
      agMandar({midia:{tipo:'imagem',mime:'image/jpeg',base64:b64,legenda:leg}},{papel:'cliente',texto:leg||'',foto:'data:image/jpeg;base64,'+b64});
    }catch(er){toast('Não foi possível ler a foto')}
  }
});
Object.assign(A,{
  agsub(d){AG.sub=d.s;render();if(d.s==='teste')agScroll()},
  agsalvar(){agSalvar()},
  agadd(d){const k=d.l,L=(AG.cfg[k]=AG.cfg[k]||[]);L.push(k==='faq'?{p:'',r:''}:k==='promocoes'?{titulo:'',texto:'',validade:''}:{nome:'',preco:'',obs:''});AG.dirty=true;render()},
  agdel(d){const L=AG.cfg[d.l]||[];L.splice(+d.i,1);AG.dirty=true;render()},
  async agligar(d){const v=d.v==='1';
    if(v){const falta=agChecks().filter(x=>x.obrig&&!x.ok);if(falta.length){AG.sub='check';render();return toast('Falta: '+falta.map(x=>x.t).join(', '))}
      if(!confirm('Ligar o agente? A partir de agora ele responde as mensagens que chegarem no WhatsApp da ótica.'))return}
    const r=await sb.from('agente_config').update({ativo:v,atualizado_em:new Date().toISOString()}).eq('otica_id',OTICA.id).select().maybeSingle();
    if(r.error||!r.data)return toast('Não foi possível '+(v?'ligar':'desligar'));
    AG.row=r.data;toast(v?'Agente ligado! Ele já responde no WhatsApp.':'Agente desligado');render()},
  aglimpar(){AG.chat=[];render()},
  agsug(d){if(AG.enviando)return;agMandar({texto:d.t},{papel:'cliente',texto:d.t})},
  agenviar(){const t=(document.getElementById('ag-txt')||{}).value||AG.txt;if(!t.trim()||AG.enviando)return;AG.txt='';agMandar({texto:t.trim()},{papel:'cliente',texto:t.trim()})},
  async agrec(){
    if(AG.rec){try{AG.rec.stop()}catch(e){}return}
    if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Este navegador não grava áudio');
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('Permita o uso do microfone para gravar')}
    const mr=new MediaRecorder(stream),partes=[];AG.rec=mr;AG.recT=Date.now();
    const tick=setInterval(()=>{if(!AG.rec)return clearInterval(tick);if(Date.now()-AG.recT>120000)try{mr.stop()}catch(e){};const b=document.querySelector('[data-act="agrec"]');if(b)b.textContent='⏹ Parar ('+Math.round((Date.now()-AG.recT)/1000)+'s)'},500);
    mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)partes.push(ev.data)};
    mr.onstop=async()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());AG.rec=null;const blob=new Blob(partes,{type:mr.mimeType||'audio/webm'});
      if(blob.size<800){render();return toast('Áudio muito curto')}
      const b64=await agArquivoB64(blob);agMandar({midia:{tipo:'audio',mime:blob.type,base64:b64}},{papel:'cliente',texto:'🎤 Áudio...'})};
    mr.start();render()},
});

/* Pix copia-e-cola com valor (padrão BR Code do Banco Central) */
function pixCRC(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixLimpa(t,n){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').toUpperCase().trim().slice(0,n)}
function pixChave(k){k=String(k||'').trim();if(/@/.test(k))return k.toLowerCase();if(/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k))return k.toLowerCase();const d=k.replace(/\D/g,'');if(/^\+/.test(k))return '+'+d;if(/^\(?\d{2}\)?\s?9?\d{4}-?\d{4}$/.test(k)&&/[()\s-]/.test(k))return '+55'+d;if(d.length===11||d.length===14)return d;return k}
function pixCopia(chave,nome,cidade,centavos,txid){
  chave=pixChave(chave);if(!chave)return '';
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const mai=f('00','br.gov.bcb.pix')+f('01',chave);
  let p=f('00','01')+f('26',mai)+f('52','0000')+f('53','986');
  if(centavos>0)p+=f('54',(centavos/100).toFixed(2));
  p+=f('58','BR')+f('59',pixLimpa(nome,25)||'RECEBEDOR')+f('60',pixLimpa(cidade,15)||'RECIFE')+f('62',f('05',(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***'))+'6304';
  return p+pixCRC(p);
}

/* cria as mensalidades que ainda não existem: a 1ª vence 30 dias após o pagamento da implantação, depois uma por mês */
/* último dia do mês atual: mensalidades de meses futuros não aparecem */
function admFimMes(){const t=todayStr();return addDays(addMonths(t.slice(0,7)+'-01',1),-1)}
const admVisivel=c=>c.tipo!=='mensalidade'||c.pago||c.venc<=admFimMes();
function admBase(o){
  const impl=(ADM.cobAll||ADM.cob).find(c=>c.otica_id===o.id&&c.tipo==='implementacao');
  if(impl)return impl.pago?String(impl.pago_em||impl.venc).slice(0,10):null;
  return String(o.impl_data||o.criada_em||'').slice(0,10)||null;
}
async function admGerar(){
  const hoje=todayStr(),rows=[],fim=admFimMes();
  ADM.list.forEach(o=>{
    if(!o.ativa||!(+o.mensalidade>0))return;
    const base=admBase(o);if(!base)return;
    /* segue a última mensalidade existente, para respeitar datas editadas à mão */
    const ex=(ADM.cobAll||ADM.cob).filter(c=>c.otica_id===o.id&&c.tipo==='mensalidade'&&c.parcela).sort((x,y)=>x.parcela-y.parcela);
    const last=ex[ex.length-1];
    const ref=last?{n:last.parcela,venc:last.venc}:{n:1,venc:addDays(base,30)};
    for(let n=last?last.parcela+1:1;n<=240;n++){
      const venc=addMonths(ref.venc,n-ref.n);if(venc>fim)break;
      rows.push({otica_id:o.id,tipo:'mensalidade',parcela:n,venc:venc,valor:+o.mensalidade});
    }
  });
  if(!rows.length)return;
  const r=await sb.from('adm_cobrancas').upsert(rows,{onConflict:'otica_id,tipo,parcela',ignoreDuplicates:true});
  if(r.error)throw r.error;
  const c=await sb.from('adm_cobrancas').select('*');if(!c.error){ADM.cobAll=c.data||[];ADM.cob=ADM.cobAll.filter(admVisivel)}
}

async function pushEstado(){

function pushCard(){

async function pushLigar(){

    const k=atob(VAPID_PUB.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-VAPID_PUB.length%4)%4));const key=new Uint8Array(k.length);for(let i=0;i<k.length;i++)key[i]=k.charCodeAt(i);

/* mensalidades de um mês: as reais + as previstas das óticas ativas */
function menDoMes(mk){
  const all=ADM.cobAll||ADM.cob,out=all.filter(c=>c.venc.slice(0,7)===mk);
  ADM.list.forEach(o=>{
    if(!o.ativa||!(+o.mensalidade>0))return;
    if(out.some(c=>c.otica_id===o.id&&c.tipo==='mensalidade'))return;
    const ex=all.filter(c=>c.otica_id===o.id&&c.tipo==='mensalidade'&&c.parcela).sort((x,y)=>x.parcela-y.parcela);
    let ref;
    if(ex.length){const l=ex[ex.length-1];ref={n:l.parcela,venc:l.venc}}
    else{const base=admBase(o);if(!base)return;ref={n:1,venc:addDays(base,30)}}
    if(mk<ref.venc.slice(0,7)||(ex.length&&mk===ref.venc.slice(0,7)))return;
    const k=(+mk.slice(0,4)-+ref.venc.slice(0,4))*12+(+mk.slice(5,7)-+ref.venc.slice(5,7));
    out.push({id:'prev-'+o.id+'-'+mk,otica_id:o.id,tipo:'mensalidade',parcela:ref.n+k,venc:addMonths(ref.venc,k),valor:+o.mensalidade,pago:false,prevista:true});
  });
  return out.sort((x,y)=>x.venc.localeCompare(y.venc)||admOtica(x.otica_id).nome.localeCompare(admOtica(y.otica_id).nome));
}

/* logo: lê o arquivo, gera a versão clara (original) e a branca (silhueta) */
function lerImagem(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>ok({im:im,u:u});im.onerror=()=>no(new Error('Não foi possível ler a imagem.'));im.src=u})}
function canvasBlob(cv){return new Promise(ok=>cv.toBlob(b=>ok(b),'image/png'))}
async function prepararLogo(file,branca){
  const r=await lerImagem(file);const im=r.im;const k=Math.min(1,900/im.naturalWidth);
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*k));cv.height=Math.max(1,Math.round(im.naturalHeight*k));
  const g=cv.getContext('2d');g.drawImage(im,0,0,cv.width,cv.height);
  const d=g.getImageData(0,0,cv.width,cv.height);let transp=false;
  for(let i=3;i<d.data.length;i+=4)if(d.data[i]<200){transp=true;break}
  if(!transp)throw new Error('A logo precisa ter fundo transparente (PNG).');
  const claro=await canvasBlob(cv);let escuro=null;
  if(branca){for(let i=0;i<d.data.length;i+=4){d.data[i]=255;d.data[i+1]=255;d.data[i+2]=255}g.putImageData(d,0,0);escuro=await canvasBlob(cv)}
  return {claro:claro,escuro:escuro,url:URL.createObjectURL(claro),urlW:escuro?URL.createObjectURL(escuro):''};
}

  if(r.error)throw r.error;
  return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
}

/* follow-up: com o WhatsApp Automático ligado, os botões que abririam o WhatsApp colocam a mensagem na fila da automação */
function waFilaContato(d){
  if(typeof waOn!=='function'||!waOn())return false;const t=todayStr();
  const TP={cheg:'chegou',ent:'agradecimento',bv:'boasvindas',ani:'aniversario',rev:'revisao',fup:'followup'};
  if(d.contact!=='p'&&(!TP[d.contact]||waModo(TP[d.contact])==='off'))return false;
  if(d.contact==='p'){const v=S.vendas[d.v];const p=v&&v.parcelas[+d.pi];if(!p||waModo(pStatus(p)==='atraso'?'atraso':'lembrete')==='off')return false}
  if(d.contact==='cheg'||d.contact==='ent'){const v=S.vendas[d.v];const c=v&&S.clientes[v.clienteId];if(!c||!c.whatsapp)return false;A.waent({t:d.contact,v:d.v});return true}
  if(d.contact==='bv'){const c=S.clientes[d.c];if(!c||!c.whatsapp)return false;A.wabv({c:d.c});return true}
  let ok=false;
  if(d.contact==='p'){const v=S.vendas[d.v];const p=v&&v.parcelas[+d.pi];const c=v&&S.clientes[v.clienteId];if(!p||!c)return false;
    const kind=pStatus(p)==='atraso'?'atraso':'lembrete';ok=waEnq(kind,c,fillTpl(tpl(kind),ctx(v,p,c)),'m'+kind+':'+v.id+':'+d.pi+':'+t)}
  else if(d.contact==='ani'){const c=S.clientes[d.c];if(!c)return false;ok=waEnq('aniversario',c,fillTpl(tpl('aniversario'),ctx(null,null,c)),'mani:'+c.id+':'+t)}
  else if(d.contact==='rev'){const c=S.clientes[d.c];if(!c)return false;ok=waEnq('revisao',c,fillTpl(tpl('revisao'),ctx(null,null,c)),'mrev:'+c.id+':'+t)}
  else if(d.contact==='fup'){const x=fupDoc().itens[d.id];const c=x&&S.clientes[x.clienteId];if(!c)return false;
    ok=waEnq('followup',c,'Olá, '+String(c.nome).split(' ')[0]+'! Aqui é da '+cfg().nome+'. '+(x.nota||x.titulo),'mfup:'+x.id+':'+t)}
  if(ok)markContact(d);
  return ok;
}
function markContact(d){
  if(d.contact==='p'){const v=S.vendas[d.v];if(v){v.parcelas[+d.pi].contatoEm=todayStr();persist('vendas',v.id)}}
  else if(d.contact==='ani'){const c=S.clientes[d.c];if(c){c.aniEm=todayStr().slice(0,4);persist('clientes',c.id)}}
  else if(d.contact==='rev'){const c=S.clientes[d.c];if(c){c.revEm=todayStr();persist('clientes',c.id)}}
  else if(d.contact==='cheg'){const v=S.vendas[d.v];if(v){v.chegouEm=todayStr();persist('vendas',v.id)}}
  else if(d.contact==='ent'){const v=S.vendas[d.v];if(v){if(!v.entregueEm)v.entregueEm=todayStr();v.agradEm=todayStr();persist('vendas',v.id)}}
  else if(d.contact==='bv'){const c=S.clientes[d.c];if(c){c.bvEm=todayStr();persist('clientes',c.id)}}
  setTimeout(refresh,80);
}

function onField(e){
  const t=e.target;if(!(t instanceof HTMLElement))return;const ch=e.type==='change';
  if(t.id==='restore-file'){if(ch&&t.files&&t.files[0]){restaurar(t.files[0]);t.value=''}return}
  if(t.dataset.mask==='cpf'){t.value=maskCpf(t.value);const h=t.parentElement.querySelector('.hint');if(h){const d=digits(t.value);h.textContent=d.length===11&&!validCpf(t.value)?'CPF parece inválido. Confira os números.':'';h.classList.toggle('bad',!!h.textContent)}}
  if(t.dataset.mask==='tel')t.value=maskTel(t.value);
  if(t.dataset.bind&&ui.draft){
    setPath(ui.draft,t.dataset.bind,t.value);
    if(t.dataset.bind==='clienteId'){const nc=$('#novo-cli');if(nc)nc.hidden=ui.draft.clienteId!=='__novo'}
    if(t.dataset.bind==='forma')pgToggle();
    updateVenda();
  }
  if(t.dataset.aguard!==undefined&&ui.draft){ui.draft.aguardando=t.checked;updateVenda()}
  if(t.dataset.cbind&&ui.cdraft)setPath(ui.cdraft,t.dataset.cbind,t.value);
  if(t.dataset.os!==undefined&&ui.os)setPath(ui.os,t.dataset.os,t.value);
  if(t.dataset.fu!==undefined&&ui.fu)ui.fu[t.dataset.fu]=t.value;
  if(t.dataset.item!==undefined&&ui.draft){ui.draft.itens[+t.dataset.item][t.dataset.f]=t.value;updateVenda()}
  if(ch&&t.dataset.lente!==undefined&&ui.draft){const it=ui.draft.itens[+t.dataset.lente];const l=S.lentes[t.value];it.lenteId=l?l.id:'';it.nome=l?l.nome:'';it.valor=l?centsToStr(l.valor):'';renderItems();updateVenda()}
  if(t.id==='q-v'){ui.vQuery=t.value;$('#vlist').innerHTML=vendasList()}
  if(t.id==='q-os'){if(ch)return;ui.osQ=t.value;$('#oslist').innerHTML=osLista();return}
  if(t.id==='q-c'){ui.cQuery=t.value;$('#clist').innerHTML=clientesList()}
  if(t.id==='q-l'){ui.lQuery=t.value;$('#llist').innerHTML=lentesList()}
  if(ch&&t.dataset.rel){ui.rmes=t.value;renderSheet()}
  if(ch&&t.dataset.cx){ui[t.dataset.cx]=t.value;render()}
  if(ch&&t.dataset.cfg){const c=Object.assign({id:'otica'},S.config.otica||{});c[t.dataset.cfg]=t.dataset.cfg==='autolock'?+t.value:t.value.trim();S.config.otica=c;persist('config','otica');toast('Salvo')}
  if(ch&&t.dataset.tpl){const c=Object.assign({id:'otica'},S.config.otica||{});c.tpl=Object.assign({},c.tpl);c.tpl[t.dataset.tpl]=t.value;S.config.otica=c;persist('config','otica');toast('Mensagem salva')}
  if(ch&&t.dataset.lid){const l=S.lentes[t.dataset.lid];if(l){if(t.dataset.lf==='nome'){if(t.value.trim())l.nome=t.value.trim()}else if(t.dataset.lf==='tipo'){l.tipo=t.value.trim()}else{const v=parseMoney(t.value);if(v>0)l.valor=v}persist('lentes',l.id);refresh()}}
  if(ch&&t.dataset.vencv){const v=S.vendas[t.dataset.vencv];if(v&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){v.parcelas[+t.dataset.vencp].venc=t.value;persist('vendas',v.id);refresh();toast('Vencimento alterado')}}
  if(ch&&t.dataset.formav){const v=S.vendas[t.dataset.formav];if(v){v.parcelas[+t.dataset.formap].forma=t.value;persist('vendas',v.id);refresh();toast('Forma de recebimento alterada')}}
}

<script>
/* avisa quando há uma versão nova do sistema publicada (o app da tela de início fica aberto por dias) */
(function(){
  var ult=0,avisado=false;
  function pegar(){return fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null}).then(function(t){var m=t&&t.match(/APP_BUILD='([^']+)'/);return m?m[1]:null}).catch(function(){return null})}
  function aviso(){
    if(avisado)return;avisado=true;
    var b=document.createElement('button');b.type='button';b.id='nova-versao';
    b.textContent='Nova versão do sistema disponível · toque para atualizar';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:200;background:#1F2A3C;color:#fff;border:0;border-left:3px solid #F2C811;border-radius:4px;padding:11px 16px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 0 #B9FF66;max-width:calc(100% - 32px)';
    b.onclick=function(){location.reload()};document.body.appendChild(b);
  }
  function checar(){
    var agora=Date.now();if(agora-ult<5*60*1000)return;ult=agora;
    pegar().then(function(h){if(h==null||typeof APP_BUILD==='undefined'||h===APP_BUILD)return;
      /* versão antiga aberta: atualiza sozinho se não houver nada sendo digitado; senão, avisa */
      var ae=document.activeElement,digitando=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName),ocupado=!!document.querySelector('.sheet,.dl')||(typeof ui!=='undefined'&&ui&&ui.draft);
      var ok=true;try{var u=+sessionStorage.getItem('autoRecarga')||0;if(Date.now()-u<120000)ok=false}catch(e){}
      if(!digitando&&!ocupado&&ok&&!document.hidden){try{sessionStorage.setItem('autoRecarga',String(Date.now()))}catch(e){}location.reload();return}
      aviso()});
  }
  window.addEventListener('load',function(){setTimeout(function(){ult=0;checar()},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checar()});
  setInterval(function(){if(!document.hidden)checar()},10*60*1000);
})();
</script>
