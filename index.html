<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* o iPhone lê estes dados ao salvar na tela de início: o /adm precisa do seu próprio ícone, nome e endereço */
(function(){var a=/^\/adm(\/|$)/.test(location.pathname);
document.write('<meta name="theme-color" content="'+(a?'#191A23':'#00348A')+'">'+
'<link rel="manifest" href="'+(a?'/adm.webmanifest':'/manifest.webmanifest')+'">'+
'<link rel="apple-touch-icon" href="'+(a?'/icons/adm-apple-touch-icon.png':'/icons/apple-touch-icon.png')+'">'+
'<meta name="apple-mobile-web-app-title" content="'+(a?'Adm Óticas':'Cobranças')+'">'+
'<title>'+(a?'Adm Óticas':'Cobranças')+'</title>')})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Identidade: azul escuro e azul claro da logo, com branco. Layout: sistema de balcão. Desktop: menu lateral fixo + área de trabalho em duas colunas. Celular: cabeçalho fino, 4 abas + "Mais" na base. Porta de entrada com login. */
:root{
  --bg:#EDF3FB; --surface:#FFFFFF; --surface-2:#E2EBF8; --fg:#0A1D3C; --muted:#53698C; --line:#D0DCEE;
  --accent:#0B4FB0; --accent-fg:#FFFFFF; --accent-soft:#DCEAFC; --brand-1:#0486DE; --brand-2:#00348A;
  --ok:#17703F; --ok-bg:#DCF0E3; --warn:#8F5A00; --warn-bg:#F7EACA; --bad:#B3261E; --bad-bg:#F8DDDA;
  --bad-solid:#B3261E; --wa:#1F8A4C; --wa-fg:#FFFFFF; --bar-a:#0B4FB0; --bar-b:#4AB0F5;
  --shadow:0 1px 2px rgba(5,30,80,.07),0 10px 28px rgba(5,30,80,.14);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06142C; --surface:#0D2347; --surface-2:#153060; --fg:#E7EFFC; --muted:#9BB0D3; --line:#21427A;
    --accent:#5AB4F7; --accent-fg:#03173A; --accent-soft:#12305F;
    --ok:#5FCB90; --ok-bg:#113222; --warn:#E8B04A; --warn-bg:#382C0F; --bad:#F2877F; --bad-bg:#3B1815;
    --bad-solid:#D8453D; --wa:#3DBE78; --wa-fg:#04210F; --bar-a:#2F7FE0; --bar-b:#6CC4FA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06142C; --surface:#0D2347; --surface-2:#153060; --fg:#E7EFFC; --muted:#9BB0D3; --line:#21427A;
  --accent:#5AB4F7; --accent-fg:#03173A; --accent-soft:#12305F;
  --ok:#5FCB90; --ok-bg:#113222; --warn:#E8B04A; --warn-bg:#382C0F; --bad:#F2877F; --bad-bg:#3B1815;
  --bad-solid:#D8453D; --wa:#3DBE78; --wa-fg:#04210F; --bar-a:#2F7FE0; --bar-b:#6CC4FA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
#fatal{position:fixed;left:0;right:0;top:0;z-index:999;background:#B3261E;color:#fff;padding:10px 16px;font:14px/1.4 sans-serif;display:none}
*{box-sizing:border-box}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* estrutura */
.shell{display:block}
.side{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100% - 980px)/2));background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff}
.menubtn{position:relative;flex:none;width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.menubtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.menubtn .badge{top:-5px;left:auto;right:-5px}
.side .brand{margin-right:auto}
.drawer{left:0;right:auto;top:0;bottom:0;max-height:none;width:min(300px,86vw);border-radius:0 18px 18px 0;transform:none}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
.brand .logo{height:36px;width:auto;display:block}
.brand-sub{display:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);font-weight:600}
.side-foot{display:flex;align-items:center;gap:10px}
.who{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);display:none;overflow-wrap:anywhere}
.sync{font-size:12px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
.sync.cloud i{background:#7CF0A8} .sync.local i{background:#FFD27A}
.side .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.42);color:#fff}
.content{max-width:980px;margin-inline:auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);font-weight:600}
.tab[aria-current=page]::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-solid);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center}
@media (min-width:900px){
  .menubtn{display:none}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:24px;padding:28px 14px}
  .side .brand{margin-right:0}
  .brand .logo{height:auto;width:100%;max-width:196px;margin-inline:6px}
  .brand-sub{display:block;margin-left:6px}
  .tabs{position:static;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0}
  .tab{flex-direction:row;gap:12px;padding:11px 12px;border-radius:10px;font-size:14.5px;justify-content:flex-start;text-align:left;color:rgba(255,255,255,.86)}
  .tab[aria-current=page]{background:rgba(255,255,255,.2);color:#fff}
  .tab[aria-current=page]::before{display:none}
  .badge{position:static;margin-left:auto}
  .side-foot{margin-top:auto;flex-direction:column;align-items:stretch;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.28)}
  .who{display:block}
  .content{margin-inline:0;max-width:1240px;padding:30px 40px 56px}
}

/* texto e blocos */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:25px}
@media (min-width:900px){.ph h1{font-size:30px}}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.sh h2{font-size:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.gridlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
@media (min-width:900px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.cols.agenda{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.panel{min-width:0}

/* botões e chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad-solid);color:#fff;border-color:var(--bad-solid)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;margin:-4px 0;font-weight:600;font-size:15px;color:var(--fg);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.demo{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;text-align:left;display:block;width:100%}
button.tile:hover{border-color:var(--accent)}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--f-display);font-size:23px;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{display:block;font-size:12.5px;color:var(--muted)}
.tile .t2{margin-top:1px}
.tiles4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:759px){.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}}
.tile.t-ok b{color:var(--ok)} .tile.t-bad b{color:var(--bad)} .tile.t-acc b{color:var(--accent)}
.tile.hero{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));border-color:transparent}
.tile.hero small,.tile.hero span{color:#fff;opacity:.88} .tile.hero b{color:#fff}

/* calendário */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.calhead h2{font-size:19px;flex:1;min-width:0}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding-block:4px;letter-spacing:.06em}
.day{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;min-width:0}
@media (min-width:900px){.day{min-height:64px}.day .a{font-size:11.5px}}
.day.out{border-color:transparent;background:transparent}
.day .n{font-size:13px;font-weight:600}
.day .a{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;min-height:13px}
.day.late{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.day.open{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.day.paid{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:9px;min-width:22px;text-align:center;padding:0 4px}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day .a.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;font-weight:600}
.day.prev{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.msum .ms{padding:12px 14px;min-width:0;border-left:1px solid var(--line)}
.msum .ms:first-child{border-left:0}
.msum small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.msum b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msum span{font-size:12px;color:var(--muted)}
.msum .ok b{color:var(--ok)}.msum .bad b{color:var(--bad)}
@media (max-width:520px){.msum .ms{padding:10px 8px;text-align:center}.msum b{font-size:16px}.msum small,.msum span{font-size:11px}}
.legend+.sh,.panel .legend{margin-bottom:6px}
.menlist .row{flex-direction:column;gap:8px}
.menlist .row-side{width:100%;display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.menlist .row-side .acts{justify-content:flex-start}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

/* linhas e cartões */
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.row-main{min-width:0;display:flex;flex-direction:column;gap:5px;flex:1}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.row .amt{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mini{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.mini input,.mini select{min-height:34px;padding:0 8px;width:auto;font-size:14px}
@media (max-width:460px){.row{flex-direction:column}.row-side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%;row-gap:8px}.row-side .amt{flex:none}.row-side .acts{margin-left:auto}.row-side .acts:has(>:nth-child(3)){flex:1 1 100%}.row-side .acts:has(>:nth-child(3)) .btn{flex:1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card{text-align:left;width:100%}
button.card:hover{border-color:var(--accent)}
.sale-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sale-top b{font-size:16px;overflow-wrap:anywhere}
.sale-bot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar.acc i{background:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted)}
.fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.brk{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:56px;height:56px;color:var(--accent);opacity:.8}
.empty h3{font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* gráfico de meses */
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mbars{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:5px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,var(--line) 0,var(--line) 1px,transparent 1px,transparent 50%)}
.mb{width:38%;max-width:26px;border-radius:4px 4px 0 0;min-height:0}
.mb.a{background:var(--bar-a)} .mb.b{background:var(--bar-b)}
.mlabel{font-size:12px;font-weight:600;text-transform:capitalize}
.mval{font-size:11px;font-variant-numeric:tabular-nums;line-height:1.25;text-align:center;min-height:2.5em}
.mval .vz{display:block;color:var(--muted);font-size:10.5px;padding-top:2px}
.mval .vz::before{display:none}
.mval div{display:flex;align-items:center;justify-content:center;gap:4px}
.mval .va::before,.mval .vb::before{content:'';width:7px;height:7px;border-radius:2px;flex:none}
.mval .va::before{background:var(--bar-a)} .mval .vb::before{background:var(--bar-b)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* formulários */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{padding:10px 12px;min-height:96px;line-height:1.4;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.hint.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:8px}
.aguard-box{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.aguard-box input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent,#3D8BFD)}
.aguard-box b{display:block}.aguard-box small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.lk{display:inline-flex;align-items:center;margin-left:6px;opacity:.75;vertical-align:middle}
.pl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.modrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.modrow input{width:18px;height:18px;flex:none;accent-color:var(--accent,#3D8BFD)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fotos figcaption{font-size:11.5px;color:var(--muted)}
.rxch{width:100%;height:auto;max-height:160px}
.rxt{width:100%;border-collapse:collapse;font-size:13px}.rxt th,.rxt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;place-items:center;min-height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-bot{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.item-bot b{color:var(--fg);font-variant-numeric:tabular-nums}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum-row{display:flex;justify-content:space-between;gap:10px}
.sum-row.big{font-family:var(--f-display);font-size:20px;font-weight:700;padding-block:4px;border-block:1px solid var(--line)}
.sum-row.hl{color:var(--accent);font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:15px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
summary{font-weight:600;cursor:pointer;min-height:28px}
details[open] summary{margin-bottom:10px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;gap:12px;min-height:50px;font-size:15px;position:relative}
.menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu .badge{position:static;margin-left:auto}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,20,24,.52);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:94%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
.sheet-body{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.foot-row{display:flex;gap:8px;flex-wrap:wrap}
.foot-row .btn{flex:1}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:90vh;border-radius:18px}
}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* tela de entrada */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--brand-1),var(--brand-2));display:none;overflow:auto;padding:24px 16px;place-items:center}
.gate.on{display:grid}
.gate-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--shadow)}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gate-brand .logo{width:min(250px,82%);height:auto}
.lg-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-b{display:none}:root:not([data-theme="light"]) .lg-w{display:block}}
:root[data-theme="dark"] .lg-b{display:none}
:root[data-theme="dark"] .lg-w{display:block}
.gate-card h2{font-size:19px}
.sheet.drawer{left:0;right:auto;top:0;bottom:0;transform:none;width:min(300px,86vw);max-height:none;border-radius:0 18px 18px 0}
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid;border-radius:14px;padding:14px 16px;margin-bottom:12px;font:inherit;cursor:pointer}
.alert svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert b{display:block;font-size:15.5px}.alert span{font-size:13.5px;opacity:.9}
.alert.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
/* Acabamento: sóbrio, financeiro, premium */
:root{--f-display:'Newsreader',Georgia,'Times New Roman',serif;--side-a:color-mix(in srgb,var(--brand-2) 80%,#000);--side-b:color-mix(in srgb,var(--brand-2) 46%,#000);--tabline:color-mix(in srgb,var(--brand-1) 55%,#fff)}
h1,h2,h3{font-weight:500;letter-spacing:-.015em}
.ph h1{font-size:30px}
.sh h2{font-size:21px}
.side{background:linear-gradient(135deg,var(--side-a),var(--side-b))}
.btn{border-radius:8px;min-height:40px}
.btn.sm{min-height:34px}
.chip{border-radius:6px;font-size:11.5px}
.row,.card,.tile{border-radius:10px}
.tile small{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.tile b{font-weight:500;font-size:26px;font-variant-numeric:lining-nums tabular-nums}
.row .amt{font-weight:600;font-variant-numeric:lining-nums tabular-nums}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{border-radius:8px}
.sheet-head h2{font-weight:500}
.alert{border-radius:10px;border-left-width:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 16px 14px;border:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px;width:100%;color:var(--fg)}
.kpi.lead{grid-column:1/-1;box-shadow:inset 0 3px 0 var(--accent)}
.kpi small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.kpi.lead b{font-size:34px;color:var(--accent)}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.neg b{color:var(--bad)}
.kpi.total{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
button.kpi{cursor:pointer}
button.kpi:hover{background:var(--surface-2)}
@media (min-width:900px){
  .ph h1{font-size:38px}
  .side{background:linear-gradient(180deg,var(--side-a),var(--side-b))}
  .tab{border-radius:8px;padding:10px 14px;font-weight:500;color:rgba(255,255,255,.74)}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff}
  .tab[aria-current=page]{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--tabline)}
}
@media (min-width:1180px){
  .kpis{grid-template-columns:1.3fr repeat(4,minmax(0,1fr))}
  .kpi{padding:20px 20px 18px}
  .kpi.lead{grid-column:auto}
  .kpi b{font-size:28px}
  .kpi.lead b{font-size:34px}
}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer;min-height:52px}
.acc-h:hover{border-color:var(--accent)}
.acc-t{font-weight:600;flex:1}
.acc-i{color:var(--muted);font-size:13px;font-variant-numeric:lining-nums tabular-nums}
.acc-h svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none;color:var(--muted)}
.acc-h[aria-expanded=true] svg{transform:rotate(180deg)}
.acc-b{margin-top:10px;display:flex;flex-direction:column;gap:16px}
.mes-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.mes-h b{font-family:var(--f-display);font-size:17px;font-weight:500}
.mes-h span{color:var(--muted);font-variant-numeric:lining-nums tabular-nums}

/* v9: relacionamento, receitas, admin */
.alert.info{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rx{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.rx-grid{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:6px 8px;align-items:center}
.rx-grid>b{font-size:11.5px;color:var(--muted);font-weight:600}
.rx-eye{font-weight:700;font-size:13px;color:var(--accent)}
.rx-grid input{min-width:0;padding-inline:8px;text-align:center}
.adm-top{display:flex;align-items:center;gap:12px}
.adm-logo{width:64px;height:44px;border-radius:8px;display:grid;place-items:center;flex:none;overflow:hidden;color:#fff;font-weight:700}
.adm-logo img{max-width:88%;max-height:70%;object-fit:contain}
.team{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .who2{min-width:0;overflow-wrap:anywhere}
.logo-prev{display:flex;align-items:center;gap:10px}
.logo-prev .adm-logo{width:96px;height:56px}
input[type=color]{padding:2px;height:42px;width:100%;cursor:pointer}
.brand-adm{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;color:#fff;display:flex;flex-direction:column;gap:4px}
.brand-adm small{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
@media (max-width:899px){.brand-adm{font-size:22px}.brand-adm small{display:none}}

/* sino e lembrete */
.bellbtn{position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;height:42px;min-width:42px;padding:0 9px;border-radius:10px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font:inherit;font-weight:500}
.bellbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 10%}
.bellbtn .bl{display:none}
.bellbtn .badge{top:-6px;left:auto;right:-6px;background:#fff;color:#B3261E;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.bellbtn.bad{background:#C62828;border-color:transparent}
.bellbtn.warn{background:#B77900;border-color:transparent}
.bellbtn.ring svg{animation:ring 2.2s ease-in-out infinite}
@keyframes ring{0%,40%,100%{transform:rotate(0)}4%{transform:rotate(18deg)}8%{transform:rotate(-16deg)}12%{transform:rotate(13deg)}16%{transform:rotate(-11deg)}20%{transform:rotate(8deg)}24%{transform:rotate(-5deg)}28%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.bellbtn.ring svg{animation:none}}
@media (min-width:900px){.bellbtn{width:100%;justify-content:flex-start;height:46px;padding:0 14px}.bellbtn .bl{display:inline}.bellbtn .badge{top:50%;right:12px;transform:translateY(-50%)}}
#popup{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);z-index:95;width:min(460px,calc(100% - 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#popup.on{transform:translate(-50%,0)}
.pop{display:flex;align-items:stretch;background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-left-width:5px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.pop-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:12px 6px 12px 14px}
.pop-main svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop-main b{display:block;font-size:15.5px}.pop-main small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pop-x{flex:none;width:44px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#popup{transition:none}}
#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
/* agenda: indicadores em uma faixa só */
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .kpi{padding:12px 12px 11px;gap:3px}
.kpis.k3 .kpi small{font-size:12px}
.kpis.k3 .kpi b{font-size:17px;white-space:nowrap}
.kpis.k3 .kpi span{font-size:11.5px}
.kpi b.c-acc{color:var(--accent)}.kpi b.c-ok{color:var(--ok)}
@media (min-width:600px){.kpis.k3 .kpi{padding:16px 18px 14px}.kpis.k3 .kpi small{font-size:13px}.kpis.k3 .kpi b{font-size:26px}.kpis.k3 .kpi span{font-size:12.5px}}
.hintbtn{display:block;width:100%;text-align:left;background:var(--warn-bg);color:var(--warn);border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

/* ===== Tema Adm (estilo Positivus): grafite, verde-limão e branco. Só vale no /adm ===== */
:root.adm.adm{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#F3F3F3; --fg:#191A23; --muted:#5B5C66; --line:#D6D6DB;
  --accent:#191A23; --accent-fg:#FFFFFF; --accent-soft:#E9FFD3; --brand-1:#191A23; --brand-2:#191A23;
  --lime:#B9FF66; --lime-fg:#191A23; --ink:#191A23; --edge:#191A23; --drop:0 5px 0 #191A23;
  --ok:#2E7D1E; --ok-bg:#E2FBC6; --warn:#8A5A00; --warn-bg:#FFF0C7; --bad:#C2271C; --bad-bg:#FFE1DD; --bad-solid:#C2271C;
  --wa:#191A23; --wa-fg:#B9FF66;
  --f-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --side-a:#191A23; --side-b:#191A23; --tabline:#B9FF66;
  --shadow:0 5px 0 #191A23;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root.adm.adm:not([data-theme="light"]){
    --bg:#0E0F14; --surface:#191A23; --surface-2:#23242F; --fg:#F3F3F3; --muted:#A7A8B3; --line:#33343F;
    --accent:#B9FF66; --accent-fg:#191A23; --accent-soft:#2A3A1A; --edge:#3D3E4A; --drop:0 5px 0 #000;
    --ok:#B9FF66; --ok-bg:#25351A; --warn:#F2C55C; --warn-bg:#3A2E12; --bad:#FF8A7E; --bad-bg:#3D1A17; --bad-solid:#E0453A;
    --wa:#B9FF66; --wa-fg:#191A23; --shadow:0 5px 0 #000; color-scheme:dark;
  }
}
:root.adm.adm[data-theme="dark"]{
  --bg:#0E0F14; --surface:#191A23; --surface-2:#23242F; --fg:#F3F3F3; --muted:#A7A8B3; --line:#33343F;
  --accent:#B9FF66; --accent-fg:#191A23; --accent-soft:#2A3A1A; --edge:#3D3E4A; --drop:0 5px 0 #000;
  --ok:#B9FF66; --ok-bg:#25351A; --warn:#F2C55C; --warn-bg:#3A2E12; --bad:#FF8A7E; --bad-bg:#3D1A17; --bad-solid:#E0453A;
  --wa:#B9FF66; --wa-fg:#191A23; --shadow:0 5px 0 #000; color-scheme:dark;
}
html.adm body{font-family:var(--f-body);letter-spacing:-.005em}
html.adm h1,html.adm h2,html.adm h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.02em}

/* títulos: página grande, seções com etiqueta verde-limão */
html.adm .ph h1{font-size:34px}
html.adm .sh h2,html.adm .calhead h2{display:inline-block;background:var(--lime);color:var(--lime-fg);padding:1px 9px;border-radius:7px;font-size:20px;line-height:1.35}
html.adm .ph .sub{color:var(--muted)}
@media (min-width:900px){html.adm .ph h1{font-size:44px}}

/* menu: barra grafite, aba ativa verde-limão */
html.adm .side{background:#191A23}
html.adm .tabs{background:var(--surface);border-top:1px solid var(--edge)}
html.adm .tab[aria-current=page]{color:var(--fg)}
html.adm .tab[aria-current=page] svg{background:var(--lime);color:#191A23;border-radius:8px;padding:2px;box-sizing:content-box;margin:-2px}
html.adm .tab[aria-current=page]::before{background:var(--fg)}
@media (min-width:900px){
  html.adm .side{background:#191A23}
  html.adm .tab{color:rgba(255,255,255,.72);border-radius:12px}
  html.adm .tab:hover{background:rgba(255,255,255,.07);color:#fff}
  html.adm .tab[aria-current=page]{background:var(--lime);color:#191A23;box-shadow:none;font-weight:600}
  html.adm .tab[aria-current=page] svg{background:none;padding:0;margin:0}
  html.adm .tabs{background:none;border:0}
}
html.adm .brand-adm{font-family:var(--f-display)}
html.adm .bellbtn{border-radius:12px}
html.adm .bellbtn.bad{background:#C2271C}
html.adm .side .btn,html.adm .menubtn{border-radius:12px}

/* cartões: borda grafite + sombra sólida embaixo */
html.adm .card,html.adm .row,html.adm details,html.adm .acc-h,html.adm .msum,html.adm .tile,html.adm .empty{border:1px solid var(--edge);box-shadow:var(--drop);border-radius:22px}
html.adm .row{border-radius:18px;padding:14px 16px}
html.adm .card{padding:16px 18px;border-radius:24px}
html.adm .stack{gap:14px}
html.adm .gridlist{gap:16px}
html.adm .empty{border-style:solid}
html.adm details{padding:14px 18px}

/* indicadores: grade com bordas; o destaque em verde-limão e o total em grafite */
html.adm .kpis{gap:0;background:var(--surface);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--drop)}
html.adm .kpi{background:var(--surface);border-top:1px solid var(--line);border-left:1px solid var(--line)}
html.adm .kpi.lead{background:var(--lime);color:#191A23;box-shadow:none}
html.adm .kpi.lead small,html.adm .kpi.lead span{color:#191A23;opacity:.75}
html.adm .kpi.lead b{color:#191A23}
html.adm .kpi.total{background:#191A23;color:#F3F3F3}
html.adm .kpi.total small,html.adm .kpi.total span{color:#C9CAD3}
html.adm .kpi.total b{color:var(--lime)}
html.adm .kpi.neg b{color:var(--bad)}

/* resumo do mês (Mensalidades) */
html.adm .msum{border-radius:22px}
html.adm .msum .ms{border-left-color:var(--line)}
html.adm .msum .ms:first-child{background:var(--lime);color:#191A23}
html.adm .msum .ms:first-child small,html.adm .msum .ms:first-child span{color:#191A23;opacity:.75}
html.adm .msum .ms:first-child b{color:#191A23}

/* botões: grafite com texto branco; secundários com borda grafite */
html.adm .btn{border-radius:14px;border:1px solid var(--edge);font-weight:500;background:var(--surface);color:var(--fg)}
html.adm .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
html.adm .btn.ok{background:var(--lime);border-color:#191A23;color:#191A23}
html.adm .btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-fg)}
html.adm .btn.ghost{background:transparent}
html.adm .btn:hover{filter:brightness(.97)}

/* chips e filtros */
html.adm .chip{border-radius:8px;font-weight:500}
html.adm .chip.ok{background:var(--lime);color:#191A23}
html.adm .fchip{border-radius:14px;border:1px solid var(--edge);color:var(--fg);font-weight:500}
html.adm .fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* calendário */
html.adm .day{border-radius:12px;border-color:var(--line)}
html.adm .day.paid{background:var(--lime);color:#191A23}
html.adm .day.open{background:var(--warn-bg)}
html.adm .day.today .n{background:#191A23;color:var(--lime)}
html.adm .day.sel{outline:2px solid var(--fg)}

function confete(x,y){
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    const old=document.getElementById('confete');if(old)old.remove();
    const cv=document.createElement('canvas');cv.id='confete';const W=cv.width=innerWidth,H=cv.height=innerHeight;document.body.appendChild(cv);
    const g=cv.getContext('2d');const cores=['#2FBF71','#F5B700','#3D8BFD','#FF5D8F','#9B6BFF','#FF8A3D','#FFFFFF'];
    if(x==null){x=W/2;y=H*0.4}
    const P=[];for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.5,c:cores[i%cores.length],life:0})}
    const t0=performance.now();
    (function frame(t){
      const dt=t-t0;g.clearRect(0,0,W,H);
      P.forEach(p=>{p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;const al=Math.max(0,1-dt/2100);g.save();g.globalAlpha=al;g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
      if(dt<2100)requestAnimationFrame(frame);else cv.remove();
    })(t0);
  }catch(e){}
}

/* ---------- caixa ---------- */
function periodoCaixa(){
  const t=todayStr();
  if(ui.cx==='hoje')return [t,t];
  if(ui.cx==='7d')return [addDays(t,-6),t];
  if(ui.cx==='mes'){const m=t.slice(0,7);return [m+'-01',m+'-'+pad(new Date(+m.slice(0,4),+m.slice(5,7),0).getDate())]}
  if(ui.cx==='mesant'){const f=addMonths(t.slice(0,7)+'-01',-1);return [f,f.slice(0,7)+'-'+pad(new Date(+f.slice(0,4),+f.slice(5,7),0).getDate())]}
  const a=ui.cxFrom||t,b=ui.cxTo||t;return a<=b?[a,b]:[b,a];
}
function recebidosNoPeriodo(){const r=periodoCaixa();return allP().filter(x=>x.p.pago&&x.p.pagoEm&&x.p.pagoEm>=r[0]&&x.p.pagoEm<=r[1]).sort((a,b)=>b.p.pagoEm.localeCompare(a.p.pagoEm))}

  const r=periodoCaixa();const rec=recebidosNoPeriodo();const total=sumV(rec);
  const vend=vendasOk().filter(v=>v.data>=r[0]&&v.data<=r[1]);

/* ---------- sheets ---------- */
function sheetShell(title,body,foot){return '<div class="scrim" data-act="closesheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" tabindex="-1"><div class="sheet-head"><h2>'+title+'</h2><button class="ib" data-act="closesheet" aria-label="Fechar">&#215;</button></div><div class="sheet-body">'+body+'</div>'+(foot?'<div class="sheet-foot">'+foot+'</div>':'')+'</section>'}
function renderSheet(){
  const el=$('#layer');const s=ui.sheet;
  if(!s){el.innerHTML='';el.dataset.key='';document.documentElement.classList.remove('lock');return}
  const key=s.kind+(s.id||'');const old=el.querySelector('.sheet-body');const top=(old&&el.dataset.key===key)?old.scrollTop:0;
  let html=null;
  if(s.kind==='venda')html=sheetVenda(s.id);else if(s.kind==='nova')html=sheetNova();else if(s.kind==='cliente')html=sheetCliente(s.id);else if(s.kind==='cliente-ok')html=sheetClienteOk(s.id);else if(s.kind==='mais')html=sheetMais();else if(s.kind==='hist')html=sheetHist();else if(s.kind==='recibo')html=sheetRecibo(s);else if(s.kind==='relatorio')html=sheetRelatorio();else if(s.kind==='adm')html=sheetAdm();else if(s.kind==='admok')html=sheetAdmOk();
  if(html===null){ui.sheet=null;renderSheet();return}
  document.documentElement.classList.add('lock');
  el.innerHTML=html;
  const nb=el.querySelector('.sheet-body');if(nb&&top)nb.scrollTop=top;
  if(s.kind==='nova'){renderItems();updateVenda()}
  if(el.dataset.key!==key){const sh=el.querySelector('.sheet');if(sh)sh.focus({preventScroll:true})}
  el.dataset.key=key;
}
function closeSheet(){ui.sheet=null;ui.draft=null;ui.cdraft=null;ui.confirm='';renderSheet()}

function draftState(){
  const D=ui.draft;const errs=[],targets=[];const E=(m,sel)=>{errs.push(m);targets.push(sel||'')};
  if(D.clienteId==='__novo'){if(!D.novo.nome.trim())E('Informe o nome do cliente','[data-bind="novo.nome"]');else if(digits(D.novo.whatsapp).length<10)E('Informe o WhatsApp com DDD','[data-bind="novo.whatsapp"]');else if(cpfDup(D.novo.cpf))E('Já existe cliente com este CPF: '+cpfDup(D.novo.cpf).nome,'[data-bind="novo.cpf"]')}
  else if(!D.clienteId)E('Escolha o cliente','#f-cli');
  const itens=D.itens.map(it=>({tipo:it.tipo,nome:(it.nome||'').trim(),qtd:Math.max(1,parseInt(it.qtd,10)||1),valor:parseMoney(it.valor),juros:parsePct(it.juros),lenteId:it.lenteId||''}));
  if(!itens.length)errs.push('Adicione ao menos um item');
  itens.forEach((it,i)=>{if(!it.nome)E('Item '+(i+1)+': '+(it.tipo==='lente'?'escolha a lente':'informe o nome do produto'),it.tipo==='lente'?'[data-lente="'+i+'"]':'[data-item="'+i+'"][data-f="nome"]');else if(it.valor<=0)E('Item '+(i+1)+': informe o valor','[data-item="'+i+'"][data-f="valor"]')});
  const entradaIn=parseMoney(D.entrada);const c=calcVenda(itens,parsePct(D.jurosVenda),entradaIn);
  const n=Math.min(36,Math.max(0,parseInt(D.n,10)||0));
  if(c.total>0&&entradaIn>c.total)errs.push('A entrada é maior que o total');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(D.data))errs.push('Informe a data da venda');
  if(c.saldo>0&&n<1)errs.push('Informe o número de parcelas');
  if(c.saldo>0&&!/^\d{4}-\d{2}-\d{2}$/.test(D.primeira))errs.push('Informe o vencimento da 1ª parcela');
  return {errs:errs,targets:targets,itens:itens,c:c,n:n,parc:splitParcelas(c.saldo,n,D.primeira)};
}

function salvarVenda(){
  if(!ui.draft)return;const st=draftState();if(st.errs.length){toast(st.errs[0]);return}
  const D=ui.draft;let cid=D.clienteId;
  if(cid==='__novo'){const cl=makeCliente(D.novo);cid=cl.id;S.clientes[cid]=cl;persist('clientes',cid)}
  const v=makeVenda(cid,{itens:st.itens,jurosVenda:parsePct(D.jurosVenda),entrada:parseMoney(D.entrada),formaEntrada:D.formaEntrada,n:st.n,primeira:D.primeira,forma:D.forma,data:D.data,obs:D.obs});
  const old=D.editId?S.vendas[D.editId]:null;
  if(D.aguardando&&(!old||old.aguardando)){v.aguardando=true;v.parcelas.forEach(p=>{if(p.tipo==='entrada'){p.pago=false;p.pagoEm=null;p.forma=null}})}
  if(old){
    v.id=old.id;v.criadoEm=old.criadoEm;if(old.exemplo)v.exemplo=true;if(old.por)v.por=old.por;
    v.parcelas.forEach(p=>{if(p.tipo!=='parcela')return;const o=old.parcelas.find(q=>q.tipo==='parcela'&&q.n===p.n);if(o){p.contatoEm=o.contatoEm||null;if(o.pago){p.pago=true;p.pagoEm=o.pagoEm;p.forma=o.forma||null}}});
  }
  if(!old&&typeof SESSION!=='undefined'&&SESSION&&SESSION.user&&SESSION.user.email)v.por=String(SESSION.user.email).toLowerCase();
  S.vendas[v.id]=v;persist('vendas',v.id);
  premLog(old?'Venda editada':(v.aguardando?'Orçamento criado':'Venda criada'),((S.clientes[cid]||{}).nome||'')+' · '+brl(v.total));
  ui.draft=null;ui.sheet={kind:'venda',id:v.id};if(!old)ui.tab=v.aguardando?'aguard':'vendas';render();renderSheet();toast(v.aguardando?(old?'Orçamento atualizado':'Orçamento salvo em Aguardando pagamento'):(old?'Venda atualizada':'Venda registrada'));
}

  const t=todayStr(),ps=allP(),vs=vendasOk();
  const fim=m+'-'+pad(new Date(+m.slice(0,4),+m.slice(5,7),0).getDate());
  const rec=ps.filter(x=>x.p.pago&&x.p.pagoEm&&x.p.pagoEm.slice(0,7)===m).sort((a,b)=>a.p.pagoEm.localeCompare(b.p.pagoEm));

  const aRec=ps.filter(x=>!x.p.pago&&x.p.venc.slice(0,7)===m);

async function saveFile(name,data,okMsg){
  try{
    const ext=(name.split('.').pop()||'').toLowerCase();
    const type={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json'}[ext]||'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type:type});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast(okMsg);
  }catch(e){toast('Não foi possível gerar o arquivo')}
}

function restaurar(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(String(fr.result));let n=0;
      ['clientes','vendas','lentes'].forEach(col=>{Object.keys(o[col]||{}).forEach(id=>{const d=o[col][id];if(d&&typeof d==='object'){d.id=id;S[col][id]=d;persist(col,id);n++}})});
      ['otica','fin','metas','premium'].forEach(k=>{if(o.config&&o.config[k]){S.config[k]=Object.assign({},o.config[k],{id:k});persist('config',k);n++}});
      refresh();toast(n?plural(n,'registro restaurado','registros restaurados'):'Nada para restaurar neste arquivo');
    }catch(e){toast('Arquivo inválido. Use um backup baixado por este sistema.')}
  };
  fr.readAsText(file);
}

/* ----- ficha completa do cliente ----- */
const rxNum=s=>{const n=parseFloat(String(s||'').replace(',','.'));return isNaN(n)?null:n};
function rxChart(rx){
  const pts=['od','oe'].map(o=>rx.map((r,i)=>({i:i,v:rxNum(r[o]&&r[o].esf)})).filter(p=>p.v!==null));
  const all=pts[0].concat(pts[1]);if(rx.length<2||all.length<2)return '';
  const mn=Math.min.apply(null,all.map(p=>p.v)),mx=Math.max.apply(null,all.map(p=>p.v));const W=300,H=110,pad=18,span=(mx-mn)||1;
  const X=i=>pad+(rx.length>1?i*(W-2*pad)/(rx.length-1):0),Y=v=>H-pad-(v-mn)/span*(H-2*pad);
  const line=(a,col)=>a.length?'<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+a.map(p=>X(p.i)+','+Y(p.v)).join(' ')+'"/>'+a.map(p=>'<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>').join(''):'';
  return '<svg class="rxch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do grau esférico de cada olho ao longo das receitas"><text x="2" y="12" font-size="10" fill="var(--muted)">'+String(mx).replace('.',',')+'</text><text x="2" y="'+(H-4)+'" font-size="10" fill="var(--muted)">'+String(mn).replace('.',',')+'</text>'+line(pts[0],'var(--bar-a)')+line(pts[1],'var(--bar-b)')+'</svg><div class="key"><span><i style="background:var(--bar-a)"></i>Olho direito (OD)</span><span><i style="background:var(--bar-b)"></i>Olho esquerdo (OE)</span></div>';
}

function fotoComprime(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=800,s=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let q=.6,d=cv.toDataURL('image/jpeg',q);while(d.length>160000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}res(d)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* Pix copia-e-cola com valor (padrão BR Code do Banco Central) */
function pixCRC(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixLimpa(t,n){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').toUpperCase().trim().slice(0,n)}
function pixChave(k){k=String(k||'').trim();if(/@/.test(k))return k.toLowerCase();if(/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k))return k.toLowerCase();const d=k.replace(/\D/g,'');if(/^\+/.test(k))return '+'+d;if(/^\(?\d{2}\)?\s?9?\d{4}-?\d{4}$/.test(k)&&/[()\s-]/.test(k))return '+55'+d;if(d.length===11||d.length===14)return d;return k}
function pixCopia(chave,nome,cidade,centavos,txid){
  chave=pixChave(chave);if(!chave)return '';
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const mai=f('00','br.gov.bcb.pix')+f('01',chave);
  let p=f('00','01')+f('26',mai)+f('52','0000')+f('53','986');
  if(centavos>0)p+=f('54',(centavos/100).toFixed(2));
  p+=f('58','BR')+f('59',pixLimpa(nome,25)||'RECEBEDOR')+f('60',pixLimpa(cidade,15)||'RECIFE')+f('62',f('05',(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***'))+'6304';
  return p+pixCRC(p);
}

/* cria as mensalidades que ainda não existem: a 1ª vence 30 dias após o pagamento da implantação, depois uma por mês */
/* último dia do mês atual: mensalidades de meses futuros não aparecem */
function admFimMes(){const t=todayStr();return addDays(addMonths(t.slice(0,7)+'-01',1),-1)}
const admVisivel=c=>c.tipo!=='mensalidade'||c.pago||c.venc<=admFimMes();
function admBase(o){
  const impl=(ADM.cobAll||ADM.cob).find(c=>c.otica_id===o.id&&c.tipo==='implementacao');
  if(impl)return impl.pago?String(impl.pago_em||impl.venc).slice(0,10):null;
  return String(o.impl_data||o.criada_em||'').slice(0,10)||null;
}
async function admGerar(){
  const hoje=todayStr(),rows=[],fim=admFimMes();
  ADM.list.forEach(o=>{
    if(!o.ativa||!(+o.mensalidade>0))return;
    const base=admBase(o);if(!base)return;
    /* segue a última mensalidade existente, para respeitar datas editadas à mão */
    const ex=(ADM.cobAll||ADM.cob).filter(c=>c.otica_id===o.id&&c.tipo==='mensalidade'&&c.parcela).sort((x,y)=>x.parcela-y.parcela);
    const last=ex[ex.length-1];
    const ref=last?{n:last.parcela,venc:last.venc}:{n:1,venc:addDays(base,30)};
    for(let n=last?last.parcela+1:1;n<=240;n++){
      const venc=addMonths(ref.venc,n-ref.n);if(venc>fim)break;
      rows.push({otica_id:o.id,tipo:'mensalidade',parcela:n,venc:venc,valor:+o.mensalidade});
    }
  });
  if(!rows.length)return;
  const r=await sb.from('adm_cobrancas').upsert(rows,{onConflict:'otica_id,tipo,parcela',ignoreDuplicates:true});
  if(r.error)throw r.error;
  const c=await sb.from('adm_cobrancas').select('*');if(!c.error){ADM.cobAll=c.data||[];ADM.cob=ADM.cobAll.filter(admVisivel)}
}

const admOtica=id=>ADM.list.find(o=>o.id===id)||{nome:'Ótica removida'};

    '<div class="ms"><small>Em 12 meses</small><b>'+brl((mrr+pend)*12)+'</b><span>'+(pend?'contando '+plural(aguard.length,'ótica que vai começar','óticas que vão começar'):'se todas continuarem')+'</span></div>'+
    '<div class="ms"><small>Próximos 3 meses</small><b>'+brl(prox)+'</b><span>mensalidades previstas</span></div></div>';
}
/* funil de vendas, a partir do CRM */
function admFunil(){
  const L=ADM.leads||[];if(!L.length)return '<div class="sh"><h2>Funil de vendas</h2></div>'+none('Quando você começar a prospectar no CRM, o funil aparece aqui.');
  const resp=l=>['respondeu','interessada','fechou'].includes(l.status)||(l.historico||[]).some(h=>/Respondeu|Interessada/.test(h.txt||''));
  const ab=L.filter(l=>l.enviado_em),dm=ab.filter(l=>+l.demo_aberturas>0),rs=ab.filter(resp),fc=L.filter(l=>l.status==='fechou');
  const base=ab.length||1;
  const et=[['Na sua base',L.length,null],['Receberam a abordagem',ab.length,null],['Abriram o demo',dm.length,dm.length/base],['Responderam',rs.length,rs.length/base],['Fecharam',fc.length,fc.length/base]];
  const max=Math.max(1,L.length);
  return '<div class="sh"><h2>Funil de vendas</h2><span class="sub">'+(ab.length?'taxas sobre quem recebeu a abordagem':'')+'</span></div><div class="card funil">'+
    et.map((e,i)=>'<div class="fn-row"><span class="fn-l">'+e[0]+'</span><div class="fn-bar"><i style="width:'+Math.max(4,Math.round(e[1]/max*100))+'%"'+(i===4?' class="win"':'')+'></i></div><b class="num">'+e[1]+'</b><span class="fn-p num">'+(e[2]==null?'':Math.round(e[2]*100)+'%')+'</span></div>').join('')+
    (ab.length>=10?'<p class="sub" style="margin:4px 0 0">'+(dm.length/base<.3?'Poucas óticas abrem o demo: teste outra primeira frase da mensagem.':rs.length/base<.15?'Abrem o demo mas não respondem: mande o follow-up 2 ou 3 dias depois.':'Bom ritmo. Continue com o follow-up de quem abriu o demo.')+'</p>':'')+'</div>';
}

function admNovaDoCrm(){
  const q=new URLSearchParams(location.search);if(!q.get('nova')||!IS_ADMIN)return;

/* mensalidades de um mês: as reais + as previstas das óticas ativas */
function menDoMes(mk){
  const all=ADM.cobAll||ADM.cob,out=all.filter(c=>c.venc.slice(0,7)===mk);
  ADM.list.forEach(o=>{
    if(!o.ativa||!(+o.mensalidade>0))return;
    if(out.some(c=>c.otica_id===o.id&&c.tipo==='mensalidade'))return;
    const ex=all.filter(c=>c.otica_id===o.id&&c.tipo==='mensalidade'&&c.parcela).sort((x,y)=>x.parcela-y.parcela);
    let ref;
    if(ex.length){const l=ex[ex.length-1];ref={n:l.parcela,venc:l.venc}}
    else{const base=admBase(o);if(!base)return;ref={n:1,venc:addDays(base,30)}}
    if(mk<ref.venc.slice(0,7)||(ex.length&&mk===ref.venc.slice(0,7)))return;
    const k=(+mk.slice(0,4)-+ref.venc.slice(0,4))*12+(+mk.slice(5,7)-+ref.venc.slice(5,7));
    out.push({id:'prev-'+o.id+'-'+mk,otica_id:o.id,tipo:'mensalidade',parcela:ref.n+k,venc:addMonths(ref.venc,k),valor:+o.mensalidade,pago:false,prevista:true});
  });
  return out.sort((x,y)=>x.venc.localeCompare(y.venc)||admOtica(x.otica_id).nome.localeCompare(admOtica(y.otica_id).nome));
}

/* logo: lê o arquivo, gera a versão clara (original) e a branca (silhueta) */
function lerImagem(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>ok({im:im,u:u});im.onerror=()=>no(new Error('Não foi possível ler a imagem.'));im.src=u})}
function canvasBlob(cv){return new Promise(ok=>cv.toBlob(b=>ok(b),'image/png'))}
async function prepararLogo(file,branca){
  const r=await lerImagem(file);const im=r.im;const k=Math.min(1,900/im.naturalWidth);
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*k));cv.height=Math.max(1,Math.round(im.naturalHeight*k));
  const g=cv.getContext('2d');g.drawImage(im,0,0,cv.width,cv.height);
  const d=g.getImageData(0,0,cv.width,cv.height);let transp=false;
  for(let i=3;i<d.data.length;i+=4)if(d.data[i]<200){transp=true;break}
  if(!transp)throw new Error('A logo precisa ter fundo transparente (PNG).');
  const claro=await canvasBlob(cv);let escuro=null;
  if(branca){for(let i=0;i<d.data.length;i+=4){d.data[i]=255;d.data[i+1]=255;d.data[i+2]=255}g.putImageData(d,0,0);escuro=await canvasBlob(cv)}
  return {claro:claro,escuro:escuro,url:URL.createObjectURL(claro),urlW:escuro?URL.createObjectURL(escuro):''};
}
async function subirLogo(slug,nome,blob){

  if(r.error)throw r.error;
  return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
}

      if(D.bloqueio_ativo!==undefined){const av=Math.max(0,parseInt(D.aviso_dias,10)||0),bl=Math.max(av+1,parseInt(D.bloqueio_dias,10)||10);Object.assign(fin,{bloqueio_ativo:D.bloqueio_ativo===true||D.bloqueio_ativo==='1',aviso_dias:av,bloqueio_dias:bl})}
      const fr=await sb.from('oticas').update(fin).eq('id',id);if(fr.error)throw fr.error;
      const hoje=todayStr();
      const cb=await sb.from('adm_cobrancas').select('*').eq('otica_id',id);const cobs=(cb&&cb.data)||[];
      if(fin.impl_valor>0){const ex=cobs.find(c=>c.tipo==='implementacao');
        if(!ex){const ir=await sb.from('adm_cobrancas').insert({otica_id:id,tipo:'implementacao',venc:fin.impl_data||hoje,valor:fin.impl_valor});if(ir.error)throw ir.error}
        else if(!ex.pago){const ir=await sb.from('adm_cobrancas').update({valor:fin.impl_valor,venc:fin.impl_data||ex.venc}).eq('id',ex.id);if(ir.error)throw ir.error}}
      if(!novo&&fin.mensalidade>0){const ur=await sb.from('adm_cobrancas').update({valor:fin.mensalidade}).eq('otica_id',id).eq('tipo','mensalidade').eq('pago',false).gte('venc',hoje);if(ur.error)throw ur.error}
      ADM.saving=false;ADM.loaded=false;
      await admLoad(true);
      if(OTICA&&id===OTICA.id){const o=(ADM.list||[]).find(x=>x.id===id);if(o){Object.assign(OTICA,{nome:o.nome,cor1:o.cor1,cor2:o.cor2,logo_claro:o.logo_claro,logo_escuro:o.logo_escuro,dominios:o.dominios,ativa:o.ativa});await applyBrand(OTICA)}}
      if(novo){const o=(ADM.list||[]).find(x=>x.id===id)||{slug:D.slug,dominios:doms};ADM.cred={id:id,nome:D.nome.trim(),link:admLink(o),email:D.email.trim(),senha:D.senha,whats:D.whatsapp_dono.trim(),dono_nome:D.dono_nome.trim()};ui.sheet={kind:'admok',id:id};ADM.draft=null;renderSheet();render()}
      else{ADM.draft=null;closeSheet();render();toast('Ótica atualizada')}
    }catch(x){ADM.saving=false;D.err='Não foi possível salvar: '+errTxt(x);renderSheet()}
  },
  eqpw(d){EQ.pw=EQ.pw===d.u?'':d.u;render();if(ui.sheet&&ui.sheet.kind==='adm')renderSheet()},
  async eqpwsave(d){
    const el=document.getElementById('eq-pw-'+d.u);const nova=el?el.value:'';
    if(nova.length<6){toast('A senha precisa ter ao menos 6 caracteres');return}
    const r=await sb.rpc('equipe_senha',{p_otica:d.o,p_user:d.u,p_nova:nova});
    if(r.error){toast('Não foi possível trocar: '+errTxt(r.error));return}
    EQ.pw='';render();if(ui.sheet&&ui.sheet.kind==='adm')renderSheet();toast('Senha trocada');
  },
  async eqrm(d){
    if(EQ.confirm!==d.u){EQ.confirm=d.u;render();if(ui.sheet&&ui.sheet.kind==='adm')renderSheet();return}
    EQ.confirm='';const r=await sb.rpc('equipe_remover',{p_otica:d.o,p_user:d.u});
    if(r.error){toast('Não foi possível remover: '+errTxt(r.error));return}
    EQ.for='';await eqLoad(d.o);toast('Acesso removido');
  },
  async eqadd(d){
    const em=(eqF('email').value||'').trim(),se=eqF('senha').value||'',pa=eqF('papel').value;const err=m=>{const e=eqF('err');if(e)e.textContent=m};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return err('Digite um e-mail válido.');
    if(se.length<6)return err('A senha precisa ter ao menos 6 caracteres.');
    err('');const r=await sb.rpc('equipe_adicionar',{p_otica:d.o,p_email:em,p_senha:se,p_papel:pa});
    if(r.error)return err('Não foi possível adicionar: '+errTxt(r.error));
    EQ.for='';await eqLoad(d.o);toast('Usuário adicionado');
  }
});
/* ---------- ADMIN-FIM ---------- */

function markContact(d){
  if(d.contact==='p'){const v=S.vendas[d.v];if(v){v.parcelas[+d.pi].contatoEm=todayStr();persist('vendas',v.id)}}
  else if(d.contact==='ani'){const c=S.clientes[d.c];if(c){c.aniEm=todayStr().slice(0,4);persist('clientes',c.id)}}
  else if(d.contact==='rev'){const c=S.clientes[d.c];if(c){c.revEm=todayStr();persist('clientes',c.id)}}
  else if(d.contact==='bv'){const c=S.clientes[d.c];if(c){c.bvEm=todayStr();persist('clientes',c.id)}}
  setTimeout(refresh,80);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-contact]');if(a){markContact(a.dataset);return}
  const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b.dataset,b,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-gate]');if(!f)return;e.preventDefault();
  doLogin(f);
});
function onField(e){
  const t=e.target;if(!(t instanceof HTMLElement))return;const ch=e.type==='change';
  if(t.id==='restore-file'){if(ch&&t.files&&t.files[0]){restaurar(t.files[0]);t.value=''}return}
  if(t.dataset.mask==='cpf'){t.value=maskCpf(t.value);const h=t.parentElement.querySelector('.hint');if(h){const d=digits(t.value);h.textContent=d.length===11&&!validCpf(t.value)?'CPF parece inválido. Confira os números.':'';h.classList.toggle('bad',!!h.textContent)}}
  if(t.dataset.mask==='tel')t.value=maskTel(t.value);
  if(t.dataset.bind&&ui.draft){
    setPath(ui.draft,t.dataset.bind,t.value);
    if(t.dataset.bind==='clienteId'){const nc=$('#novo-cli');if(nc)nc.hidden=ui.draft.clienteId!=='__novo'}
    updateVenda();
  }
  if(t.dataset.aguard!==undefined&&ui.draft){ui.draft.aguardando=t.checked;updateVenda()}
  if(t.dataset.cbind&&ui.cdraft)setPath(ui.cdraft,t.dataset.cbind,t.value);
  if(t.dataset.item!==undefined&&ui.draft){ui.draft.itens[+t.dataset.item][t.dataset.f]=t.value;updateVenda()}
  if(ch&&t.dataset.lente!==undefined&&ui.draft){const it=ui.draft.itens[+t.dataset.lente];const l=S.lentes[t.value];it.lenteId=l?l.id:'';it.nome=l?l.nome:'';it.valor=l?centsToStr(l.valor):'';renderItems();updateVenda()}
  if(t.id==='q-v'){ui.vQuery=t.value;$('#vlist').innerHTML=vendasList()}
  if(t.id==='q-c'){ui.cQuery=t.value;$('#clist').innerHTML=clientesList()}
  if(t.id==='q-l'){ui.lQuery=t.value;$('#llist').innerHTML=lentesList()}
  if(ch&&t.dataset.rel){ui.rmes=t.value;renderSheet()}
  if(ch&&t.dataset.cx){ui[t.dataset.cx]=t.value;render()}
  if(ch&&t.dataset.cfg){const c=Object.assign({id:'otica'},S.config.otica||{});c[t.dataset.cfg]=t.dataset.cfg==='autolock'?+t.value:t.value.trim();S.config.otica=c;persist('config','otica');toast('Salvo')}
  if(ch&&t.dataset.tpl){const c=Object.assign({id:'otica'},S.config.otica||{});c.tpl=Object.assign({},c.tpl);c.tpl[t.dataset.tpl]=t.value;S.config.otica=c;persist('config','otica');toast('Mensagem salva')}
  if(ch&&t.dataset.lid){const l=S.lentes[t.dataset.lid];if(l){if(t.dataset.lf==='nome'){if(t.value.trim())l.nome=t.value.trim()}else if(t.dataset.lf==='tipo'){l.tipo=t.value.trim()}else{const v=parseMoney(t.value);if(v>0)l.valor=v}persist('lentes',l.id);refresh()}}
  if(ch&&t.dataset.vencv){const v=S.vendas[t.dataset.vencv];if(v&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){v.parcelas[+t.dataset.vencp].venc=t.value;persist('vendas',v.id);refresh();toast('Vencimento alterado')}}
  if(ch&&t.dataset.formav){const v=S.vendas[t.dataset.formav];if(v){v.parcelas[+t.dataset.formap].forma=t.value;persist('vendas',v.id);refresh();toast('Forma de recebimento alterada')}}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

/* ---------- início ---------- */
(async function init(){
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(ADM_MODE){
    PRE={nome:'Adm Óticas',cor1:'#475569',cor2:'#1B222C'};await applyBrand(PRE);
    const ml=document.querySelector('link[rel=manifest]');if(ml)ml.href='/adm.webmanifest';
    const al=document.querySelector('link[rel=apple-touch-icon]');if(al)al.href='/icons/adm-apple-touch-icon.png';
    const at=document.querySelector('meta[name=apple-mobile-web-app-title]');if(at)at.content='Adm Óticas';
  }else try{
    const slug=tenantSlug();
    if(slug){const m=await sb.rpc('marca',{p:slug});if(m.data&&m.data.length){PRE=m.data[0];await applyBrand(PRE)}}
  }catch(e){}
  try{
    const r=await sb.auth.getSession();
    if(r.data&&r.data.session){authChecked=true;auth='loading';render();await entrar(r.data.session);return}
  }catch(e){}
  authChecked=true;render();
})();
</script>
