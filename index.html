<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* o iPhone lê estes dados ao salvar na tela de início: o /adm precisa do seu próprio ícone, nome e endereço */
(function(){var a=/^\/adm(\/|$)/.test(location.pathname);
document.write('<meta name="theme-color" content="'+(a?'#1F2A3C':'#00348A')+'">'+
'<link rel="manifest" href="'+(a?'/adm.webmanifest':'/manifest.webmanifest')+'">'+
'<link rel="apple-touch-icon" href="'+(a?'/icons/adm-apple-touch-icon.png':'/icons/apple-touch-icon.png')+'">'+
'<meta name="apple-mobile-web-app-title" content="'+(a?'Adm Óticas':'Gestão')+'">'+
'<title>'+(a?'Adm Óticas':'Gestão da ótica')+'</title>')})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Identidade: azul escuro e azul claro da logo, com branco. Layout: sistema de balcão. Desktop: menu lateral fixo + área de trabalho em duas colunas. Celular: cabeçalho fino, 4 abas + "Mais" na base. Porta de entrada com login. */
:root{
  --bg:#EDF3FB; --surface:#FFFFFF; --surface-2:#E2EBF8; --fg:#0A1D3C; --muted:#53698C; --line:#D0DCEE;
  --accent:#0B4FB0; --accent-fg:#FFFFFF; --accent-soft:#DCEAFC; --brand-1:#0486DE; --brand-2:#00348A;
  --ok:#17703F; --ok-bg:#DCF0E3; --warn:#8F5A00; --warn-bg:#F7EACA; --bad:#B3261E; --bad-bg:#F8DDDA;
  --bad-solid:#B3261E; --wa:#1F8A4C; --wa-fg:#FFFFFF; --bar-a:#0B4FB0; --bar-b:#4AB0F5;
  --shadow:0 1px 2px rgba(5,30,80,.07),0 10px 28px rgba(5,30,80,.14);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06142C; --surface:#0D2347; --surface-2:#153060; --fg:#E7EFFC; --muted:#9BB0D3; --line:#21427A;
    --accent:#5AB4F7; --accent-fg:#03173A; --accent-soft:#12305F;
    --ok:#5FCB90; --ok-bg:#113222; --warn:#E8B04A; --warn-bg:#382C0F; --bad:#F2877F; --bad-bg:#3B1815;
    --bad-solid:#D8453D; --wa:#3DBE78; --wa-fg:#04210F; --bar-a:#2F7FE0; --bar-b:#6CC4FA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06142C; --surface:#0D2347; --surface-2:#153060; --fg:#E7EFFC; --muted:#9BB0D3; --line:#21427A;
  --accent:#5AB4F7; --accent-fg:#03173A; --accent-soft:#12305F;
  --ok:#5FCB90; --ok-bg:#113222; --warn:#E8B04A; --warn-bg:#382C0F; --bad:#F2877F; --bad-bg:#3B1815;
  --bad-solid:#D8453D; --wa:#3DBE78; --wa-fg:#04210F; --bar-a:#2F7FE0; --bar-b:#6CC4FA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
#fatal{position:fixed;left:0;right:0;top:0;z-index:999;background:#B3261E;color:#fff;padding:10px 16px;font:14px/1.4 sans-serif;display:none}
*{box-sizing:border-box}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* estrutura */
.shell{display:block}
.side{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100% - 980px)/2));background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff}
.menubtn{position:relative;flex:none;width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.menubtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.menubtn .badge{top:-5px;left:auto;right:-5px}
.side .brand{margin-right:auto}
.drawer{left:0;right:auto;top:0;bottom:0;max-height:none;width:min(300px,86vw);border-radius:0 18px 18px 0;transform:none}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
.brand .logo{height:36px;width:auto;display:block}
.brand-sub{display:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);font-weight:600}
.side-foot{display:flex;align-items:center;gap:10px}
.who{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);display:none;overflow-wrap:anywhere}
.sync{font-size:12px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
.sync.cloud i{background:#7CF0A8} .sync.local i{background:#FFD27A}
.side .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.42);color:#fff}
.content{max-width:980px;margin-inline:auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);font-weight:600}
.tab[aria-current=page]::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-solid);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center}
@media (min-width:900px){
  .menubtn{display:none}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:24px;padding:28px 14px}
  .side .brand{margin-right:0}
  .brand .logo{height:auto;width:100%;max-width:196px;margin-inline:6px}
  .brand-sub{display:block;margin-left:6px}
  .tabs{position:static;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0}
  .tab{flex-direction:row;gap:12px;padding:11px 12px;border-radius:10px;font-size:14.5px;justify-content:flex-start;text-align:left;color:rgba(255,255,255,.86)}
  .tab[aria-current=page]{background:rgba(255,255,255,.2);color:#fff}
  .tab[aria-current=page]::before{display:none}
  .badge{position:static;margin-left:auto}
  .side-foot{margin-top:auto;flex-direction:column;align-items:stretch;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.28)}
  .who{display:block}
  .content{margin-inline:0;max-width:1240px;padding:30px 40px 56px}
}

/* texto e blocos */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:25px}
.ph .acts.ph-r{margin-left:auto;justify-content:flex-end;flex-wrap:nowrap}
@media (min-width:900px){.ph h1{font-size:30px}}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.sh h2{font-size:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.gridlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
@media (min-width:900px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.cols.agenda{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.panel{min-width:0}

/* botões e chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad-solid);color:#fff;border-color:var(--bad-solid)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;margin:-4px 0;font-weight:600;font-size:15px;color:var(--fg);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.demo{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;text-align:left;display:block;width:100%}
button.tile:hover{border-color:var(--accent)}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--f-display);font-size:23px;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{display:block;font-size:12.5px;color:var(--muted)}
.tile .t2{margin-top:1px}
.tiles4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:759px){.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}}
.tile.t-ok b{color:var(--ok)} .tile.t-bad b{color:var(--bad)} .tile.t-acc b{color:var(--accent)}
.tile.hero{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));border-color:transparent}
.tile.hero small,.tile.hero span{color:#fff;opacity:.88} .tile.hero b{color:#fff}

/* calendário */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.calhead h2{font-size:19px;flex:1;min-width:0}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding-block:4px;letter-spacing:.06em}
.day{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;min-width:0}
@media (min-width:900px){.day{min-height:64px}.day .a{font-size:11.5px}}
.day.out{border-color:transparent;background:transparent}
.day .n{font-size:13px;font-weight:600}
.day .a{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;min-height:13px}
.day.late{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.day.open{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.day.paid{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:9px;min-width:22px;text-align:center;padding:0 4px}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day .a.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;font-weight:600}
.day.prev{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.msum .ms{padding:12px 14px;min-width:0;border-left:1px solid var(--line)}
.msum .ms:first-child{border-left:0}
.msum small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.msum b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msum span{font-size:12px;color:var(--muted)}
.msum .ok b{color:var(--ok)}.msum .bad b{color:var(--bad)}
@media (max-width:520px){.msum .ms{padding:10px 8px;text-align:center}.msum b{font-size:16px}.msum small,.msum span{font-size:11px}}
.legend+.sh,.panel .legend{margin-bottom:6px}
.menlist .row{flex-direction:column;gap:8px}
.menlist .row-side{width:100%;display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.menlist .row-side .acts{justify-content:flex-start}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

/* linhas e cartões */
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.row-main{min-width:0;display:flex;flex-direction:column;gap:5px;flex:1}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.row .amt{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mini{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.mini input,.mini select{min-height:34px;padding:0 8px;width:auto;font-size:14px}
@media (max-width:460px){.row{flex-direction:column}.row-side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%;row-gap:8px}.row-side .amt{flex:none}.row-side .acts{margin-left:auto}.row-side .acts:has(>:nth-child(3)){flex:1 1 100%}.row-side .acts:has(>:nth-child(3)) .btn{flex:1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card{text-align:left;width:100%}
button.card:hover{border-color:var(--accent)}
.sale-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sale-top b{font-size:16px;overflow-wrap:anywhere}
.sale-bot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar.acc i{background:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted)}
.fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.brk{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:56px;height:56px;color:var(--accent);opacity:.8}
.empty h3{font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* gráfico de meses */
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mbars{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:5px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,var(--line) 0,var(--line) 1px,transparent 1px,transparent 50%)}
.mb{width:38%;max-width:26px;border-radius:4px 4px 0 0;min-height:0}
.mb.a{background:var(--bar-a)} .mb.b{background:var(--bar-b)}
.mlabel{font-size:12px;font-weight:600;text-transform:capitalize}
.mval{font-size:11px;font-variant-numeric:tabular-nums;line-height:1.25;text-align:center;min-height:2.5em}
.mval .vz{display:block;color:var(--muted);font-size:10.5px;padding-top:2px}
.mval .vz::before{display:none}
.mval div{display:flex;align-items:center;justify-content:center;gap:4px}
.mval .va::before,.mval .vb::before{content:'';width:7px;height:7px;border-radius:2px;flex:none}
.mval .va::before{background:var(--bar-a)} .mval .vb::before{background:var(--bar-b)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* formulários */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{padding:10px 12px;min-height:96px;line-height:1.4;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.hint.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:8px}
.aguard-box{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.aguard-box input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent,#3D8BFD)}
.aguard-box b{display:block}.aguard-box small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.lk{display:inline-flex;align-items:center;margin-left:6px;opacity:.75;vertical-align:middle}
.pl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.modrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.modrow input{width:18px;height:18px;flex:none;accent-color:var(--accent,#3D8BFD)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fotos figcaption{font-size:11.5px;color:var(--muted)}
.rxch{width:100%;height:auto;max-height:160px}
.rxt{width:100%;border-collapse:collapse;font-size:13px}.rxt th,.rxt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;place-items:center;min-height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-bot{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.item-bot b{color:var(--fg);font-variant-numeric:tabular-nums}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum-row{display:flex;justify-content:space-between;gap:10px}
.sum-row.big{font-family:var(--f-display);font-size:20px;font-weight:700;padding-block:4px;border-block:1px solid var(--line)}
.sum-row.hl{color:var(--accent);font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:15px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
summary{font-weight:600;cursor:pointer;min-height:28px}
details[open] summary{margin-bottom:10px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;gap:12px;min-height:50px;font-size:15px;position:relative}
.menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu .badge{position:static;margin-left:auto}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,20,24,.52);z-index:40}
.dlg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.dlc{display:flex;flex-direction:column;align-items:stretch;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;text-align:left;font:inherit;color:var(--fg);cursor:pointer}
.dlc img{display:block;width:100%;aspect-ratio:16/11;object-fit:cover;background:var(--surface-2)}
.dlc span{padding:12px 14px;font-weight:700;font-size:15px}
.dlc:active{transform:scale(.985)}
.dl{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#070C18;color:#fff;font-family:var(--f-body);user-select:none;-webkit-user-select:none}
.dl-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.dl-x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.dl-ti{min-width:0;flex:1;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.dl-sw{display:flex;gap:6px;padding:0 14px 10px}
.dl-sw button{flex:1;min-height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:background .15s,color .15s}
.dl-sw button.on{background:#fff;color:#0A1D3C}
.dl-sw button.on.com{background:#4AB0F5;color:#03173A}
.dl-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.dl-cmp{position:relative;width:min(100%,calc((100vh - 250px)*var(--ar)));width:min(100%,calc((100dvh - 250px)*var(--ar)));aspect-ratio:var(--ar);overflow:hidden;touch-action:none;cursor:ew-resize;background:#0d1426;--p:50%}
.dl-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.dl-cmp .dl-top-img{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.dl-bar{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.dl-grip{position:absolute;top:50%;left:var(--p);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#0A1D3C;box-shadow:0 2px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;pointer-events:none}
.dl-nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.dl-nav::-webkit-scrollbar{display:none}
.dl-nav button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.dl-nav button.on{background:#fff;color:#0A1D3C;border-color:#fff}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:94%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
.sheet-body{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.foot-row{display:flex;gap:8px;flex-wrap:wrap}
.foot-row .btn{flex:1}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:90vh;border-radius:18px}
}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* tela de entrada */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--brand-1),var(--brand-2));display:none;overflow:auto;padding:24px 16px;place-items:center}
.gate.on{display:grid}
.gate-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--shadow)}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gate-brand .logo{width:min(250px,82%);height:auto}
.lg-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-b{display:none}:root:not([data-theme="light"]) .lg-w{display:block}}
:root[data-theme="dark"] .lg-b{display:none}
:root[data-theme="dark"] .lg-w{display:block}
.gate-card h2{font-size:19px}
.sheet.drawer{left:0;right:auto;top:0;bottom:0;transform:none;width:min(300px,86vw);max-height:none;border-radius:0 18px 18px 0}
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid;border-radius:14px;padding:14px 16px;margin-bottom:12px;font:inherit;cursor:pointer}
.alert svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert b{display:block;font-size:15.5px}.alert span{font-size:13.5px;opacity:.9}
.alert.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
/* Acabamento: sóbrio, financeiro, premium */
:root{--f-display:'Newsreader',Georgia,'Times New Roman',serif;--side-a:color-mix(in srgb,var(--brand-2) 80%,#000);--side-b:color-mix(in srgb,var(--brand-2) 46%,#000);--tabline:color-mix(in srgb,var(--brand-1) 55%,#fff)}
h1,h2,h3{font-weight:500;letter-spacing:-.015em}
.ph h1{font-size:30px}
.sh h2{font-size:21px}
.side{background:linear-gradient(135deg,var(--side-a),var(--side-b))}
.btn{border-radius:8px;min-height:40px}
.btn.sm{min-height:34px}
.chip{border-radius:6px;font-size:11.5px}
.row,.card,.tile{border-radius:10px}
.tile small{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.tile b{font-weight:500;font-size:26px;font-variant-numeric:lining-nums tabular-nums}
.row .amt{font-weight:600;font-variant-numeric:lining-nums tabular-nums}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{border-radius:8px}
.sheet-head h2{font-weight:500}
.alert{border-radius:10px;border-left-width:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 16px 14px;border:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px;width:100%;color:var(--fg)}
.kpi.lead{grid-column:1/-1;box-shadow:inset 0 3px 0 var(--accent)}
.kpi small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.kpi.lead b{font-size:34px;color:var(--accent)}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.neg b{color:var(--bad)}
.kpi.total{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
button.kpi{cursor:pointer}
button.kpi:hover{background:var(--surface-2)}
@media (min-width:900px){
  .ph h1{font-size:38px}
  .side{background:linear-gradient(180deg,var(--side-a),var(--side-b))}
  .tab{border-radius:8px;padding:10px 14px;font-weight:500;color:rgba(255,255,255,.74)}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff}
  .tab[aria-current=page]{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--tabline)}
}
@media (min-width:1180px){
  .kpis{grid-template-columns:1.3fr repeat(4,minmax(0,1fr))}
  .kpi{padding:20px 20px 18px}
  .kpi.lead{grid-column:auto}
  .kpi b{font-size:28px}
  .kpi.lead b{font-size:34px}
}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer;min-height:52px}
.acc-h:hover{border-color:var(--accent)}
.acc-t{font-weight:600;flex:1}
.acc-i{color:var(--muted);font-size:13px;font-variant-numeric:lining-nums tabular-nums}
.acc-h svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none;color:var(--muted)}
.acc-h[aria-expanded=true] svg{transform:rotate(180deg)}
.acc-b{margin-top:10px;display:flex;flex-direction:column;gap:16px}
.mes-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.mes-h b{font-family:var(--f-display);font-size:17px;font-weight:500}
.mes-h span{color:var(--muted);font-variant-numeric:lining-nums tabular-nums}

/* v9: relacionamento, receitas, admin */
.alert.info{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rx{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.rx-grid{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:6px 8px;align-items:center}
.rx-grid>b{font-size:11.5px;color:var(--muted);font-weight:600}
.rx-eye{font-weight:700;font-size:13px;color:var(--accent)}
.rx-grid input{min-width:0;padding-inline:8px;text-align:center}
.adm-top{display:flex;align-items:center;gap:12px}
.adm-logo{width:64px;height:44px;border-radius:8px;display:grid;place-items:center;flex:none;overflow:hidden;color:#fff;font-weight:700}
.adm-logo img{max-width:88%;max-height:70%;object-fit:contain}
.team{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .who2{min-width:0;overflow-wrap:anywhere}
.logo-prev{display:flex;align-items:center;gap:10px}
.logo-prev .adm-logo{width:96px;height:56px}
input[type=color]{padding:2px;height:42px;width:100%;cursor:pointer}
.brand-adm{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;color:#fff;display:flex;flex-direction:column;gap:4px}
.brand-adm small{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
@media (max-width:899px){.brand-adm{font-size:22px}.brand-adm small{display:none}}

/* sino e lembrete */
.bellbtn{position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;height:42px;min-width:42px;padding:0 9px;border-radius:10px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font:inherit;font-weight:500}
.bellbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 10%}
.bellbtn .bl{display:none}
.bellbtn .badge{top:-6px;left:auto;right:-6px;background:#fff;color:#B3261E;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.bellbtn.bad{background:#C62828;border-color:transparent}
.bellbtn.warn{background:#B77900;border-color:transparent}
.bellbtn.ring svg{animation:ring 2.2s ease-in-out infinite}
@keyframes ring{0%,40%,100%{transform:rotate(0)}4%{transform:rotate(18deg)}8%{transform:rotate(-16deg)}12%{transform:rotate(13deg)}16%{transform:rotate(-11deg)}20%{transform:rotate(8deg)}24%{transform:rotate(-5deg)}28%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.bellbtn.ring svg{animation:none}}
@media (min-width:900px){.bellbtn{width:100%;justify-content:flex-start;height:46px;padding:0 14px}.bellbtn .bl{display:inline}.bellbtn .badge{top:50%;right:12px;transform:translateY(-50%)}}
#popup{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);z-index:95;width:min(460px,calc(100% - 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#popup.on{transform:translate(-50%,0)}
.pop{display:flex;align-items:stretch;background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-left-width:5px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.pop-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:12px 6px 12px 14px}
.pop-main svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop-main b{display:block;font-size:15.5px}.pop-main small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pop-x{flex:none;width:44px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#popup{transition:none}}
#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
/* agenda: indicadores em uma faixa só */
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .kpi{padding:12px 12px 11px;gap:3px}
.kpis.k3 .kpi small{font-size:12px}
.kpis.k3 .kpi b{font-size:17px;white-space:nowrap}
.kpis.k3 .kpi span{font-size:11.5px}
.kpi b.c-acc{color:var(--accent)}.kpi b.c-ok{color:var(--ok)}
@media (min-width:600px){.kpis.k3 .kpi{padding:16px 18px 14px}.kpis.k3 .kpi small{font-size:13px}.kpis.k3 .kpi b{font-size:26px}.kpis.k3 .kpi span{font-size:12.5px}}
.hintbtn{display:block;width:100%;text-align:left;background:var(--warn-bg);color:var(--warn);border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

/* ===== Tema Adm (painel de dados, igual ao CRM): canvas frio, menu grafite e destaque dourado. Só vale no /adm ===== */
:root.adm.adm{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --fg:#1A2333; --muted:#5E6B80; --line:#DCE2EC;
  --accent:#3B6FD9; --accent-fg:#FFFFFF; --accent-soft:#E6EDFB; --brand-1:#1F2A3C; --brand-2:#1F2A3C;
  --lime:#F2C811; --lime-fg:#3A3000; --ink:#1A2333; --edge:#C9D2E0; --drop:0 1px 2px rgba(26,35,51,.06);
  --ok:#1E7B4F; --ok-bg:#E2F3EA; --warn:#8A5F00; --warn-bg:#FBF0CF; --bad:#B4362A; --bad-bg:#FBE5E2; --bad-solid:#B4362A;
  --wa:#1E7B4F; --wa-fg:#FFFFFF; --nav:#1F2A3C; --nav-fg:#C4CDDB;
  --f-display:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --side-a:#1F2A3C; --side-b:#1F2A3C; --tabline:#F2C811;
  --shadow:0 1px 2px rgba(26,35,51,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root.adm.adm:not([data-theme="light"]){
    --bg:#121925; --surface:#1A2333; --surface-2:#202B3D; --fg:#E4E9F1; --muted:#97A3B6; --line:#2B374B;
    --accent:#6D97EE; --accent-fg:#0E141F; --accent-soft:#22324F; --edge:#3A475D; --drop:none; --nav:#0E141F;
    --ok:#5CC492; --ok-bg:#16362A; --warn:#E8C25A; --warn-bg:#3A3014; --bad:#F08A7C; --bad-bg:#3D1F1B; --bad-solid:#D9584A;
    --wa:#2E9A63; --wa-fg:#FFFFFF; --shadow:none; color-scheme:dark;
  }
}
:root.adm.adm[data-theme="dark"]{
  --bg:#121925; --surface:#1A2333; --surface-2:#202B3D; --fg:#E4E9F1; --muted:#97A3B6; --line:#2B374B;
  --accent:#6D97EE; --accent-fg:#0E141F; --accent-soft:#22324F; --edge:#3A475D; --drop:none; --nav:#0E141F;
  --ok:#5CC492; --ok-bg:#16362A; --warn:#E8C25A; --warn-bg:#3A3014; --bad:#F08A7C; --bad-bg:#3D1F1B; --bad-solid:#D9584A;
  --wa:#2E9A63; --wa-fg:#FFFFFF; --shadow:none; color-scheme:dark;
}
html.adm body{font-family:var(--f-body);font-size:14.5px;font-feature-settings:"tnum" 1}
html.adm h1,html.adm h2,html.adm h3{font-family:var(--f-body);font-weight:600;letter-spacing:-.01em}

/* títulos: sóbrios, como num relatório */
html.adm .ph h1{font-size:24px}
html.adm .sh h2,html.adm .calhead h2{font-size:15px;font-weight:600}
html.adm .ph .sub{color:var(--muted)}
@media (min-width:900px){html.adm .ph h1{font-size:26px}}

/* menu: grafite, item ativo com filete dourado */
html.adm .side{background:var(--nav)}
html.adm .tabs{background:var(--nav);border-top:0}
html.adm .tab{color:var(--nav-fg)}
html.adm .tab[aria-current=page]{color:#fff}
html.adm .tab[aria-current=page]::before{background:var(--lime)}
@media (min-width:900px){
  html.adm .side{background:var(--nav)}
  html.adm .tab{color:var(--nav-fg);border-radius:4px;border-left:3px solid transparent}
  html.adm .tab:hover{background:rgba(255,255,255,.06);color:#fff}
  html.adm .tab[aria-current=page]{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;font-weight:600;border-left-color:var(--lime)}
  html.adm .tab[aria-current=page]::before{display:none}
  html.adm .tabs{background:none;border:0}
}
html.adm .brand-adm{font-family:var(--f-body);font-weight:600}
html.adm .bellbtn{border-radius:4px}

/* confete ao receber um pagamento */
function confete(x,y){
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    const old=document.getElementById('confete');if(old)old.remove();
    const cv=document.createElement('canvas');cv.id='confete';const W=cv.width=innerWidth,H=cv.height=innerHeight;document.body.appendChild(cv);
    const g=cv.getContext('2d');const cores=['#2FBF71','#F5B700','#3D8BFD','#FF5D8F','#9B6BFF','#FF8A3D','#FFFFFF'];
    if(x==null){x=W/2;y=H*0.4}
    const P=[];for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.5,c:cores[i%cores.length],life:0})}
    const t0=performance.now();
    (function frame(t){
      const dt=t-t0;g.clearRect(0,0,W,H);
      P.forEach(p=>{p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;const al=Math.max(0,1-dt/2100);g.save();g.globalAlpha=al;g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
      if(dt<2100)requestAnimationFrame(frame);else cv.remove();
    })(t0);
  }catch(e){}
}
function confeteDe(b){let x=null,y=null;if(b&&b.getBoundingClientRect){const r=b.getBoundingClientRect();if(r.width){x=r.left+r.width/2;y=r.top+r.height/2}}confete(x,y)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act="dlopen"]');if(b){e.preventDefault();dlOpen(b.dataset.k)}});
let DLEL=null;
function dlClose(){
  if(!DLEL)return;document.removeEventListener('keydown',DLEL._key);DLEL.remove();DLEL=null;document.body.style.overflow=DLEL_OV||'';
}
let DLEL_OV='';
function dlOpen(k){
  const d=DL.find(x=>x.k===k)||DL[0];
  DL.forEach(x=>{[0,1].forEach(i=>{const im=new Image();im.src='/lentes/'+x.k+'-'+(i?'com':'sem')+'.jpg'})});
  if(!DLEL){
    DLEL_OV=document.body.style.overflow;document.body.style.overflow='hidden';
    const el=document.createElement('div');el.className='dl';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
    el.innerHTML='<div class="dl-top"><button type="button" class="dl-x" aria-label="Fechar">&#215;</button><div class="dl-ti"></div></div>'+
      '<div class="dl-sw"><button type="button" data-i="0"></button><button type="button" data-i="1" class="com"></button></div>'+
      '<div class="dl-stage"><div class="dl-cmp" aria-label="Deslize para comparar sem e com tratamento"><img class="dl-com" alt="" draggable="false"><img class="dl-top-img dl-sem" alt="" draggable="false"><div class="dl-bar"></div><div class="dl-grip">&#8249;&#8250;</div></div></div>'+
      '<div class="dl-nav"></div>';
    document.body.appendChild(el);DLEL=el;
    const cmp=el.querySelector('.dl-cmp'),sw=el.querySelectorAll('.dl-sw button');
    DLST.forEach((t,i)=>sw[i].textContent=t);
    // p = quanto da imagem (da esquerda) mostra SEM tratamento; o resto mostra COM
    let p=50,raf=0,anim=0;
    const draw=()=>{raf=0;cmp.style.setProperty('--p',p+'%');sw[0].classList.toggle('on',p>=50);sw[1].classList.toggle('on',p<50)};
    const set=v=>{p=Math.max(0,Math.min(100,v));if(!raf)raf=requestAnimationFrame(draw)};
    const mover=x=>{const r=cmp.getBoundingClientRect();set((x-r.left)/r.width*100)};
    const ir=to=>{cancelAnimationFrame(anim);const from=p,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/260),e=1-Math.pow(1-k,3);set(from+(to-from)*e);if(k<1)anim=requestAnimationFrame(f)};anim=requestAnimationFrame(f)};
    el._set=set;el._ir=ir;el._reset=()=>{cancelAnimationFrame(anim);p=50;draw()};
    cmp.addEventListener('pointerdown',e=>{if(e.button)return;cancelAnimationFrame(anim);cmp.setPointerCapture(e.pointerId);cmp._on=true;mover(e.clientX)});
    cmp.addEventListener('pointermove',e=>{if(cmp._on)mover(e.clientX)});
    const fim=()=>{cmp._on=false};cmp.addEventListener('pointerup',fim);cmp.addEventListener('pointercancel',fim);
    sw[0].addEventListener('click',()=>ir(100));sw[1].addEventListener('click',()=>ir(0));
    el.querySelector('.dl-x').addEventListener('click',dlClose);
    el._key=e=>{if(e.key==='Escape')dlClose();else if(e.key==='ArrowRight')ir(Math.min(100,p+25));else if(e.key==='ArrowLeft')ir(Math.max(0,p-25))};
    document.addEventListener('keydown',el._key);
    el.querySelector('.dl-nav').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)dlOpen(b.dataset.k)});
    draw();
  }
  const el=DLEL,cmp=el.querySelector('.dl-cmp');
  el.querySelector('.dl-ti').textContent=d.n;
  cmp.style.setProperty('--ar',(1044/d.h).toFixed(4));
  const sem=el.querySelector('.dl-sem'),com=el.querySelector('.dl-com');
  sem.src='/lentes/'+d.k+'-sem.jpg';com.src='/lentes/'+d.k+'-com.jpg';
  sem.alt=d.n+' – '+DLST[0];com.alt=d.n+' – '+DLST[1];
  el.querySelector('.dl-nav').innerHTML=DL.map(x=>'<button type="button" data-k="'+x.k+'"'+(x.k===d.k?' class="on"':'')+'>'+x.n+'</button>').join('');
  el._reset();
}

function renderSheet(){
  const el=$('#layer');const s=ui.sheet;
  if(!s){el.innerHTML='';el.dataset.key='';document.documentElement.classList.remove('lock');return}
  const key=s.kind+(s.id||'');const old=el.querySelector('.sheet-body');const top=(old&&el.dataset.key===key)?old.scrollTop:0;
  let html=null;
  if(s.kind==='venda')html=sheetVenda(s.id);else if(s.kind==='os')html=sheetOS(s.id);else if(s.kind==='fup')html=sheetFup();else if(s.kind==='nova')html=sheetNova();else if(s.kind==='cliente')html=sheetCliente(s.id);else if(s.kind==='cliente-ok')html=sheetClienteOk(s.id);else if(s.kind==='mais')html=sheetMais();else if(s.kind==='hist')html=sheetHist();else if(s.kind==='recibo')html=sheetRecibo(s);else if(s.kind==='pagorc')html=sheetPagOrc(s);else if(s.kind==='pagparc')html=sheetPagParc(s);else if(s.kind==='vendedor')html=sheetVend();else if(s.kind==='finpag')html=sheetFinPag(s);else if(s.kind==='relatorio')html=sheetRelatorio();else if(s.kind==='adm')html=sheetAdm();else if(s.kind==='admok')html=sheetAdmOk();
  if(html===null){ui.sheet=null;renderSheet();return}
  document.documentElement.classList.add('lock');
  el.innerHTML=html;
  const nb=el.querySelector('.sheet-body');if(nb&&top)nb.scrollTop=top;
  if(s.kind==='nova'){renderItems();updateVenda()}
  if(el.dataset.key!==key){const sh=el.querySelector('.sheet');if(sh)sh.focus({preventScroll:true})}
  el.dataset.key=key;
}

function pgToggle(){const av=isAvista(ui.draft);document.querySelectorAll('[data-pgparc]').forEach(el=>el.hidden=av);document.querySelectorAll('[data-pgav]').forEach(el=>el.hidden=!av)}
function draftState(){
  const D=ui.draft;const errs=[],targets=[];const E=(m,sel)=>{errs.push(m);targets.push(sel||'')};
  if(D.clienteId==='__novo'){if(!D.novo.nome.trim())E('Informe o nome do cliente','[data-bind="novo.nome"]');else if(cpfDup(D.novo.cpf))E('Já existe cliente com este CPF: '+cpfDup(D.novo.cpf).nome,'[data-bind="novo.cpf"]')}
  else if(!D.clienteId)E('Escolha o cliente','#f-cli');
  const av0=isAvista(D);
  const itens=D.itens.map(it=>({tipo:it.tipo,nome:(it.nome||'').trim(),qtd:Math.max(1,parseInt(it.qtd,10)||1),valor:parseMoney(it.valor),juros:av0?0:parsePct(it.juros),lenteId:it.lenteId||''}));
  if(!itens.length)errs.push('Adicione ao menos um item');
  itens.forEach((it,i)=>{if(!it.nome)E('Item '+(i+1)+': '+(it.tipo==='lente'?'escolha a lente':'informe o nome do produto'),it.tipo==='lente'?'[data-lente="'+i+'"]':'[data-item="'+i+'"][data-f="nome"]');else if(it.valor<=0)E('Item '+(i+1)+': informe o valor','[data-item="'+i+'"][data-f="valor"]')});
  const av=isAvista(D),jv=av?0:parsePct(D.jurosVenda);
  let entradaIn=parseMoney(D.entrada);let c=calcVenda(itens,jv,entradaIn);
  if(av){entradaIn=c.total;c=calcVenda(itens,jv,entradaIn)}
  const n=av?0:Math.min(36,Math.max(0,parseInt(D.n,10)||0));
  if(c.total>0&&entradaIn>c.total)errs.push('A entrada é maior que o total');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(D.data))errs.push('Informe a data da venda');
  if(c.saldo>0&&n<1)errs.push('Informe o número de parcelas');
  if(c.saldo>0&&!/^\d{4}-\d{2}-\d{2}$/.test(D.primeira))errs.push('Informe o vencimento da 1ª parcela');
  return {errs:errs,targets:targets,itens:itens,c:c,n:n,av:av,jv:jv,entrada:entradaIn,parc:splitParcelas(c.saldo,n,D.primeira)};
}

  document.querySelectorAll('[data-line]').forEach(el=>{const l=c.linhas[+el.dataset.line];el.textContent=brl(l?l.t:0)});
  let h='<div class="sum-row"><span>Itens sem juros</span><span>'+brl(c.base)+'</span></div>';
  if(c.juros>0)h+='<div class="sum-row"><span>Juros aplicados</span><span>'+brl(c.juros)+'</span></div>';
  h+='<div class="sum-row big"><span>Total</span><span>'+brl(c.total)+'</span></div>';
  if(st.av)h+='<div class="sum-row hl"><span>À vista no Pix</span><span>'+brl(c.total)+'</span></div>';
  else{h+='<div class="sum-row"><span>Entrada</span><span>'+brl(c.entrada)+'</span></div>';
  h+='<div class="sum-row hl"><span>Saldo parcelado</span><span>'+(st.parc.length?st.parc.length+'x de '+brl(st.parc[0].valor):brl(c.saldo))+'</span></div>';
  if(st.parc.length){h+='<div class="meta">Vencimentos: '+st.parc.slice(0,4).map(p=>fmtShort(p.venc)).join(', ')+(st.parc.length>4?' ... '+fmtDate(st.parc[st.parc.length-1].venc):'')+'</div>';if(st.parc[st.parc.length-1].valor!==st.parc[0].valor)h+='<div class="meta">A última parcela leva a diferença dos centavos: '+brl(st.parc[st.parc.length-1].valor)+'</div>'}}
  $('#sum').innerHTML=h;
  const na=$('#novo-aviso');if(na){const tx=(ui.draft.clienteId==='__novo'&&ui.draft.novo.nome.trim())?avisoFalta(ui.draft.novo):'';na.textContent=tx;na.hidden=!tx}
  ui.vTarget=st.targets[0]||'';const vh=$('#vhint');vh.textContent=st.errs.length?'Falta preencher: '+st.errs[0]+(st.errs.length>1?' (e mais '+(st.errs.length-1)+')':''):'';vh.hidden=!st.errs.length;$('#vsave').disabled=st.errs.length>0;
  const lbl=ui.draft.editId?'Salvar alterações':ui.draft.aguardando?'Salvar orçamento':'Fechar venda';
  $('#vsave').textContent=st.errs.length?lbl:lbl+(ui.draft.aguardando?' de ':' de ')+brl(c.total);
}
function salvarVenda(){
  if(!ui.draft)return;const st=draftState();if(st.errs.length){toast(st.errs[0]);return}
  const D=ui.draft;let cid=D.clienteId;
  if(cid==='__novo'){const cl=makeCliente(D.novo);cid=cl.id;S.clientes[cid]=cl;persist('clientes',cid);premWaHook('bv',null,null,cl)}
  const v=makeVenda(cid,{itens:st.itens,jurosVenda:st.jv,entrada:st.entrada,formaEntrada:st.av?'Pix':D.formaEntrada,n:st.n,primeira:D.primeira,forma:D.forma,data:D.data,obs:D.obs});
  const old=D.editId?S.vendas[D.editId]:null;
  if(D.aguardando&&(!old||old.aguardando)){v.aguardando=true;v.parcelas.forEach(p=>{if(p.tipo==='entrada'){p.pago=false;p.pagoEm=null;p.forma=null}})}
  if(old){
    const oe=old.parcelas.filter(p=>p.tipo==='entrada');const op0=old.parcelas.find(p=>p.tipo==='parcela');
    if(!old.aguardando&&old.parcelas.some(p=>p.parte&&p.tipo==='parcela')&&v.total===old.total&&v.entrada===old.entrada&&v.n===old.n&&D.primeira===(op0&&op0.venc)){v.parcelas=JSON.parse(JSON.stringify(old.parcelas))}
    else if(!old.aguardando&&oe.length>1&&v.entrada===old.entrada)v.parcelas=oe.concat(v.parcelas.filter(p=>p.tipo!=='entrada'));
    v.id=old.id;v.criadoEm=old.criadoEm;if(old.exemplo)v.exemplo=true;if(old.por)v.por=old.por;
    if(!v.parcelas.some(p=>p.parte&&p.tipo==='parcela'))v.parcelas.forEach(p=>{if(p.tipo!=='parcela')return;const o=old.parcelas.find(q=>q.tipo==='parcela'&&q.n===p.n);if(o){p.contatoEm=o.contatoEm||null;if(o.pago){p.pago=true;p.pagoEm=o.pagoEm;p.forma=o.forma||null}}});
  }
  if(!old&&typeof SESSION!=='undefined'&&SESSION&&SESSION.user&&SESSION.user.email)v.por=String(SESSION.user.email).toLowerCase();
  if(D.vendedorId)v.vendedorId=D.vendedorId;
  if(D.entrega)v.entregaPrev=D.entrega;
  if(old&&old.chegouEm)v.chegouEm=old.chegouEm;
  if(old&&old.os)v.os=old.os;
  if(old&&old.entregueEm){v.entregueEm=old.entregueEm;if(old.agradEm)v.agradEm=old.agradEm}
  S.vendas[v.id]=v;persist('vendas',v.id);
  if(!v.exemplo&&(!old||(old.aguardando&&!v.aguardando)))waResumo(v,true);
  premLog(old?'Venda editada':(v.aguardando?'Orçamento criado':'Venda criada'),((S.clientes[cid]||{}).nome||'')+' · '+brl(v.total));
  ui.draft=null;ui.sheet={kind:'venda',id:v.id};if(!old)ui.tab=v.aguardando?'aguard':'vendas';render();renderSheet();toast(v.aguardando?(old?'Orçamento atualizado':'Orçamento salvo em Orçamentos'):(old?'Venda atualizada':'Venda registrada'));
}

const fmtMes=m=>cap(parseYmd(m+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
function relDados(m){
  const t=todayStr(),ps=allP(),vs=vendasOk();
  const fim=m+'-'+pad(new Date(+m.slice(0,4),+m.slice(5,7),0).getDate());
  const rec=ps.filter(x=>x.p.pago&&x.p.pagoEm&&x.p.pagoEm.slice(0,7)===m).sort((a,b)=>a.p.pagoEm.localeCompare(b.p.pagoEm));
  const vend=vs.filter(v=>v.data.slice(0,7)===m).sort((a,b)=>a.data.localeCompare(b.data));
  const aRec=ps.filter(x=>!x.p.pago&&x.p.venc.slice(0,7)===m);
  const venc=ps.filter(x=>!x.p.pago&&x.p.venc<=fim&&x.p.venc<t).sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
  const byF={};rec.forEach(x=>{const f=pForma(x.p,x.v);byF[f]=(byF[f]||0)+recv(x.p)});
  const enc=rec.reduce((s,x)=>s+(x.p.recebido?x.p.recebido-x.p.valor:0),0);
  return {m:m,rec:rec,vend:vend,aRec:aRec,venc:venc,byF:byF,enc:enc,recebido:sumV(rec),vendido:sumT(vend)};
}

function premView(k){
  if(k==='exames')return viewExames();
  if(k==='premium')return viewUpsell(ui.upk||'');
  if(k==='campanhas'){if(!modOn('campanhas')&&!modOn('pesquisa'))return viewUpsell('campanhas');return viewCamp()}
  if(k==='whatsapp')return modOn('wa')&&ROLE==='dono'?viewWa():viewUpsell('wa');
  if(k==='wachat')return modOn('wachat')?viewWaChat():viewUpsell('wachat');
  if(k==='site')return viewSite();
  if(k==='trafego')return viewTrafego();
  if(k==='agente')return viewAgente();
  if(!modOn(k))return viewUpsell(k);
  return k==='financeiro'?viewFin():viewMetas();
}

const FIN_CATS=['Laboratório','Aluguel','Salários','Fornecedor','Impostos','Água, luz e internet','Outros'];
const finDoc=()=>{if(!S.config.fin)S.config.fin={id:'fin',itens:{}};if(!S.config.fin.itens)S.config.fin.itens={};return S.config.fin};
const finSave=()=>persist('config','fin');

/* ----- metas e comissão ----- */
const metaDoc=()=>{if(!S.config.metas)S.config.metas={id:'metas',loja:0,pct:'',vend:{},vends:{}};if(!S.config.metas.vend)S.config.metas.vend={};if(!S.config.metas.vends)S.config.metas.vends={};return S.config.metas};
const vendList=()=>Object.values(metaDoc().vends||{}).sort((x,y)=>x.nome.localeCompare(y.nome));
const vendNome=k=>{const x=(metaDoc().vends||{})[k];return x?x.nome:nomeVend(k)};
/* de quem é a venda: escolhida na venda, senão o vendedor do cliente, senão o e-mail de quem registrou */
function vendKey(v){
  const md=metaDoc(),vs=md.vends||{};
  if(v.vendedorId==='-')return '';
  if(v.vendedorId&&vs[v.vendedorId])return v.vendedorId;
  const c=S.clientes[v.clienteId];if(c&&c.vendedorId&&vs[c.vendedorId])return c.vendedorId;
  const em=String(v.por||'').toLowerCase();const hit=Object.values(vs).find(x=>x.email&&String(x.email).toLowerCase()===em);
  return hit?hit.id:'';
}
function metaLinhas(m){
  const rows={},md=metaDoc();const mk=k=>rows[k]||(rows[k]={k:k,n:0,tot:0,vs:[],cli:[]});
  vendasOk().filter(v=>v.data.slice(0,7)===m).forEach(v=>{const r=mk(vendKey(v));r.n++;r.tot+=v.total;r.vs.push(v)});
  Object.keys(md.vends||{}).forEach(k=>mk(k));
  Object.keys(md.vend).forEach(k=>{const c=md.vend[k]||{};if(rows[k]||c.meta||(c.pct!==undefined&&c.pct!==''))mk(k)});
  Object.values(S.clientes).forEach(c=>{if(c.vendedorId&&rows[c.vendedorId])rows[c.vendedorId].cli.push(c)});
  return Object.values(rows).map(r=>{const c=md.vend[r.k]||{};const pct=(c.pct!==undefined&&c.pct!=='')?parsePct(c.pct):parsePct(md.pct);const fixo=(c.fixo!==undefined&&c.fixo!=='')?(+c.fixo||0):(md.fixo||0);return Object.assign(r,{meta:c.meta||0,pct:pct,fixo:fixo,com:r.k?Math.round(r.tot*pct/100)+fixo*r.n:0,cfgPct:c.pct,cfgFixo:c.fixo,cad:!!(md.vends||{})[r.k]})}).sort((a,b)=>(b.cad-a.cad)||b.tot-a.tot||vendNome(a.k).localeCompare(vendNome(b.k)));
}
const comVenda=(v,r)=>Math.round(v.total*r.pct/100)+r.fixo;
const comTxt=r=>{const a=[];if(r.pct)a.push(String(r.pct).replace('.',',')+'%');if(r.fixo)a.push(brl(r.fixo)+' por venda');return a.length?' ('+a.join(' + ')+')':''};
const meKeys=()=>{const e=meEmail();const hit=vendList().find(x=>x.email&&String(x.email).toLowerCase()===e);return hit?[e,hit.id]:[e]};
const barra=(p)=>'<div class="bar" style="flex:none;width:100%" aria-hidden="true"><i style="width:'+Math.min(100,p)+'%"></i></div>';
function viewMetas(){
  eqLoad();
  const m=ui.mm||(ui.mm=todayStr().slice(0,7));const md=metaDoc();const dono=ROLE==='dono';
  const all=metaLinhas(m);let rows=all;if(!dono){const me=meKeys();rows=rows.filter(r=>me.includes(r.k))}
  const tot=all.reduce((s,r)=>s+r.tot,0);const nv=all.reduce((s,r)=>s+r.n,0);const comTot=all.reduce((s,r)=>s+r.com,0);
  const pl=md.loja?Math.round(tot/md.loja*100):0;
  const loja=dono?'<div class="card" style="gap:10px;margin-bottom:14px"><div class="sale-top"><b>Meta da loja</b><span class="chip'+(md.loja&&pl>=100?' ok':'')+'">'+(md.loja?pl+'% da meta':'Sem meta definida')+'</span></div><div class="sale-bot"><span>Vendido '+brl(tot)+' em '+plural(nv,'venda','vendas')+'</span><span>Meta '+(md.loja?brl(md.loja):'-')+'</span></div>'+(md.loja?barra(pl):'')+'<div class="sale-bot"><span>Comissões do mês</span><b>'+brl(comTot)+'</b></div></div>':'';
  const linhas=rows.map(r=>{const p=r.meta?Math.round(r.tot/r.meta*100):0;
    const vdet=r.vs.length?'<details><summary>Vendas do mês ('+r.vs.length+')</summary><div class="stack" style="gap:6px">'+r.vs.slice().sort((x,y)=>y.data.localeCompare(x.data)).map(v=>'<div class="sum-row"><span>'+esc((S.clientes[v.clienteId]||{nome:'Cliente removido'}).nome)+' <span class="meta">'+fmtShort(v.data)+'</span></span><span class="num">'+brl(v.total)+' · <b>'+brl(comVenda(v,r))+'</b></span></div>').join('')+'</div><p class="sub" style="margin:8px 0 0">Valor da venda · comissão sobre ela.</p></details>':'';
    const cdet=r.cad?'<details><summary>Clientes dele ('+r.cli.length+')</summary>'+(r.cli.length?'<div class="stack" style="gap:6px">'+r.cli.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>'<div class="sum-row"><span>'+esc(c.nome)+'</span></div>').join('')+'</div>':'<p class="sub" style="margin:0">Nenhum cliente vinculado ainda. Toque em Editar para adicionar.</p>')+'</details>':'';
    return '<div class="card" style="gap:10px"><div class="sale-top"><b>'+esc(vendNome(r.k))+'</b><span class="acts" style="align-items:center"><span class="chip'+(r.meta&&p>=100?' ok':'')+'">'+(r.meta?p+'% da meta':'Sem meta')+'</span>'+((dono&&r.cad)?'<button class="btn sm" data-act="vdedit" data-k="'+esc(r.k)+'">Editar</button><button class="btn sm ghost danger'+(ui.confirm===r.k?' armed':'')+'" data-act="vdexcluir" data-k="'+esc(r.k)+'">'+(ui.confirm===r.k?'Toque de novo para excluir':'Excluir')+'</button>':'')+'</span></div><div class="sale-bot"><span>Vendido '+brl(r.tot)+' · '+plural(r.n,'venda','vendas')+'</span><span>Comissão '+brl(r.com)+comTxt(r)+'</span></div>'+(r.meta?barra(p):'')+vdet+cdet+
    (dono&&r.k?'<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="field"><span>Meta do mês (R$)</span><input type="text" inputmode="decimal" data-pm="v:'+esc(r.k)+':meta" value="'+(r.meta?centsToStr(r.meta):'')+'" placeholder="0,00"></div><div class="field"><span>Comissão (%)</span><input type="text" inputmode="decimal" data-pm="v:'+esc(r.k)+':pct" value="'+esc(r.cfgPct===undefined?'':r.cfgPct)+'" placeholder="padrão"></div><div class="field"><span>Valor por venda (R$)</span><input type="text" inputmode="decimal" data-pm="v:'+esc(r.k)+':fixo" value="'+((r.cfgFixo===undefined||r.cfgFixo==='')?'':centsToStr(r.cfgFixo))+'" placeholder="padrão"></div></div>'+'':'')+'</div>'}).join('');
  const cfgBox=dono?'<div class="sh"><h2>Regras</h2></div><div class="card" style="gap:12px"><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="field"><span>Meta mensal da loja (R$)</span><input type="text" inputmode="decimal" data-pm="loja" value="'+(md.loja?centsToStr(md.loja):'')+'" placeholder="0,00"></div><div class="field"><span>Comissão padrão (%)</span><input type="text" inputmode="decimal" data-pm="pct" value="'+esc(md.pct||'')+'" placeholder="0"></div><div class="field"><span>Valor padrão por venda (R$)</span><input type="text" inputmode="decimal" data-pm="fixo" value="'+(md.fixo?centsToStr(md.fixo):'')+'" placeholder="0,00"></div></div><p class="sub" style="margin:0">A comissão pode ser uma porcentagem do valor vendido, um valor fixo por venda, ou os dois somados. Cada vendedor pode ter o seu próprio valor. A venda vai para o vendedor escolhido na venda; se nada for escolhido, vai para o vendedor do cliente. A meta e a comissão de cada vendedor valem para qualquer mês.</p></div>':'';
  return pageHead('Metas e comissão',dono?'Acompanhe a loja e cada vendedor':'Seus números do mês',dono?'<div class="acts"><button class="btn primary" data-act="vdnovo">Cadastrar vendedor</button></div>':'<div class="acts"></div>')+'<div style="margin-bottom:14px">'+mesNav(m,'meta')+'</div>'+loja+
  '<div class="stack">'+(linhas||'<div class="empty">'+GLASSES+'<h3>Nenhum vendedor ainda</h3><p>Cadastre os vendedores, ligue os clientes a eles e acompanhe vendas e comissão.</p>'+(dono?'<div class="acts" style="justify-content:center"><button class="btn primary" data-act="vdnovo">Cadastrar vendedor</button></div>':'')+'</div>')+'</div>'+cfgBox;
}

/* cadastro de vendedor */
function vdBlank(){return {sal:'',id:'vd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),nome:'',email:'',pct:'',meta:'',novo:true,sel:{},q:''}}
function sheetVend(){

const rxNum=s=>{const n=parseFloat(String(s||'').replace(',','.'));return isNaN(n)?null:n};
function rxChart(rx){
  const pts=['od','oe'].map(o=>rx.map((r,i)=>({i:i,v:rxNum(r[o]&&r[o].esf)})).filter(p=>p.v!==null));
  const all=pts[0].concat(pts[1]);if(rx.length<2||all.length<2)return '';
  const mn=Math.min.apply(null,all.map(p=>p.v)),mx=Math.max.apply(null,all.map(p=>p.v));const W=300,H=110,pad=18,span=(mx-mn)||1;
  const X=i=>pad+(rx.length>1?i*(W-2*pad)/(rx.length-1):0),Y=v=>H-pad-(v-mn)/span*(H-2*pad);
  const line=(a,col)=>a.length?'<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+a.map(p=>X(p.i)+','+Y(p.v)).join(' ')+'"/>'+a.map(p=>'<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>').join(''):'';
  return '<svg class="rxch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do grau esférico de cada olho ao longo das receitas"><text x="2" y="12" font-size="10" fill="var(--muted)">'+String(mx).replace('.',',')+'</text><text x="2" y="'+(H-4)+'" font-size="10" fill="var(--muted)">'+String(mn).replace('.',',')+'</text>'+line(pts[0],'var(--bar-a)')+line(pts[1],'var(--bar-b)')+'</svg><div class="key"><span><i style="background:var(--bar-a)"></i>Olho direito (OD)</span><span><i style="background:var(--bar-b)"></i>Olho esquerdo (OE)</span></div>';
}

function fotoComprime(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=800,s=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let q=.6,d=cv.toDataURL('image/jpeg',q);while(d.length>160000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}res(d)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

const waOn=()=>modOn('wa')&&!!waDoc().on;
const WA={st:null,fila:null,busy:false,token:'',err:'',t:0,q:''};
async function waLoad(){
  if(WA.busy||!OTICA||!modOn('wa'))return;WA.busy=true;
  try{
    const r=await Promise.all([sb.rpc('wa_status',{p_otica:OTICA.id}),sb.from('wa_fila').select('id,cliente_id,cliente_nome,tipo,telefone,texto,status,enviar_apos,expira_em,erro,enviado_em,criado_em').eq('otica_id',OTICA.id).not('tipo','in','(manual,agente)').order('criado_em',{ascending:false}).limit(500)]);
    WA.st=(r[0]&&r[0].data)||null;WA.fila=(r[1]&&r[1].data)||[];
  }catch(e){WA.fila=WA.fila||[]}
  WA.busy=false;WA.t=Date.now();
  if(ui.tab==='whatsapp'&&!fieldsOn()&&!ui.sheet)render();
  waQrPoll();
}
function waGarante(){if(WA.fila===null&&!WA.busy)setTimeout(waLoad,0)}
setInterval(()=>{if(auth==='ok'&&modOn('wa')&&ui.tab==='whatsapp'&&!document.hidden)waLoad()},30000);
function waEnq(tipo,c,texto,ref){
  if(!waOn()||!c||!c.whatsapp||!OTICA)return false;
  sb.rpc('wa_enfileirar',{p_otica:OTICA.id,p_cliente:c.id||'',p_nome:c.nome||'',p_tipo:tipo,p_tel:c.whatsapp,p_texto:texto,p_ref:ref}).then(r=>{if(r&&!r.error){WA.fila=null;if(r.data==='ok')toast(waModo(tipo)==='auto'?'Mensagem na fila do WhatsApp':'Mensagem esperando sua aprovação no menu WhatsApp automático');else if(r.data==='dup')toast('Essa mensagem já está na fila do WhatsApp');else if(r.data==='optout')toast('Esse cliente pediu para não receber mensagens');else if(r.data==='off')toast('Esse tipo de mensagem está desligado no menu WhatsApp automático')}}).catch(()=>{});
  return true;
}
/* resumo da venda (valor e parcelas) ou do orçamento: entra na fila do WhatsApp Automático */
function waResumo(v,auto){
  if(!waOn())return false;const c=S.clientes[v.clienteId];if(!c||!c.whatsapp)return false;
  const tp=v.aguardando?'orcamento':'venda';if(auto&&waModo(tp)==='off')return false;
  return waEnq(tp,c,fillTpl(tpl(tp),ctx(v,null,c)),(v.aguardando?'orc:':'vnd:')+v.id+':'+v.total);
}
const waModo=t=>waDoc().modo[t]||(String(t).indexOf('exame_')===0?'auto':'aprovar');
function premWaHook(ev,v,p,c){
  if(!waOn())return;
  if(ev==='bv'&&c)waEnq('boasvindas',c,fillTpl(tpl('cadastro'),ctx(null,null,c)),'bv:'+c.id);
  else if(ev==='recibo'&&v&&p){const cl=S.clientes[v.clienteId];if(cl)waEnq('recibo',cl,fillTpl(tpl('recibo'),ctx(v,p,cl)),'rec:'+v.id+':'+v.parcelas.indexOf(p)+':'+p.pagoEm)}
}
function premWaBtns(v,feito){
  if(!waOn())return '';const c=S.clientes[v.clienteId];if(!c||!c.whatsapp)return '';
  if(feito)return v.agradEm?'':'<button class="btn sm wa" data-act="waent" data-t="ent" data-v="'+v.id+'">Agradecer</button>';
  return '<button class="btn sm wa" data-act="waent" data-t="cheg" data-v="'+v.id+'">'+(v.chegouEm?'Avisar de novo':'Avisar que chegou')+'</button><button class="btn sm wa" data-act="waent" data-t="ent" data-v="'+v.id+'">Entregue e agradecer</button>';
}
function waEstado(){
  const st=WA.st;if(!st)return ['','Carregando...'];
  if(!st.tem_token)return ['warn','Conector não instalado'];
  if(st.estado==='conectado')return ['ok','Conectado'+(st.numero?' ('+esc(maskTel(String(st.numero).replace(/^55/,''))) +')':'')];
  if(st.estado==='qr')return ['warn','Esperando ler o QR Code'];
  return ['bad','Computador da loja desligado ou programa fechado'];
}
function premFuWa(){
  if(!modOn('wa'))return null;waGarante();

  const st=WA.st||{},e=waEstado(),dono=ROLE==='dono',fila=WA.fila||[];
  const linha=m=>{const sp=WA_ST[m.status]||['',m.status];
    const pode=dono&&['aprovar','falhou','cancelada','expirada'].includes(m.status),canc=dono&&['aprovar','aguardando','falhou'].includes(m.status);
    return '<article class="row"><div class="row-main"><b>'+esc(m.cliente_nome||m.telefone)+'</b><div class="meta">'+esc(WA_NOME[m.tipo]||m.tipo)+' · '+fmtDate(String(m.criado_em).slice(0,10))+'</div><div class="meta" style="white-space:pre-line">'+esc(String(m.texto||'').replace(/\n\nPara não receber mais avisos, responda SAIR\.$/,'').slice(0,160))+'</div><div class="chips"><span class="chip '+sp[0]+'">'+sp[1]+'</span>'+(m.erro&&m.status!=='enviada'?'<span class="chip">'+esc(m.erro)+'</span>':'')+'</div></div><div class="row-side"><div class="acts">'+(pode?'<button class="btn sm ok" data-act="waaprovar" data-id="'+m.id+'">'+(m.status==='aprovar'?'Aprovar':'Enviar')+'</button>':'')+(canc?'<button class="btn sm ghost" data-act="wacancelar" data-id="'+m.id+'">Cancelar</button>':'')+'</div></div></article>'};
  const n=+st.aprovar||0;
  return {n:n,html:'<div class="chips" style="margin-bottom:8px"><span class="chip '+e[0]+'">'+e[1]+'</span><span class="chip">Enviadas hoje: '+(+st.enviadas_hoje||0)+'</span><span class="chip">Na fila: '+(+st.na_fila||0)+'</span>'+(+st.falhas?'<span class="chip bad">Falhas: '+st.falhas+'</span>':'')+(waDoc().pausa?'<span class="chip warn">Envios pausados</span>':'')+'</div>'+
   '<div class="acts" style="margin-bottom:10px">'+(dono&&n?'<button class="btn primary sm" data-act="waaprovtodas">Aprovar todas ('+n+')</button>':'')+'<button class="btn sm" data-act="waatualizar">Atualizar</button></div>'+
   '<p class="sub" style="margin:0 0 8px">Se o computador da loja estiver desligado, as mensagens ficam guardadas aqui e saem quando ele ligar, dentro do prazo de cada aviso.</p>'+
   (WA.fila===null?none('Carregando...'):waFilaHtml(fila,linha))};
}
/* fila em duas partes: o que precisa de atenção (aprovar, na fila, falhou) e o histórico agrupado por cliente */
const WA_PEND=['aprovar','aguardando','enviando','falhou'];
function waGrupos(fila){
  const G={};
  fila.filter(m=>!WA_PEND.includes(m.status)).forEach(m=>{const k=String(m.telefone||'').replace(/\D/g,'').slice(-8)||m.cliente_id||m.id;
    const g=G[k]||(G[k]={k,msgs:[],tel:m.telefone,nomes:[]});g.msgs.push(m);if(m.cliente_nome)g.nomes.push(m.cliente_nome)});
  return Object.values(G).map(g=>{g.msgs.sort((a,b)=>String(b.enviado_em||b.criado_em).localeCompare(String(a.enviado_em||a.criado_em)));
    const cli=Object.values(S.clientes).find(c=>c&&c.whatsapp&&String(c.whatsapp).replace(/\D/g,'').slice(-8)===g.k);
    const equipe=g.msgs.every(m=>m.tipo==='exame_equipe');
    g.nome=cli?cli.nome:equipe?'Equipe (avisos para os donos)':(g.nomes.find(n=>n&&n!=='Equipe'&&n!=='Conversa')||maskTel(String(g.tel||'').replace(/^55/,'')));
    g.ult=String(g.msgs[0].enviado_em||g.msgs[0].criado_em);g.env=g.msgs.filter(m=>m.status==='enviada').length;return g})
   .sort((a,b)=>b.ult.localeCompare(a.ult));
}
function waHistHtml(){
  const q=String(WA.q||'').trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const gs=waGrupos(WA.fila||[]).filter(g=>!q||g.nome.toLowerCase().includes(q)||(qd.length>=3&&String(g.tel||'').includes(qd)));
  if(!gs.length)return none(q?'Nenhum cliente encontrado.':'Nenhuma mensagem enviada ainda.');
  const dh=s=>{const d=new Date(s);return fmtDate(new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  return gs.map(g=>'<details class="card wa-cli" style="padding:0;gap:0"'+(WA.aberto===g.k?' open':'')+' data-wak="'+g.k+'"><summary style="padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="flex:1;min-width:160px">'+esc(g.nome)+'</b><span class="chip ok">'+plural(g.env,'enviada','enviadas')+'</span><span class="sub" style="margin:0">Última: '+dh(g.ult)+'</span></summary>'+
    '<div class="stack" style="padding:0 14px 12px">'+g.msgs.map(m=>{const sp=WA_ST[m.status]||['',m.status];return '<div style="border-top:1px solid var(--line);padding-top:10px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:14px">'+esc(WA_NOME[m.tipo]||m.tipo)+'</b><span class="chip '+sp[0]+'">'+sp[1]+'</span><span class="sub" style="margin:0">'+dh(m.enviado_em||m.criado_em)+'</span></div><div class="meta" style="white-space:pre-line;margin-top:4px">'+esc(String(m.texto||'').replace(/\n\nPara não receber mais avisos, responda SAIR\.$/,''))+'</div></div>'}).join('')+'</div></details>').join('');
}
function waFilaHtml(fila,linha){
  const pend=fila.filter(m=>WA_PEND.includes(m.status));
  return '<h3 style="margin:6px 0 8px;font-size:15px">Precisa de atenção <span class="sub num">'+pend.length+'</span></h3><div class="stack">'+(pend.length?pend.map(linha).join(''):none('Nada esperando aprovação ou na fila.'))+'</div>'+
    '<h3 style="margin:18px 0 8px;font-size:15px">Histórico por cliente</h3><div class="field" style="max-width:420px;margin-bottom:10px"><input type="search" id="wa-q" placeholder="Buscar cliente pelo nome ou WhatsApp" value="'+esc(WA.q)+'" aria-label="Buscar cliente no histórico"></div>'+
    '<div class="stack" id="wa-hist">'+waHistHtml()+'</div><p class="sub" style="margin-top:8px">Mostra as últimas 500 mensagens. Toque no nome do cliente para ver tudo o que foi enviado para ele.</p>';
}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.id==='wa-q'){WA.q=t.value;const h=document.getElementById('wa-hist');if(h)h.innerHTML=waHistHtml()}});
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.wak){if(t.open)WA.aberto=t.dataset.wak;else if(WA.aberto===t.dataset.wak)WA.aberto=''}},true);
const WA_SEC={boasvindas:['boasvindas'],cobrar:['lembrete','atraso'],aniversarios:['aniversario'],revisao:['revisao']};
const waQ=(tipos,cid)=>(WA.fila||[]).filter(m=>tipos.includes(m.tipo)&&['aprovar','aguardando','enviando','enviada'].includes(m.status)&&(!cid||m.cliente_id===cid));
function premBvFiltro(l){if(!waOn()||waModo('boasvindas')==='off')return l;return l.filter(c=>!waQ(['boasvindas'],c.id).length)}
function premFuAuto(k,html){
  const tp=WA_SEC[k];if(!tp||!waOn()||tp.every(t=>waModo(t)==='off'))return html;
  const q=waQ(tp),env=q.filter(m=>m.status==='enviada').length,esp=q.filter(m=>m.status==='aprovar').length,fila=q.length-env-esp;
  const modos=tp.map(t=>waModo(t)==='auto'?'sai sozinho':'espera a sua aprovação');
  const txt='<p class="sub" style="margin:0 0 8px"><b>Automático:</b> '+(k==='cobrar'?'lembrete na véspera e atraso com 1, 7 e 15 dias':k==='boasvindas'?'a mensagem sai ao cadastrar o cliente':k==='aniversarios'?'o parabéns sai no dia':'o convite sai quando completa 11 meses')+' ('+modos[0]+'). '+env+' enviadas, '+fila+' na fila, '+esp+' esperando aprovação. <button class="btn sm" data-act="premopen" data-k="wa">Ver a fila</button></p>';
  if(k==='boasvindas')return txt+(html.indexOf('class="row"')>=0?'<p class="sub" style="margin:0 0 6px">Ainda sem mensagem automática (cadastrados antes de ligar):</p>'+html:'');
  return txt+'<details><summary class="sub" style="cursor:pointer">Ver a lista e enviar pela fila</summary><div style="margin-top:8px">'+html+'</div></details>';
}
function viewWa(){

// WhatsApp na nuvem: o conector roda no servidor 24h; o QR Code aparece aqui para ler com o celular da ótica.

  const D=waDoc(),e=waEstado(),st=WA.st||{};
  const sel=x=>'<div class="sum-row"><span>'+esc(x[1])+'</span><select data-wamodo="'+x[0]+'" aria-label="'+esc(x[1])+'"><option value="aprovar"'+(waModo(x[0])==='aprovar'?' selected':'')+'>Aprovar antes</option><option value="auto"'+(waModo(x[0])==='auto'?' selected':'')+'>Enviar sozinho</option><option value="off"'+(waModo(x[0])==='off'?' selected':'')+'>Desligado</option></select></div>';

/* locais do exame: o local de um dia é o primeiro que atende naquele dia da semana; locais com mesmo nome e endereço formam um grupo */
function exLocs(){return ((EX.cfg&&Array.isArray(EX.cfg.locais))?EX.cfg.locais:[]).filter(l=>l&&(l.nome||l.endereco))}
const exDow=d=>new Date(d+'T12:00:00Z').getUTCDay();
const exLocDias=l=>Array.isArray(l.dias)&&l.dias.length?l.dias.map(Number):[0,1,2,3,4,5,6];
function exLocIx(d){return exLocs().findIndex(l=>!l.interno&&exLocDias(l).includes(exDow(d)))}
/* local de um grupo num dia (inclui os locais só da equipe) */
function exLocIxG(d,g){const G=exGrupos()[g];if(!G)return -1;const L=exLocs();const i=exLocIx(d);if(G.ix.includes(i))return i;return G.ix.find(j=>exLocDias(L[j]).includes(exDow(d)))??-1}
/* grupo do local salvo no exame */
function exGrupoLocal(l){if(!l)return -1;const k=((l.nome||'')+'|'+(l.endereco||'')).toLowerCase().trim();return exGrupos().findIndex(g=>g.k===k)}
function exGrupos(){const G=[];exLocs().forEach((l,i)=>{const k=((l.nome||'')+'|'+(l.endereco||'')).toLowerCase().trim(),g=G.find(x=>x.k===k);if(g)g.ix.push(i);else G.push({k,nome:l.nome||'',endereco:l.endereco||'',ix:[i]})});return G}
function exGrupoDe(d){const i=exLocIx(d);return exGrupos().findIndex(g=>g.ix.includes(i))}
function exHorasDia(d,g){const c=Object.assign({},EX_PADRAO,EX.cfg||{}),L=exLocs(),i=L.length?(g!=null?exLocIxG(d,g):exLocIx(d)):-1,fx=i>=0&&Array.isArray(L[i].horas)?L[i].horas.filter(h=>/^\d{1,2}:\d{2}$/.test(h)).map(h=>h.padStart(5,'0')):[];
  if(fx.length)return fx.sort();const o=[],dur=Math.max(10,+c.duracao_min||30),hm=t=>{const p=String(t||'').split(':');return (+p[0])*60+(+p[1]||0)};for(let m=hm(c.hora_ini||'09:00');m+dur<=hm(c.hora_fim||'17:00');m+=dur)o.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return o}
function exDiasDoGrupo(g){const c=Object.assign({},EX_PADRAO,EX.cfg||{}),o=[];for(let i=0;i<=Math.max(14,+c.janela_dias||14)+14;i++){const d=addDays(todayStr(),i);const j=exLocIxG(d,g);if(j>=0&&((c.dias||[]).includes(exDow(d))||exLocs()[j].interno))o.push(d)}return o}

function exClientesOpc(){return Object.values(S.clientes).filter(c=>c&&c.nome).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>({c,l:c.nome+(c.whatsapp?' · '+maskTel(c.whatsapp):'')}))}

   locs+

function exLocNome(d){const L=(EX.cfg&&Array.isArray(EX.cfg.locais))?EX.cfg.locais:[];if(!L.length)return '';const w=new Date(d+'T12:00:00Z').getUTCDay(),l=L.find(x=>!x.interno&&(!Array.isArray(x.dias)||!x.dias.length||x.dias.map(Number).includes(w)));return l?(l.nome||l.endereco||''):''}

   a resposta entra na fila com tipo "manual" e o conector manda na hora, sem rodapé. */
