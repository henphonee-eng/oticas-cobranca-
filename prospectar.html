<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3FB;--surface:#fff;--surface-2:#E2EBF8;--fg:#0A1D3C;--muted:#53698C;--line:#D0DCEE;
  --accent:#0B4FB0;--accent-fg:#fff;--accent-soft:#DCEAFC;--brand:#00348A;
  --ok:#17703F;--ok-bg:#DCF0E3;--warn:#8F5A00;--warn-bg:#F7EACA;--bad:#B3261E;--bad-bg:#F8DDDA;
  --wa:#1F8A4C;--wa-fg:#fff;--hot:#B4410E;--hot-bg:#FCE4D4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1422;--surface:#131E31;--surface-2:#1A2840;--fg:#E6EEFA;--muted:#93A6C4;--line:#24365A;
  --accent:#5A9BF0;--accent-fg:#06142B;--accent-soft:#18325A;--brand:#0A1D3C;
  --ok:#6FD39A;--ok-bg:#123524;--warn:#E8B85A;--warn-bg:#3A2C10;--bad:#F08A80;--bad-bg:#3E1714;
  --wa:#2FA463;--wa-fg:#fff;--hot:#F4A06B;--hot-bg:#3C2112;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.top{background:var(--brand);color:#fff;padding:14px 16px calc(14px);padding-top:max(14px,env(safe-area-inset-top))}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{font-size:22px}
.top .sp{flex:1}
.top a,.top button{color:#fff;opacity:.85;background:none;border:0;cursor:pointer;font-size:14px;text-decoration:none}
.tabs{background:var(--brand);position:sticky;top:0;z-index:5}
.tabs .in{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
.tabs button{background:none;border:0;color:#fff;opacity:.7;padding:10px 12px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{opacity:1;border-color:#8CC4FF}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:120px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:var(--wa-fg);border-color:var(--wa)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.hot{background:var(--hot-bg);color:var(--hot)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px;font-family:Newsreader,serif}
.stat span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px;margin-top:12px}
@media (min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
.lead h2{font-size:18px}
.lead .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.lead .acts{display:flex;flex-wrap:wrap;gap:6px}
.lead .more{margin-top:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
.lead .more .full{grid-column:1/-1}
.lead label,.fld label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note ol{margin:6px 0 0;padding-left:20px}
.note a{color:inherit;font-weight:600}
.gate{max-width:380px;margin:10vh auto;padding:0 16px}
.gate .card{display:grid;gap:10px}
.err{color:var(--bad);font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.res{display:flex;gap:10px;align-items:flex-start}
.res input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.acs{display:grid;gap:4px;font-size:13px;max-height:180px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat{font:inherit;color:inherit}
.prev{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:14px}
.sec{margin-top:18px}
.sec h2{font-size:20px;margin-bottom:8px}

/* ===== Tema Adm (estilo Positivus): grafite, verde-limão e branco ===== */
:root{
  --bg:#F3F3F3;--surface:#fff;--surface-2:#F3F3F3;--fg:#191A23;--muted:#5B5C66;--line:#D6D6DB;--edge:#191A23;--drop:0 5px 0 #191A23;
  --accent:#191A23;--accent-fg:#fff;--accent-soft:#E9FFD3;--brand:#191A23;--lime:#B9FF66;
  --ok:#2E7D1E;--ok-bg:#E2FBC6;--warn:#8A5A00;--warn-bg:#FFF0C7;--bad:#C2271C;--bad-bg:#FFE1DD;
  --wa:#191A23;--wa-fg:#B9FF66;--hot:#191A23;--hot-bg:#B9FF66;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F14;--surface:#191A23;--surface-2:#23242F;--fg:#F3F3F3;--muted:#A7A8B3;--line:#33343F;--edge:#3D3E4A;--drop:0 5px 0 #000;
  --accent:#B9FF66;--accent-fg:#191A23;--accent-soft:#2A3A1A;--brand:#191A23;
  --ok:#B9FF66;--ok-bg:#25351A;--warn:#F2C55C;--warn-bg:#3A2E12;--bad:#FF8A7E;--bad-bg:#3D1A17;
  --wa:#B9FF66;--wa-fg:#191A23;--hot:#191A23;--hot-bg:#B9FF66;}}
html,body{font-family:'Space Grotesk',system-ui,sans-serif!important;letter-spacing:-.005em}
h1,h2{font-family:'Space Grotesk',system-ui,sans-serif!important;font-weight:500!important;letter-spacing:-.02em!important}
.top,.tabs{background:#191A23!important}
.tabs button{border-radius:12px 12px 0 0}
.tabs button.on{opacity:1;border-color:transparent;background:#B9FF66;color:#191A23;border-radius:12px;margin:4px 0 8px;padding:6px 12px}
.card,.stat,.empty{border:1px solid var(--edge)!important;box-shadow:var(--drop);border-radius:22px!important}
.card{padding:16px 18px}
.list{gap:16px!important}
.stat{border-radius:18px!important}
.stats .stat:nth-child(2){background:#B9FF66;color:#191A23}
.stats .stat:nth-child(2) span{color:#191A23;opacity:.75}
.stat b{font-family:'Space Grotesk',sans-serif!important;font-weight:600}
.lead h2{display:inline;background:none}
.sec h2{display:inline-block;background:#B9FF66;color:#191A23;padding:1px 9px;border-radius:7px}
.btn{border-radius:14px!important;border:1px solid var(--edge)!important;font-weight:500!important}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.wa{background:var(--wa);color:var(--wa-fg)}
.chip{border:1px solid var(--edge)!important;border-radius:14px!important}
.chip.on{background:var(--accent)!important;color:var(--accent-fg)!important}
.tag{border-radius:8px!important;font-weight:500!important}
.tag.ok{background:#B9FF66;color:#191A23}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{border-radius:14px!important;border-color:var(--edge)!important}
.note{border-radius:18px;border:1px solid var(--edge)}
.toast{background:#191A23!important;color:#B9FF66!important;border-radius:14px!important}
.gate .card{box-shadow:0 6px 0 #B9FF66}

/* ===== menu igual ao do painel: barra de baixo no celular, lateral no computador ===== */
.top,.tabs{display:none!important}
.mtop{position:sticky;top:0;z-index:6;background:#191A23;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.mtop b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.mtop .sp{flex:1}
.mtop button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.pnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--edge);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:500;text-decoration:none;min-width:0}
.pnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pnav svg,.pside svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pnav a.on{color:var(--fg);font-weight:600}
.pnav a.on svg{background:#B9FF66;color:#191A23;border-radius:8px;padding:2px;box-sizing:content-box;margin:-2px}
.pside{display:none}
main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
.ph{margin:6px 0 14px}
.ph h1{font-size:32px;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.subtabs{display:flex;gap:8px;margin:0 0 14px}
.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))!important}
@media (min-width:900px){
  .mtop,.pnav{display:none}
  .pside{display:flex;flex-direction:column;gap:18px;position:fixed;top:0;bottom:0;left:0;width:248px;background:#191A23;color:#fff;padding:28px 14px 20px;z-index:10}
  .pside .brand{padding:0 0 0 0}
  .pside .brand b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
  .pside .brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:2px}
  .pside nav{display:flex;flex-direction:column;gap:4px}
  .pside a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.72);text-decoration:none;font-size:15px;font-weight:500}
  .pside a:hover{background:rgba(255,255,255,.07);color:#fff}
  .pside a.on{background:#B9FF66;color:#191A23;font-weight:600}
  .pside .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:13px;font-weight:600}
  .pside .foot button{display:block;width:100%;margin-top:12px;background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;padding:9px;font:inherit;cursor:pointer}
  main{margin-left:248px!important;max-width:none!important;padding:36px 40px 48px!important}
  .ph h1{font-size:44px}
  .toast{bottom:28px!important}
}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://ovynkeifzhavhjdkjjui.supabase.co',SB_KEY='sb_publishable_7RunIjZPQDCuWNSuPrD10w_Gy_lIUFl';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const isMobile=/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));

const STATUS={novo:'Novo',enviado:'Mensagem enviada',respondeu:'Respondeu',interessada:'Interessada',fechou:'Fechou',sem_interesse:'Sem interesse'};
const STAG={novo:'',enviado:'acc',respondeu:'warn',interessada:'hot',fechou:'ok',sem_interesse:'bad'};
const DEF={
  seu_nome:'Éder Henrique',
  limite:'25',
  abordagem:'Olá, equipe da {otica}! Tudo bem?\n\nSou o {seu_nome}, desenvolvo apps personalizados para empresas.\n\nMontei um protótipo de teste do nosso sistema de cobrança para óticas (carnê, Pix e lembrete de parcelas no WhatsApp), já com o nome de vocês. Dá uma olhada:\n{link}\n\nSe gostar, finalizamos com a logo e as cores da {otica}, um sistema só de vocês. Posso te mostrar como funciona?',
  followup:'Oi, pessoal da {otica}! Passando só para saber se conseguiram dar uma olhada na demonstração do sistema de cobrança:\n{link}\n\nSe fizer sentido, te mostro rapidinho por aqui mesmo.'
};

const st={tab:'crm',user:null,admin:false,leads:[],cfg:{},ac:{},loaded:false,
  q:'óticas em Recife',res:[],next:null,busy:false,sel:{},serr:'',noKey:false,
  f:'todos',fq:'',open:null};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const cfg=k=>(st.cfg[k]!=null&&String(st.cfg[k]).trim()!=='')?st.cfg[k]:DEF[k];

/* ---------- telefone ---------- */
function digits(s){return String(s||'').replace(/\D/g,'')}
function brNumber(s){let d=digits(s);if(!d)return '';if(d.startsWith('0'))d=d.replace(/^0+/,'');if(!d.startsWith('55'))d='55'+d;return d}
function tipoFone(s){const d=brNumber(s);if(d.length===13&&d[4]==='9')return 'cel';if(d.length===12)return 'fixo';return d?'outro':''}
function fmtFone(s){const d=brNumber(s).slice(2);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return s||''}
const foneDe=l=>l.whatsapp||l.telefone;
function waUrl(num,text){const n=brNumber(num);return isMobile?'whatsapp://send?phone='+n+'&text='+encodeURIComponent(text):'https://web.whatsapp.com/send?phone='+n+'&text='+encodeURIComponent(text)}

/* ---------- mensagem ---------- */
const demoLink=(l,meu)=>location.origin+'/demo/?o='+encodeURIComponent(l.nome)+(meu?'':'&l='+l.id);
const fmtDH=iso=>{const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const acessos=l=>st.ac[l.id]||[];
function msg(kind,l){return cfg(kind).replace(/\{otica\}/g,l.nome).replace(/\{link\}/g,demoLink(l)).replace(/\{cidade\}/g,l.cidade||'').replace(/\{seu_nome\}/g,cfg('seu_nome')||'').replace(/\n{3,}/g,'\n\n')}

/* ---------- dados ---------- */
async function load(){
  const [lr,cr,ar]=await Promise.all([sb.from('prosp_leads').select('*').order('criado_em',{ascending:false}),sb.from('prosp_config').select('*'),sb.from('prosp_acessos').select('lead_id,em,aparelho').order('em',{ascending:false}).limit(5000)]);
  if(lr.error){toast('Erro ao carregar: '+lr.error.message);return}
  st.leads=lr.data||[];st.cfg={};(cr.data||[]).forEach(r=>st.cfg[r.chave]=r.valor);
  st.ac={};((ar&&ar.data)||[]).forEach(a=>{(st.ac[a.lead_id]=st.ac[a.lead_id]||[]).push(a)});
  st.loaded=true;const qt=new URLSearchParams(location.search).get('tab');if(qt&&['crm','buscar','msg'].includes(qt))st.tab=qt;else if(!st.leads.length)st.tab='buscar';render();
}
async function upd(id,patch){
  patch.atualizado_em=new Date().toISOString();
  const l=st.leads.find(x=>x.id===id);Object.assign(l,patch);render();
  const r=await sb.from('prosp_leads').update(patch).eq('id',id);
  if(r.error)toast('Não salvou: '+r.error.message);
}
function hist(l,txt){return [...(l.historico||[]),{em:new Date().toISOString(),txt}]}

/* ---------- busca no Google ---------- */
function noCrm(){const ids=new Set(),fones=new Set();st.leads.forEach(l=>{if(l.place_id)ids.add(l.place_id);[l.telefone,l.whatsapp].forEach(f=>{const d=brNumber(f);if(d)fones.add(d)})});return p=>ids.has(p.place_id)||(p.telefone&&fones.has(brNumber(p.telefone)))}
async function buscar(more){
  if(st.busy)return;st.busy=true;st.serr='';if(!more){st.res=[];st.next=null;st.sel={}}render();
  try{
    const {data,error}=await sb.functions.invoke('places-search',{body:{query:st.q,pageToken:more?st.next:undefined}});
    if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
    st.noKey=false;st.res=st.res.concat(data.places||[]);st.next=data.nextPageToken;
    const ja=noCrm();
    (data.places||[]).forEach(p=>{if(!ja(p)&&tipoFone(p.telefone)==='cel'&&!p.site)st.sel[p.place_id]=true});
  }catch(e){if(/SEM_CHAVE/.test(e.message))st.noKey=true;else st.serr=e.message}
  st.busy=false;render();
}
async function addSel(){
  const ja=noCrm();
  const rows=st.res.filter(p=>st.sel[p.place_id]&&!ja(p)).map(p=>({place_id:p.place_id,nome:p.nome,telefone:p.telefone,whatsapp:tipoFone(p.telefone)==='cel'?p.telefone:null,endereco:p.endereco,cidade:p.cidade,site:p.site||null,maps_url:p.maps_url,nota:p.nota,avaliacoes:p.avaliacoes,historico:[{em:new Date().toISOString(),txt:'Adicionada pela busca "'+st.q+'"'}]}));
  if(!rows.length)return toast('Marque pelo menos uma ótica nova');
  const r=await sb.from('prosp_leads').upsert(rows,{onConflict:'place_id',ignoreDuplicates:true}).select();
  if(r.error)return toast('Erro: '+r.error.message);
  st.leads=(r.data||[]).concat(st.leads);st.sel={};toast(rows.length+' ótica(s) adicionada(s) ao CRM');render();
}

/* ---------- ações do CRM ---------- */
const enviadosHoje=()=>st.leads.filter(l=>l.enviado_em&&l.enviado_em.slice(0,10)===new Date().toISOString().slice(0,10)).length;
function enviar(id,kind){
  const l=st.leads.find(x=>x.id===id);const f=foneDe(l);
  if(!f)return toast('Essa ótica não tem telefone. Adicione o WhatsApp no cartão.');
  if(!cfg('seu_nome'))return toast('Coloque seu nome na aba Mensagens antes de enviar'),go('msg');
  const lim=+cfg('limite')||0;
  if(kind==='abordagem'&&lim&&enviadosHoje()>=lim&&!confirm('Você já enviou '+enviadosHoje()+' abordagens hoje (seu limite é '+lim+'). Mandar muitas para quem não te conhece aumenta o risco de bloqueio do WhatsApp. Enviar mesmo assim?'))return;
  window.open(waUrl(f,msg(kind,l)),isMobile?'_self':'_blank');
  const patch=kind==='abordagem'
    ?{status:l.status==='novo'?'enviado':l.status,enviado_em:new Date().toISOString(),follow_up:l.follow_up||addDays(3),historico:hist(l,'Abordagem enviada')}
    :{follow_up:addDays(4),historico:hist(l,'Follow-up enviado')};
  upd(id,patch);
}
function go(t){st.tab=t;st.open=null;try{history.replaceState(null,'','/prospectar?tab='+t)}catch(e){}render();scrollTo(0,0)}

/* ---------- telas ---------- */
const IC=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const NAV=[
  ['adm','Administração','/adm',IC('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>')],
  ['mensal','Mensalidades','/adm?tab=mensal',IC('<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4M8.5 14.5h3"/>')],
  ['buscar','Prospecção',null,IC('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>')],
  ['crm','CRM',null,IC('<rect x="3.5" y="4.5" width="5" height="15" rx="1.5"/><rect x="9.5" y="4.5" width="5" height="10" rx="1.5"/><rect x="15.5" y="4.5" width="5" height="6" rx="1.5"/>')]];
function render(){
  const a=$('#app');
  if(st.user===null)return a.innerHTML='<div class="empty">Carregando…</div>';
  if(!st.user)return a.innerHTML=gate();
  if(!st.admin)return a.innerHTML='<div class="gate"><div class="card"><h1>Sem acesso</h1><p class="muted">Essa área é só do administrador.</p><button class="btn" data-a="sair">Sair</button></div></div>';
  if(!st.loaded)return a.innerHTML='<div class="empty">Carregando leads…</div>';
  const sec=st.tab==='buscar'?'buscar':'crm';
  const item=n=>n[2]?'<a href="'+n[2]+'"'+(sec===n[0]?' class="on"':'')+'>'+n[3]+'<span>'+n[1]+'</span></a>':'<a href="/prospectar?tab='+n[0]+'" data-tab="'+n[0]+'"'+(sec===n[0]?' class="on" aria-current="page"':'')+'>'+n[3]+'<span>'+n[1]+'</span></a>';
  const head=st.tab==='buscar'?['Prospecção','Encontre óticas no Google Maps e adicione ao CRM']:['CRM','Óticas abordadas, follow-up e acessos ao demo'];
  const sub=st.tab==='buscar'?'':'<div class="subtabs"><button class="chip '+(st.tab==='crm'?'on':'')+'" data-tab="crm">Óticas ('+st.leads.length+')</button><button class="chip '+(st.tab==='msg'?'on':'')+'" data-tab="msg">Mensagens</button></div>';
  a.innerHTML='<aside class="pside"><div class="brand"><b>Adm Óticas</b><small>Controle geral</small></div><nav>'+NAV.map(item).join('')+'</nav><div class="foot"><div>'+esc((st.user&&st.user.email)||'')+'</div><button data-a="sair">Sair</button></div></aside>'+
   '<header class="mtop"><b>Adm Óticas</b><span class="sp"></span><button data-a="sair">Sair</button></header>'+
   '<main><div class="ph"><h1>'+head[0]+'</h1><p>'+head[1]+'</p></div>'+sub+(st.tab==='buscar'?vBuscar():st.tab==='msg'?vMsg():vCrm())+'</main>'+
   '<nav class="pnav" aria-label="Seções">'+NAV.map(item).join('')+'</nav>';
}
function gate(){return '<div class="gate"><div class="card"><h1>Prospecção</h1><p class="muted small" style="margin:0">Entre com o mesmo e-mail e senha do painel administrativo.</p><input type="email" id="g-e" placeholder="E-mail" autocomplete="username"><input type="password" id="g-p" placeholder="Senha" autocomplete="current-password"><div class="err" id="g-err"></div><button class="btn pri" data-a="entrar">Entrar</button></div></div>'}

function vBuscar(){
  const ja=noCrm(),novos=st.res.filter(p=>!ja(p)),ocultas=st.res.length-novos.length;
  let h='<div class="card"><div class="row"><input type="text" id="q" class="grow" value="'+esc(st.q)+'" placeholder="ex.: óticas em Olinda, óticas Boa Viagem Recife"><button class="btn pri" data-a="buscar" '+(st.busy?'disabled':'')+'>'+(st.busy?'Buscando…':'Buscar')+'</button></div>'+
    '<p class="muted small" style="margin:8px 0 0">Dica: busque por bairro ("óticas em Casa Amarela Recife") para achar lojas que a busca da cidade inteira não mostra.</p></div>';
  if(st.noKey)h+='<div class="note warn sec"><b>Falta a chave do Google.</b> Siga o passo a passo que te mandei no chat e depois busque de novo.</div>';
  if(st.serr)h+='<div class="note warn sec">'+esc(st.serr)+'</div>';
  if(st.res.length){
    const n=novos.filter(p=>st.sel[p.place_id]).length;
    h+='<div class="row sec"><span class="grow muted small">'+novos.length+' ótica(s) nova(s)'+(ocultas?' · '+ocultas+' já estão no CRM e não aparecem aqui':'')+'. Marquei as que têm celular e não têm site.</span><button class="btn pri" data-a="add" '+(n?'':'disabled')+'>Adicionar '+n+' ao CRM</button></div><div class="list two">';
    if(!novos.length)h+='<div class="empty">Todas as óticas desta busca já estão no seu CRM.'+(st.next?' Toque em carregar mais ou busque outro bairro.':' Tente outro bairro ou cidade.')+'</div>';
    novos.forEach(p=>{
      const tf=tipoFone(p.telefone);
      h+='<div class="card res"><input type="checkbox" data-sel="'+esc(p.place_id)+'" '+(st.sel[p.place_id]?'checked':'')+'><div class="grow"><b>'+esc(p.nome)+'</b><div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">'+
        (tf==='cel'?'<span class="tag ok">Celular</span>':tf==='fixo'?'<span class="tag warn">Fixo</span>':'<span class="tag bad">Sem telefone</span>')+
        (p.site?'<span class="tag">Tem site</span>':'<span class="tag hot">Sem site</span>')+
        (p.nota?'<span class="tag">★ '+p.nota+' · '+p.avaliacoes+'</span>':'')+
        '</div><div class="small muted">'+esc(fmtFone(p.telefone))+(p.telefone?' · ':'')+esc(p.endereco)+'</div></div></div>';
    });
    h+='</div>';
    if(st.next)h+='<div class="row sec" style="justify-content:center"><button class="btn" data-a="mais" '+(st.busy?'disabled':'')+'>Carregar mais resultados</button></div>';
  }else if(!st.busy&&!st.noKey&&!st.serr)h+='<div class="empty">Busque uma cidade ou bairro para encontrar óticas.</div>';
  return h;
}

function vCrm(){
  const c={};st.leads.forEach(l=>c[l.status]=(c[l.status]||0)+1);
  const fu=st.leads.filter(l=>l.follow_up&&l.follow_up<=today()&&['enviado','respondeu','interessada'].includes(l.status));
  const ab=st.leads.filter(l=>acessos(l).length&&!['fechou','sem_interesse'].includes(l.status)).sort((a,b)=>acessos(b)[0].em.localeCompare(acessos(a)[0].em));
  const totAc=st.leads.reduce((n,l)=>n+acessos(l).length,0);
  let h='<div class="stats">'+
    '<div class="stat"><b>'+enviadosHoje()+'<span style="font-size:14px"> / '+(cfg('limite')||'∞')+'</span></b><span>Abordagens hoje</span></div>'+
    '<button class="stat" data-f="abriu" style="text-align:left;cursor:pointer"><b>'+ab.length+'</b><span>Abriram o demo · '+totAc+' acessos</span></button>'+
    '<div class="stat"><b>'+fu.length+'</b><span>Follow-up para hoje</span></div>'+
    '<div class="stat"><b>'+((c.interessada||0))+'</b><span>Interessadas</span></div>'+
    '<div class="stat"><b>'+(c.fechou||0)+'</b><span>Fecharam</span></div></div>';
  if(!st.leads.length)return h+'<div class="empty">Nenhuma ótica no CRM ainda.<br><br><button class="btn pri" data-tab="buscar">Buscar óticas</button></div>';
  const chip=(k,n,x)=>'<button class="chip '+(st.f===k?'on':'')+'" data-f="'+k+'">'+n+' '+x+'</button>';
  h+='<input type="text" id="fq" placeholder="Procurar por nome, bairro ou telefone" value="'+esc(st.fq)+'">';
  h+='<div class="chips">'+chip('todos','Todas',st.leads.length)+chip('hoje','Follow-up hoje',fu.length)+chip('abriu','👀 Abriram o demo',ab.length)+Object.keys(STATUS).map(k=>chip(k,STATUS[k],c[k]||0)).join('')+'</div>';
  const q=st.fq.trim().toLowerCase();
  let L=st.f==='todos'?st.leads:st.f==='hoje'?fu:st.f==='abriu'?ab:st.leads.filter(l=>l.status===st.f);
  if(q)L=L.filter(l=>(l.nome+' '+(l.endereco||'')+' '+digits(foneDe(l))).toLowerCase().includes(q));
  if(st.f==='abriu')h+='<p class="small muted" style="margin:8px 0 0">Óticas que abriram o link, da mais recente para a mais antiga. Só contam acessos reais: os seus, a prévia do WhatsApp e recarregar a página em menos de 30 min ficam de fora.</p>';
  if(!L.length)return h+'<div class="empty">'+(st.f==='abriu'?'Nenhuma ótica abriu o demo ainda.':'Nada aqui.')+'</div>';
  h+='<div class="list two">'+L.map(cardLead).join('')+'</div>';
  return h;
}
function cardLead(l){
  const op=st.open===l.id,tf=tipoFone(foneDe(l)),late=l.follow_up&&l.follow_up<=today()&&['enviado','respondeu','interessada'].includes(l.status);
  let h='<div class="card lead"><div class="row"><h2 class="grow">'+esc(l.nome)+'</h2><span class="tag '+STAG[l.status]+'">'+STATUS[l.status]+'</span></div><div class="meta">'+
    (acessos(l).length?'<span class="tag hot">👀 '+acessos(l).length+(acessos(l).length>1?' acessos':' acesso')+' ao demo · último '+fmtDH(acessos(l)[0].em)+'</span>':l.status!=='novo'?'<span class="tag">Ainda não abriu o demo</span>':'')+
    (late?'<span class="tag warn">Follow-up '+(l.follow_up<today()?'atrasado':'hoje')+'</span>':l.follow_up&&l.status!=='fechou'&&l.status!=='sem_interesse'?'<span class="tag">Follow-up '+fmtD(l.follow_up)+'</span>':'')+
    (tf==='fixo'?'<span class="tag warn">Fixo</span>':'')+(!foneDe(l)?'<span class="tag bad">Sem telefone</span>':'')+
    (l.site?'<span class="tag">Tem site</span>':'')+(l.nota?'<span class="tag">★ '+l.nota+' · '+l.avaliacoes+'</span>':'')+
    '</div><div class="small muted" style="margin:-4px 0 10px">'+esc(fmtFone(foneDe(l)))+(foneDe(l)?' · ':'')+esc(l.endereco||'')+'</div><div class="acts">';
  h+=l.status==='novo'?'<button class="btn wa sm" data-env="'+l.id+'" data-k="abordagem">Enviar abordagem</button>':
     ['enviado','respondeu','interessada'].includes(l.status)?'<button class="btn wa sm" data-env="'+l.id+'" data-k="followup">Enviar follow-up</button>':'';
  if(l.status==='enviado')h+='<button class="btn sm" data-st="'+l.id+'" data-v="respondeu">Respondeu</button>';
  if(l.status==='respondeu')h+='<button class="btn sm" data-st="'+l.id+'" data-v="interessada">Interessada</button>';
  if(l.status==='interessada')h+='<button class="btn sm" data-st="'+l.id+'" data-v="fechou">Fechou</button>';
  if(l.status==='fechou')h+='<a class="btn pri sm" href="/adm?nova=1&nome='+encodeURIComponent(l.nome)+'&whats='+encodeURIComponent(fmtFone(foneDe(l))||'')+'">Cadastrar como cliente</a>';
  h+='<button class="btn sm" data-open="'+l.id+'">'+(op?'Fechar':'Detalhes')+'</button></div>';
  if(op){
    h+='<div class="more">'+
      '<div><label>Status</label><select data-upd="'+l.id+'" data-fld="status">'+Object.keys(STATUS).map(k=>'<option value="'+k+'" '+(l.status===k?'selected':'')+'>'+STATUS[k]+'</option>').join('')+'</select></div>'+
      '<div><label>Próximo follow-up</label><input type="date" data-upd="'+l.id+'" data-fld="follow_up" value="'+esc(l.follow_up||'')+'"></div>'+
      '<div class="full"><label>WhatsApp (se for diferente do telefone do Google)</label><input type="text" data-upd="'+l.id+'" data-fld="whatsapp" value="'+esc(l.whatsapp||'')+'" placeholder="(81) 9XXXX-XXXX"></div>'+
      '<div class="full"><label>Anotações</label><textarea data-upd="'+l.id+'" data-fld="notas" style="min-height:70px" placeholder="Quem atendeu, o que perguntou, quantas lojas…">'+esc(l.notas||'')+'</textarea></div>'+
      '<div class="full acts"><button class="btn sm" data-copy="'+l.id+'">Copiar link do demo</button><a class="btn sm" href="'+esc(demoLink(l,true))+'" target="_blank" rel="noopener">Ver demo</a>'+(l.maps_url?'<a class="btn sm" href="'+esc(l.maps_url)+'" target="_blank" rel="noopener">Google Maps</a>':'')+(l.site?'<a class="btn sm" href="'+esc(l.site)+'" target="_blank" rel="noopener">Site</a>':'')+(l.status!=='novo'?'<button class="btn sm" data-env="'+l.id+'" data-k="abordagem">Reenviar abordagem</button>':'')+'<button class="btn sm" data-del="'+l.id+'" style="color:var(--bad)">Remover</button></div>'+
      '<div class="full"><label>Acessos ao demo</label>'+(acessos(l).length?'<div class="acs">'+acessos(l).map((a,i)=>'<div><b>'+(acessos(l).length-i)+'º</b> '+fmtDH(a.em)+(a.aparelho?' · '+esc(a.aparelho):'')+'</div>').join('')+'</div>':'<div class="small muted">Nenhum acesso ainda.</div>')+'</div>'+
      '<div class="full small muted">'+(l.historico||[]).slice().reverse().map(x=>fmtD(x.em.slice(0,10))+' '+x.em.slice(11,16)+' — '+esc(x.txt)).join('<br>')+'</div></div>';
  }
  return h+'</div>';
}

function vMsg(){
  const ex={id:'00000000-0000-0000-0000-000000000000',nome:'Ótica Exemplo',cidade:'Recife'};
  const f=(k,lbl,area,ph)=>'<div class="fld" style="margin-bottom:10px"><label>'+lbl+'</label>'+(area?'<textarea data-cfg="'+k+'">'+esc(cfg(k))+'</textarea>':'<input type="text" data-cfg="'+k+'" value="'+esc(st.cfg[k]||DEF[k]||'')+'" placeholder="'+esc(ph||'')+'">')+'</div>';
  return '<div class="card">'+f('seu_nome','Seu nome (aparece na mensagem)',0,'ex.: Henrique')+f('limite','Limite de abordagens por dia (aviso)',0,'25')+

    '<div class="sec"><h2>Primeira mensagem</h2><div class="card">'+f('abordagem','Texto',1)+'<label class="small muted">Prévia</label><div class="prev">'+esc(msg('abordagem',ex))+'</div></div></div>'+
    '<div class="sec"><h2>Follow-up</h2><div class="card">'+f('followup','Texto',1)+'<label class="small muted">Prévia</label><div class="prev">'+esc(msg('followup',ex))+'</div></div></div>'+
    '<div class="row sec"><button class="btn pri" data-a="salvarcfg">Salvar mensagens</button><button class="btn" data-a="padrao">Voltar ao texto padrão</button></div>';
}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-tab]');if(!b)return;const d=b.dataset;
  if(d.tab){e.preventDefault();return go(d.tab)}
  if(d.f){st.f=d.f;return render()}
  if(d.open){st.open=st.open===d.open?null:d.open;return render()}
  if(d.env)return enviar(d.env,d.k);
  if(d.st){const l=st.leads.find(x=>x.id===d.st);return upd(d.st,{status:d.v,historico:hist(l,'Status: '+STATUS[d.v]),follow_up:d.v==='fechou'?null:l.follow_up})}
  if(d.copy){const l=st.leads.find(x=>x.id===d.copy);try{await navigator.clipboard.writeText(demoLink(l));toast('Link copiado')}catch(x){prompt('Copie o link:',demoLink(l))}return}
  if(d.del){if(!confirm('Remover essa ótica do CRM?'))return;const r=await sb.from('prosp_leads').delete().eq('id',d.del);if(r.error)return toast(r.error.message);st.leads=st.leads.filter(l=>l.id!==d.del);return render()}
  switch(d.a){
    case 'entrar':{const r=await sb.auth.signInWithPassword({email:$('#g-e').value.trim(),password:$('#g-p').value});if(r.error){$('#g-err').textContent='E-mail ou senha incorretos.';return}return boot()}
    case 'sair':await sb.auth.signOut();st.user=false;st.loaded=false;return render();
    case 'buscar':st.q=$('#q').value;return buscar(false);
    case 'mais':return buscar(true);
    case 'add':return addSel();
    case 'salvarcfg':{const rows=[...document.querySelectorAll('[data-cfg]')].map(i=>({chave:i.dataset.cfg,valor:i.value}));const r=await sb.from('prosp_config').upsert(rows);if(r.error)return toast(r.error.message);rows.forEach(x=>st.cfg[x.chave]=x.valor);toast('Mensagens salvas');return render()}
    case 'padrao':st.cfg.abordagem='';st.cfg.followup='';await sb.from('prosp_config').upsert([{chave:'abordagem',valor:''},{chave:'followup',valor:''}]);toast('Texto padrão restaurado');return render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){st.sel[t.dataset.sel]=t.checked;return render()}
  if(t.dataset.upd){const l=st.leads.find(x=>x.id===t.dataset.upd),f=t.dataset.fld,v=t.value||null;const p={[f]:v};if(f==='status')p.historico=hist(l,'Status: '+STATUS[v]);upd(l.id,p)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){st.fq=t.value;const pos=t.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='q'){st.q=e.target.value;buscar(false)}
  if(e.target.id==='g-p'||e.target.id==='g-e')document.querySelector('[data-a=entrar]').click();
});

async function boot(){
  const {data}=await sb.auth.getSession();
  st.user=data.session?data.session.user:false;
  if(st.user){const r=await sb.rpc('sou_admin');st.admin=r.data===true;if(st.admin){load();aoVivo()}}
  render();
}
boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.admin&&st.loaded)recarregar(300)});
/* aviso na hora quando uma ótica abre o demo */
let vivo=null,vt=0,vp=false;
const digitando=()=>{const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
function recarregar(ms){clearTimeout(vt);vt=setTimeout(()=>{if(digitando()||st.busy){vp=true;return recarregar(2500)}vp=false;const y=scrollY;load().then(()=>scrollTo(0,y))},ms==null?1200:ms)}
document.addEventListener('focusout',()=>{if(vp)recarregar(600)});
function aoVivo(){if(vivo||!st.admin)return;vivo=sb.channel('crm-ao-vivo')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'prosp_acessos'},p=>{const l=st.leads.find(x=>x.id===p.new.lead_id);toast('👀 '+((l&&l.nome)||'Uma ótica')+' abriu o demo agora');recarregar(300)})
  .on('postgres_changes',{event:'*',schema:'public',table:'prosp_leads'},()=>recarregar())
  .subscribe()}
</script>
<script>
/* avisa quando há uma versão nova do sistema publicada (o app da tela de início fica aberto por dias) */
(function(){
  var base=null,ult=0,avisado=false;
  function hash(t){var h=0;for(var i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return h}
  function pegar(){return fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null}).then(function(t){return t?hash(t):null}).catch(function(){return null})}
  function aviso(){
    if(avisado)return;avisado=true;
    var b=document.createElement('button');b.type='button';b.id='nova-versao';
    b.textContent='Nova versão do sistema disponível · toque para atualizar';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:200;background:#191A23;color:#B9FF66;border:0;border-radius:14px;padding:12px 16px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 0 #B9FF66;max-width:calc(100% - 32px)';
    b.onclick=function(){location.reload()};document.body.appendChild(b);
  }
  function checar(){
    var agora=Date.now();if(agora-ult<5*60*1000)return;ult=agora;
    pegar().then(function(h){if(h==null)return;if(base==null){base=h;return}if(h!==base)aviso()});
  }
  window.addEventListener('load',function(){setTimeout(function(){ult=0;checar()},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checar()});
  setInterval(function(){if(!document.hidden)checar()},10*60*1000);
})();
</script>
