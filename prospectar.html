<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A3C">
<meta name="robots" content="noindex,nofollow">
<title>Prospecção · Connecta AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Painel de dados (estilo BI): canvas frio, menu grafite, um único destaque dourado para o que está ativo */
:root{
  --bg:#EEF1F6;--surface:#fff;--surface-2:#F5F7FA;--fg:#1A2333;--muted:#5E6B80;--line:#DCE2EC;--line-2:#C9D2E0;
  --nav:#1F2A3C;--nav-fg:#C4CDDB;--gold:#F2C811;--gold-ink:#3A3000;
  --accent:#3B6FD9;--accent-fg:#fff;--accent-soft:#E6EDFB;
  --ok:#1E7B4F;--ok-bg:#E2F3EA;--warn:#8A5F00;--warn-bg:#FBF0CF;--bad:#B4362A;--bad-bg:#FBE5E2;--hot:#6A45D9;--hot-bg:#EEE8FE;
  --wa:#1E7B4F;--wa-fg:#fff;
  --s1:#3B6FD9;--s2:#2BA19A;--s3:#F2C811;--s4:#7A5AF8;--s5:#1E7B4F;--s6:#E4573D;
  --r:6px;--shadow:0 1px 2px rgba(26,35,51,.06),0 1px 1px rgba(26,35,51,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121925;--surface:#1A2333;--surface-2:#202B3D;--fg:#E4E9F1;--muted:#97A3B6;--line:#2B374B;--line-2:#3A475D;
  --nav:#0E141F;--nav-fg:#A9B4C6;--accent:#6D97EE;--accent-fg:#0E141F;--accent-soft:#22324F;
  --ok:#5CC492;--ok-bg:#16362A;--warn:#E8C25A;--warn-bg:#3A3014;--bad:#F08A7C;--bad-bg:#3D1F1B;--hot:#A58BFF;--hot-bg:#2C2550;
  --wa:#2E9A63;--s1:#6D97EE;--s2:#47C1B8;--s4:#A58BFF;--s5:#5CC492;--s6:#F08A7C;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.45 'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-weight:600;margin:0;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top,.tabs{display:none}
main{max-width:1440px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:110px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.wa{background:var(--wa);color:var(--wa-fg);border-color:var(--wa)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--muted);font-weight:500;border:1px solid var(--line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.tag.hot{background:var(--hot-bg);color:var(--hot);border-color:transparent}.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
/* faixa de indicadores: um só painel dividido, como os cartões de um relatório */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.stat{background:none;border:0;border-right:1px solid var(--line);padding:12px 16px 14px;text-align:left;font:inherit;color:inherit;position:relative}
.stat:last-child{border-right:0}
button.stat{cursor:pointer}button.stat:hover{background:var(--surface-2)}
.stat b{display:block;font:600 30px/1.1 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;letter-spacing:-.01em;margin-top:4px}
.stat b span{font-size:15px;color:var(--muted);font-weight:500}
.stat>span{font-size:12.5px;color:var(--muted)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,transparent)}
.stat.k1{--k:var(--s1)}.stat.k2{--k:var(--gold)}.stat.k3{--k:var(--s2)}.stat.k4{--k:var(--s4)}.stat.k5{--k:var(--s5)}
.list{display:grid;gap:10px;margin-top:12px}
@media (min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
@media (min-width:1280px){.list.two{grid-template-columns:1fr 1fr 1fr}}
.lead{display:flex;flex-direction:column}
.lead h2{font-size:15.5px;font-weight:600}
.lead .meta{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.lead .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.lead .more{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:10px;grid-template-columns:1fr 1fr}
.lead .more .full{grid-column:1/-1}
.lead label,.fld label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-top:10px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:5px 11px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--fg)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:4px;padding:11px 14px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--gold)}
.note ol{margin:6px 0 0;padding-left:20px}
.note a{color:inherit;font-weight:600}
.gate{max-width:380px;margin:12vh auto;padding:0 16px}
.gate .card{display:grid;gap:10px;padding:22px;border-top:3px solid var(--gold)}
.err{color:var(--bad);font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);border-left:3px solid var(--gold)}
.toast.on{opacity:1}
.res{display:flex;gap:10px;align-items:flex-start}
.res input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.acs{display:grid;gap:4px;font-size:13px;max-height:180px;overflow:auto;background:var(--surface-2);border-radius:4px;padding:8px 10px}
.prev{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:14px}
.sec{margin-top:18px}
.sec>h2,.card>h2{font-size:15px}
.sec>h2{margin-bottom:8px}
.fld{margin-bottom:10px}
/* visuais */
.viz{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-bottom:14px}
@media (min-width:1000px){.viz{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.vz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px 14px;min-width:0}
.vz h3{margin:0 0 2px;font-size:14px;font-weight:600}
.vz .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.fun{display:grid;gap:7px}
.fun button{display:grid;grid-template-columns:136px minmax(0,1fr) 40px;align-items:center;gap:10px;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;font-size:13px;color:var(--fg)}
.fun button:hover .bar i{filter:brightness(1.08)}
.fun .bar{height:18px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.fun .bar i{display:block;height:100%;background:var(--c,var(--s1));min-width:2px}
.fun b{text-align:right;font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15px}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line-2);padding-top:8px}
.cols div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%;position:relative}
.cols i{flex:1;background:var(--s1);border-radius:2px 2px 0 0;min-height:1px}
.cols i.b{background:var(--gold)}
.cols div:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;font-size:12px;padding:3px 7px;border-radius:3px;white-space:nowrap;z-index:2}
.axis{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:4px}.axis span{flex:1;text-align:center}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* conversas */
.zap{display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;height:min(74vh,760px)}
@media (min-width:900px){.zap{grid-template-columns:340px minmax(0,1fr)}}
.zl{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.zl .zf{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.zl .zs{overflow:auto;flex:1}
.zi{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;align-items:center;color:var(--fg)}
.zi:hover{background:var(--surface-2)}.zi.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--gold)}
.zi .av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.zi .tx{min-width:0;flex:1;display:grid;gap:2px}
.zi .l1,.zi .l2{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.zi .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}.zi .l1 small{color:var(--muted);flex:none;font-size:12px}
.zi .l2 span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zi .n{flex:none;background:var(--gold);color:var(--gold-ink);font-size:11.5px;font-weight:600;border-radius:9px;padding:1px 7px}
.zm{display:flex;flex-direction:column;min-height:0;min-width:0}
.zh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.zt{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.zb{max-width:76%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 8px 2px;padding:7px 10px}
.zb.eu{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:8px 8px 2px 8px}
.zb.pend{opacity:.7}
.zb .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.zb small{display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:2px}
.zd{text-align:center;margin:8px 0}.zd span{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 10px}
.ze{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
.ze .row textarea{min-height:46px;max-height:320px;flex:1}
.zback{display:none}
@media (max-width:899px){.zl.tem{display:none}.zl:not(.tem)+.zm.vazio{display:none}.zback{display:inline-flex}.zap{height:calc(100dvh - 230px);min-height:440px}}
/* menu: barra de baixo no celular, lateral no computador */
.mtop{position:sticky;top:0;z-index:6;background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:11px 16px;padding-top:max(11px,env(safe-area-inset-top));border-bottom:2px solid var(--gold)}
.mtop b{font-size:17px;font-weight:600}
.mtop .sp{flex:1}
.mtop button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:4px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.pnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--nav);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--nav-fg);font-size:11px;font-weight:500;text-decoration:none;min-width:0;border-top:2px solid transparent}
.pnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pnav svg,.pside svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pnav a.on{color:#fff;border-top-color:var(--gold)}
.pside{display:none}
.ph{margin:4px 0 14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:24px;line-height:1.15}
.ph p{margin:3px 0 0;color:var(--muted);font-size:14px}
.subtabs{display:flex;gap:0;margin:0 0 14px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.subtabs .chip{border:0;border-radius:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-size:14px;font-weight:500}
.subtabs .chip.on{background:none;color:var(--fg);border-bottom-color:var(--gold)}
.subtabs .chip .n{background:var(--gold);color:var(--gold-ink);font-size:11.5px;border-radius:9px;padding:0 6px;margin-left:5px;font-weight:600}
@media (min-width:900px){
  .mtop,.pnav{display:none}
  .pside{display:flex;flex-direction:column;gap:20px;position:fixed;top:0;bottom:0;left:0;width:232px;background:var(--nav);color:#fff;padding:22px 12px 18px;z-index:10}
  .pside .brand{padding:0 10px}
  .pside .brand b{display:block;font-size:18px;font-weight:600}
  .pside .brand small{display:block;font-size:12.5px;color:var(--nav-fg);margin-top:2px}
  .pside nav{display:flex;flex-direction:column;gap:2px}
  .pside a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:4px;color:var(--nav-fg);text-decoration:none;font-size:14px;font-weight:500;border-left:3px solid transparent}
  .pside a:hover{background:rgba(255,255,255,.06);color:#fff}
  .pside a.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gold)}
  .pside .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 10px 0;font-size:12.5px;color:var(--nav-fg)}
  .pside .foot button{display:block;width:100%;margin-top:10px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:7px;font:inherit;cursor:pointer}
  main{margin-left:232px;padding:24px 28px 40px}
  .ph h1{font-size:26px}
  .toast{bottom:24px}
}
/* filtros do CRM: blocos maiores com o número em destaque */
.ftiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.ftile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;cursor:pointer;text-align:left;color:var(--fg);position:relative;box-shadow:var(--shadow);min-height:78px}
.ftile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fc);border-radius:var(--r) 0 0 var(--r)}
.ftile b{font:600 26px/1.1 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
.ftile span{font-size:13.5px;color:var(--muted);font-weight:500}
.ftile:hover{border-color:var(--line-2);background:var(--surface-2)}
.ftile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ftile.on span{color:var(--fg)}
@media (max-width:520px){.ftiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ftile b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cx{padding:0!important}.cx>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;user-select:none}.cx>summary::-webkit-details-marker{display:none}.cx>summary h2{margin:0;flex:1;font-size:16px}.cx-i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--s,rgba(0,0,0,.05));flex:none;transition:transform .15s}.cx-i::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}.cx[open] .cx-i{transform:rotate(180deg)}.cx>.cx-b{padding:0 16px 16px}.cx:not([open])>summary:hover{background:rgba(0,0,0,.025)}
/* ===================== Redesign visual v3 (Connecta AI) – CRM =====================
   Só aparência; mesmas classes. Menu azul-marinho, um destaque azul, cantos e sombras iguais aos do sistema. */
:root{
  --bg:#F4F6FA;--surface:#fff;--surface-2:#EEF2F7;--fg:#0E1A2B;--muted:#5D6B80;--line:#E2E7EF;--line-2:#D3DAE5;
  --nav:#0B1424;--nav-fg:rgba(255,255,255,.7);--gold:#F5A524;--gold-ink:#3A2600;--navsel:#6FB1FF;
  --accent:#1E5BD8;--accent-fg:#fff;--accent-soft:#E6EEFC;
  --ok:#11784A;--ok-bg:#E5F4EC;--warn:#935F00;--warn-bg:#FBF0D9;--bad:#C0352B;--bad-bg:#FCE8E6;
  --wa:#178A52;--s1:#1E5BD8;--s3:#F5A524;
  --r:12px;--shadow:0 1px 2px rgba(15,25,45,.04);--sh1:0 1px 2px rgba(15,25,45,.04),0 6px 16px -8px rgba(15,25,45,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111E;--surface:#111A2A;--surface-2:#18233A;--fg:#E7EDF6;--muted:#97A5BB;--line:#223049;--line-2:#2C3C58;
  --nav:#070C16;--accent:#6FA4F5;--accent-fg:#06142C;--accent-soft:#16264A;
  --ok:#5CCB93;--ok-bg:#10301F;--warn:#E9B45A;--warn-bg:#352812;--bad:#F08A80;--bad-bg:#3A1714;--wa:#36B874;--s1:#6FA4F5;
  --shadow:0 1px 2px rgba(0,0,0,.3);--sh1:0 1px 2px rgba(0,0,0,.35),0 8px 20px -10px rgba(0,0,0,.55)}}
html,body{font:14.5px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.003em}
h1,h2,h3{font-weight:650;letter-spacing:-.018em}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.025em}
@media (min-width:900px){.ph h1{font-size:28px}}
.card,.vz,.zap,.stats,.ftile,.empty{border-radius:var(--r)}
.card{padding:16px 18px;border-color:var(--line)}
.btn{min-height:38px;border-radius:10px;padding:0 14px;font-weight:600;border-color:var(--line);box-shadow:var(--shadow);justify-content:center;transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 18%,var(--line));box-shadow:var(--sh1)}
.btn.sm{min-height:32px;padding:0 11px;border-radius:9px}

function digits(s){return String(s||'').replace(/\D/g,'')}
function brNumber(s){let d=digits(s);if(!d)return '';if(d.startsWith('0'))d=d.replace(/^0+/,'');if(!d.startsWith('55'))d='55'+d;return d}
function tipoFone(s){const d=brNumber(s);if(d.length===13&&d[4]==='9')return 'cel';if(d.length===12)return 'fixo';return d?'outro':''}
function fmtFone(s){const d=brNumber(s).slice(2);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return s||''}

function noCrm(){const ids=new Set(),fones=new Set();st.leads.concat(st.arq||[]).forEach(l=>{if(l.place_id)ids.add(l.place_id);[l.telefone,l.whatsapp].forEach(f=>{const d=brNumber(f);if(d)fones.add(d.slice(-8))})});return p=>ids.has(p.place_id)||(p.telefone&&fones.has(brNumber(p.telefone).slice(-8)))}
/* óticas da busca que ainda não estão no CRM (sem repetir telefone) */
function novasDaBusca(){const ja=noCrm(),vist=new Set(),out=[];st.res.forEach(p=>{if(ja(p))return;const k=p.telefone?brNumber(p.telefone).slice(-8):p.place_id;if(vist.has(k))return;vist.add(k);out.push(p)});return out}
/* o Google só devolve até 60 por busca: "Buscar mais" repete a busca com outras palavras para o mesmo lugar */
const VARS=['óticas em','ótica em','loja de óculos em','óculos de grau em','óptica em','lentes de contato em','optometrista em','óculos de sol em'];
function lugarDaBusca(q){const l=String(q||'').replace(/^\s*(ó|o|óp|op)ticas?\s+((em|de|no|na|do|da)\s+)?/i,'').trim();return l||String(q||'').trim()}
async function buscarMais(){
  if(st.busy)return;if(st.next)return buscar(true);
  st.vi=(st.vi||0);const lugar=lugarDaBusca(st.q0||st.q);const seg=segDaBusca(st.q0||st.q);
  const VS=seg?(()=>{const lg=String(st.q0||st.q).slice(seg.length).replace(/^\s*(em|no|na|perto de|próximo a|proximo a)\s+/i,'').trim()||'';return [seg+' em '+lg,seg+' '+lg+' centro',seg+' perto de '+lg,'melhores '+seg+' em '+lg].map(x=>x.trim())})():null;
  if(VS){if(st.vi>=VS.length)return toast('Já busquei com todas as variações. Tente um bairro ou cidade vizinha.');
    const antes0=novasDaBusca().length;st.busy=true;render();
    try{while(st.vi<VS.length&&novasDaBusca().length-antes0<10){const q=VS[st.vi++];let tok,pag=0;
      do{const {data,error}=await sb.functions.invoke('places-search',{body:{query:q,pageToken:tok}});if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
        const ids=new Set(st.res.map(x=>x.place_id));st.res=st.res.concat((data.places||[]).filter(x=>!ids.has(x.place_id)));tok=data.nextPageToken;pag++}while(tok&&pag<3)}
      novasDaBusca().forEach(p=>{if(st.sel[p.place_id]===undefined&&tipoFone(p.telefone)==='cel'&&!p.site)st.sel[p.place_id]=true});
      const n=novasDaBusca().length-antes0;toast(n?n+' empresa(s) nova(s) encontrada(s)':'Nenhuma empresa nova');}catch(e){st.serr=e.message}
    st.busy=false;render();return}
  if(st.vi>=VARS.length)return toast('Já busquei com todas as palavras para '+lugar+'. Tente um bairro ou cidade vizinha.');
  const antes=novasDaBusca().length;st.busy=true;render();
  try{
    while(st.vi<VARS.length&&novasDaBusca().length-antes<10){
      const q=VARS[st.vi++]+' '+lugar;let tok,pag=0;
      do{const {data,error}=await sb.functions.invoke('places-search',{body:{query:q,pageToken:tok}});
        if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
        const ids=new Set(st.res.map(x=>x.place_id));st.res=st.res.concat((data.places||[]).filter(x=>!ids.has(x.place_id)));tok=data.nextPageToken;pag++;
      }while(tok&&pag<3);
    }
    novasDaBusca().forEach(p=>{if(st.sel[p.place_id]===undefined&&tipoFone(p.telefone)==='cel'&&!p.site)st.sel[p.place_id]=true});
    const n=novasDaBusca().length-antes;toast(n?n+' ótica(s) nova(s) encontrada(s)':'Nenhuma ótica nova com essas palavras');
  }catch(e){st.serr=e.message}
  st.busy=false;render();
}
async function buscar(more){
  if(st.busy)return;st.busy=true;st.serr='';if(!more){st.res=[];st.next=null;st.sel={};st.vi=0;st.q0=st.q}render();
  try{
    // o Google devolve 20 por página (até 60): continua buscando sozinho enquanto a página só tiver óticas repetidas
    const antes=novasDaBusca().length;let pag=0;
    do{
      const {data,error}=await sb.functions.invoke('places-search',{body:{query:st.q,pageToken:(more||pag>0)?st.next:undefined}});
      if(error){let m=error.message;try{const b=await error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
      st.noKey=false;const ids=new Set(st.res.map(x=>x.place_id));st.res=st.res.concat((data.places||[]).filter(x=>!ids.has(x.place_id)));st.next=data.nextPageToken;pag++;
    }while(st.next&&pag<3&&novasDaBusca().length-antes<10);
    novasDaBusca().forEach(p=>{if(st.sel[p.place_id]===undefined&&tipoFone(p.telefone)==='cel'&&!p.site)st.sel[p.place_id]=true});
  }catch(e){if(/SEM_CHAVE/.test(e.message))st.noKey=true;else st.serr=e.message}
  st.busy=false;render();
}
async function addSel(){
  const lista=novasDaBusca();

  if(!rows.length)return toast('Marque pelo menos uma ótica nova');
  const r=await sb.from('prosp_leads').upsert(rows,{onConflict:'place_id',ignoreDuplicates:true}).select();
  if(r.error)return toast('Erro: '+r.error.message);
  st.leads=(r.data||[]).concat(st.leads);
  st.sel={};toast(rows.length+' ótica(s) adicionada(s) ao CRM. Elas não aparecem mais nas próximas buscas');render();
}

const MIDURL={};let midPend=new Set(),midT=0,midRepinta=null;

  if(!midT)midT=setTimeout(async()=>{midT=0;const ps=[...midPend];midPend.clear();let ok={};
    try{const r=await sb.storage.from('wa-midia').createSignedUrls(ps,3600);((r&&r.data)||[]).forEach(x=>{if(x&&x.signedUrl&&!x.error){ok[x.path]=1;MIDURL[x.path]={u:x.signedUrl,exp:Date.now()+3500e3}}})}catch(e){}
    ps.forEach(p=>{if(!ok[p])MIDURL[p]={u:'',exp:Date.now()+120000,erro:1}});if(midRepinta)midRepinta()},60);

async function campEnfileirar(){
  if(!cfg('seu_nome'))return toast('Coloque seu nome na aba Modelos de mensagem antes'),go('msg');

document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.agtseg){st.agt=agtNovo(+t.value||0);return render()}if(t&&t.dataset&&t.dataset.agdia){const c=t.closest('.chip');if(c)c.classList.toggle('on',t.checked);return}if(t&&t.dataset&&t.dataset.prevseg){document.querySelectorAll('[data-cfg]').forEach(i=>{if(i.value!==String(cfg(i.dataset.cfg)??''))st.cfg[i.dataset.cfg]=i.value});st.prevSeg=+t.value||0;const y=scrollY;render();scrollTo(0,y)}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-tab]');if(!b)return;const d=b.dataset;
  if(d.tab){e.preventDefault();return go(d.tab)}
  if(d.f){st.f=d.f;return render()}

  if(d.zk){st.zsel=d.zk;zLidas(d.zk);render();return setTimeout(zRolar,0)}
  if(d.zf){st.zf=d.zf;return render()}
  if(d.zback){st.zsel='';return render()}
  if(d.zenv)return zEnviar();
  if(d.zfu){const g=zConvs().find(x=>x.k===st.zsel);if(g&&g.lead){const v=msg(['followup','interesse','agradecimento'].includes(d.zfu)?d.zfu:'followup',g.lead);st.ztxt[g.k]=v;const ta=$('#ztxt');if(ta){ta.value=v;ta.style.height='auto';ta.style.height=Math.min(320,ta.scrollHeight+4)+'px';ta.focus();ta.setSelectionRange(0,0);ta.scrollTop=0}}return}
  if(d.fcancl)return cancelarLead(d.fcancl);
  if(d.st){const l=st.leads.find(x=>x.id===d.st);
    // interessada ou fechou: sai da campanha (cancela o que ainda estiver na fila)
    if(d.v==='interessada'||d.v==='fechou'){const fq=st.fila.filter(x=>x.lead_id===d.st&&x.tipo==='campanha'&&ATIVOS.includes(x.status));if(fq.length){sb.from('prosp_wa_fila').update({status:'cancelada',erro:'marcada como '+STATUS[d.v].toLowerCase()}).eq('lead_id',d.st).eq('tipo','campanha').in('status',ATIVOS).then(()=>{fq.forEach(x=>{x.status='cancelada'});render()})}}return upd(d.st,{status:d.v,historico:hist(l,'Status: '+STATUS[d.v]),follow_up:d.v==='fechou'?null:l.follow_up})}
  if(d.copysite){const l=st.leads.find(x=>x.id===d.copysite);try{await navigator.clipboard.writeText(siteLink(l));toast('Link do site copiado')}catch(x){prompt('Copie o link:',siteLink(l))}return}
  if(d.copy){const l=st.leads.find(x=>x.id===d.copy);const lk=ehOtica(l)?demoLink(l):agenteLink(l);try{await navigator.clipboard.writeText(lk);toast('Link copiado')}catch(x){prompt('Copie o link:',lk)}return}
  if(d.del){if(!confirm('Remover essa ótica do CRM?'))return;const r=await sb.from('prosp_leads').delete().eq('id',d.del);if(r.error)return toast(r.error.message);st.leads=st.leads.filter(l=>l.id!==d.del);return render()}

    case 'agtenviar':return agtEnviar();

    case 'agpausar':{const l=st.leads.find(x=>x.id===d.id);if(!l)return;await upd(l.id,{ag_estado:'pausado',historico:hist(l,'Agente de vendas pausado nesta conversa')});return toast('O agente não vai mais responder esta empresa')}
    case 'agretomar':{const l=st.leads.find(x=>x.id===d.id);if(!l)return;await upd(l.id,{ag_estado:null,historico:hist(l,'Agente de vendas retomado nesta conversa')});return toast('O agente volta a responder esta empresa')}

      const r=await sb.from('prosp_config').upsert(rows);if(r.error)return toast(r.error.message);rows.forEach(x=>st.cfg[x.chave]=x.valor);toast('Configuração salva');await loadFila();return render()}
    case 'wnuvem':{if(st.wst&&st.wst.tem_token&&!confirm('Ligar a nuvem desativa o programa do notebook (ele para de enviar). Continuar?'))return;const r=await sb.rpc('prosp_wa_nuvem_ligar');if(r.error)return toast(r.error.message);toast('Nuvem ligada. O QR Code aparece em instantes.');await loadFila();render();return wQrPoll()}
    case 'wnuvemoff':{if(!confirm('Desligar o WhatsApp na nuvem do CRM?'))return;const r=await sb.rpc('prosp_wa_nuvem_desligar');if(r.error)return toast(r.error.message);await loadFila();return render()}
    case 'wtoken':{if(st.wst&&st.wst.tem_token&&!confirm('Gerar um novo código desconecta o programa atual até você trocar o arquivo. Continuar?'))return;const r=await sb.rpc('prosp_wa_gerar_token');if(r.error)return toast(r.error.message);st.token=r.data;await loadFila();return render()}
    case 'wbaixar':{if(!st.token)return;const b=new Blob([JSON.stringify({supabaseUrl:SB_URL,supabaseKey:SB_KEY,token:st.token,modo:'prospeccao',porta:3940},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='config.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return toast('Arquivo baixado: coloque na pasta do conector de prospecção')}
    case 'salvarcfg':{const rows=[...document.querySelectorAll('[data-cfg]')].map(i=>({chave:i.dataset.cfg,valor:i.value}));const r=await sb.from('prosp_config').upsert(rows);if(r.error)return toast(r.error.message);rows.forEach(x=>st.cfg[x.chave]=x.valor);toast('Mensagens salvas');return render()}
    case 'padrao':['abordagem','followup','interesse','agradecimento','site_extra','abordagem_emp','followup_emp','interesse_emp','agradecimento_emp'].forEach(k=>st.cfg[k]='');await sb.from('prosp_config').upsert(['abordagem','followup','interesse','agradecimento','site_extra','abordagem_emp','followup_emp','interesse_emp','agradecimento_emp'].map(k=>({chave:k,valor:''})));toast('Texto padrão restaurado');return render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){st.sel[t.dataset.sel]=t.checked;return render()}
  if(t.dataset.marca){st.marc[t.dataset.marca]=t.checked;return render()}
  if(t.dataset.cmarca){(st.cmarc=st.cmarc||{})[t.dataset.cmarca]=t.checked;return render()}
  if(t.dataset.upd){const l=st.leads.find(x=>x.id===t.dataset.upd),f=t.dataset.fld,v=t.value||null;const p={[f]:v};if(f==='status')p.historico=hist(l,'Status: '+STATUS[v]);upd(l.id,p)}
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='agt-txt'&&st.agt){st.agt.txt=e.target.value}
  const t=e.target;
  if(t.id==='ztxt'&&st.zsel){st.ztxt[st.zsel]=t.value;return}
  if(t.id==='zq'){st.zq=t.value;const z=$('#zlist');if(z)z.innerHTML=zLista();return}
  if(t.id==='fq'){st.fq=t.value;const pos=t.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='q'){st.q=e.target.value;buscar(false)}
  if(e.target.id==='ztxt'&&!e.shiftKey&&!isMobile){e.preventDefault();zEnviar()}
  if(e.target.id==='g-p'||e.target.id==='g-e')document.querySelector('[data-a=entrar]').click();
});

async function boot(){
  const {data}=await sb.auth.getSession();
  st.user=data.session?data.session.user:false;
  if(st.user){const r=await sb.rpc('sou_admin');st.admin=r.data===true;if(st.admin){load();aoVivo()}}
  render();
}
boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.admin&&st.loaded)recarregar(300)});
/* aviso na hora quando uma ótica abre o demo */
let vivo=null,vt=0,vp=false;
const digitando=()=>{const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
function recarregar(ms){clearTimeout(vt);vt=setTimeout(()=>{if(digitando()||st.busy){vp=true;return recarregar(2500)}vp=false;const y=scrollY;load().then(()=>scrollTo(0,y))},ms==null?1200:ms)}
document.addEventListener('focusout',()=>{if(vp)recarregar(600)});
function aoVivo(){if(vivo||!st.admin)return;vivo=sb.channel('crm-ao-vivo')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'prosp_acessos'},p=>{const l=st.leads.find(x=>x.id===p.new.lead_id);toast('👀 '+((l&&l.nome)||'Uma empresa')+(p.new.tipo==='agente'?' abriu o teste do agente agora':' abriu o demo agora'));recarregar(300)})
  .on('postgres_changes',{event:'*',schema:'public',table:'prosp_leads'},p=>{const n=p.new,o=st.leads.find(x=>x&&n&&x.id===n.id);if(o&&n&&o.status==='enviado'&&n.status==='respondeu')toast('💬 '+n.nome+' respondeu no WhatsApp');recarregar()})
  .on('postgres_changes',{event:'*',schema:'public',table:'prosp_wa_fila'},()=>recarregar())
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'prosp_wa_msg'},p=>{const n=p.new,o=n&&st.msgs.find(x=>x.id===n.id);if(!o||(o.midia===n.midia&&o.texto===n.texto))return;o.midia=n.midia;o.texto=n.texto;zPintaThread()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'prosp_wa_msg'},p=>{const m=p.new;if(!m||st.msgs.some(x=>x.id===m.id))return;st.msgs.unshift(m);
    if(!m.de_mim){const l=leadDe(k8(m.telefone));if(st.tab==='zap'&&st.zsel===k8(m.telefone)&&!document.hidden)zLidas(st.zsel);else toast('💬 '+(l?nomeCurto(l.nome):fmtFone(m.telefone))+': '+String(m.texto).slice(0,60))}
    if(st.tab==='zap'){if(digitando()){const z=$('#zlist'),t=$('#zthread');if(z)z.innerHTML=zLista();const g=zConvs().find(x=>x.k===st.zsel);if(t&&g){t.innerHTML=zMsgs(g);zRolar()}}else{render();zRolar()}}else render()})
  .subscribe()}
</script>
<script>
/* avisa quando há uma versão nova do sistema publicada (o app da tela de início fica aberto por dias) */
(function(){
  var base=null,ult=0,avisado=false;
  function hash(t){var h=0;for(var i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return h}
  function pegar(){return fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null}).then(function(t){return t?hash(t):null}).catch(function(){return null})}
  function aviso(){
    if(avisado)return;avisado=true;
    var b=document.createElement('button');b.type='button';b.id='nova-versao';
    b.textContent='Nova versão do sistema disponível · toque para atualizar';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:200;background:#1F2A3C;color:#fff;border:0;border-left:3px solid #F2C811;border-radius:4px;padding:11px 16px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100% - 32px)';
    b.onclick=function(){location.reload()};document.body.appendChild(b);
  }
  function checar(){
    var agora=Date.now();if(agora-ult<5*60*1000)return;ult=agora;
    pegar().then(function(h){if(h==null)return;if(base==null){base=h;return}if(h!==base)aviso()});
  }
  window.addEventListener('load',function(){setTimeout(function(){ult=0;checar()},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checar()});
  setInterval(function(){if(!document.hidden)checar()},10*60*1000);
})();
</script>
